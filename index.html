/* iPhone safe-area protection: viewport-fit=cover means the app must explicitly reserve the status-bar/notch region. */
@supports (padding-top: env(safe-area-inset-top)) {
  @media (max-width: 620px) {
    .topbar {
      height: calc(62px + env(safe-area-inset-top));
      min-height: calc(62px + env(safe-area-inset-top));
      padding-top: env(safe-area-inset-top);
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
      align-items: center;
    }
    .top-actions {
      padding-top: 0;
      min-width: 0;
    }
    .top-actions .btn,
    .topbar-left .btn {
      touch-action: manipulation;
    }
    .mobile-nav {
      padding-bottom: max(5px, env(safe-area-inset-bottom));
    }
  }
}

@media (max-width: 620px) {
  .topbar {
    padding-left: 16px;
    padding-right: 16px;
  }
  .topbar-left {
    min-width: 0;

  }
  .topbar-left .icon-btn {
    flex: 0 0 42px;
  }

    flex: 0 0 auto;
  }

}

<script>
(() => {
'use strict';
const KEY='astralsurge.os.v1';
const MODE_KEY='astralsurge.mode',MIN_DB_NAME='astralsurge.minimal.v1',MIN_RETURN_KEY='astralsurge.minimal.return.pending';
function appMode(){try{let m=localStorage.getItem(MODE_KEY);if(m!=='minimal'&&m!=='normal'){m='normal';localStorage.setItem(MODE_KEY,m)}return m}catch(e){return 'normal'}}
const isMinimalMode=()=>appMode()==='minimal';
const now=new Date();
const isoDate=d=>{const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`};const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return isoDate(d)};
let today=isoDate(now);
const fmtTime=m=>{const h=Math.floor(m/60)%24,mm=String(m%60).padStart(2,'0');return `${String(h).padStart(2,'0')}:${mm}`};
const money=n=>state.settings.hideAmounts?'••••':`₹${Number(n||0).toLocaleString('en-IN')}`;
const fmtClock=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
const uid=p=>{const r=window.crypto?.getRandomValues?window.crypto.getRandomValues(new Uint32Array(2)):[Math.random()*0xffffffff>>>0,Math.random()*0xffffffff>>>0];return p+'_'+r[0].toString(36)+r[1].toString(36)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jarg=v=>esc(JSON.stringify(String(v??'')));
const isHexColor=v=>/^#[0-9a-f]{6}$/i.test(String(v||''));
const safeColor=(v,fallback)=>isHexColor(v)?String(v):fallback;
const safeImageData=v=>{const s=String(v||'');return /^data:image\/(?:jpeg|jpg|png|webp);base64,[A-Za-z0-9+/=]+$/i.test(s)&&s.length<=2500000?s:''};
const clone=o=>JSON.parse(JSON.stringify(o));

/* ===== Split: exact paise maths ===== */
const SPLIT_TYPES=['equal','exact','percent','shares'];
const SPLIT_LABEL={equal:'equally',exact:'exact amounts',percent:'by percentage',shares:'by shares'};
const SPLIT_MAX_AMOUNT_P=100000000000; // ₹1,000,000,000.00 cap keeps arithmetic under 2^53
const SPLIT_MAX_SHARES=1000, SPLIT_MAX_PEOPLE=50;
const ISO_DAY=/^\d{4}-\d{2}-\d{2}$/;
function splitValidDay(v){if(!ISO_DAY.test(String(v||'')))return false;const [y,m,d]=String(v).split('-').map(Number),dt=new Date(Date.UTC(y,m-1,d));return dt.getUTCFullYear()===y&&dt.getUTCMonth()===m-1&&dt.getUTCDate()===d}
const isInt=v=>Number.isSafeInteger(v);
const fmtP=p=>{if(state?.settings?.hideAmounts)return '••••';const a=Math.abs(p);return (p<0?'-':'')+'₹'+Math.floor(a/100).toLocaleString('en-IN')+'.'+String(a%100).padStart(2,'0')};
const fmtPct=h=>`${Math.floor(h/100)}.${String(h%100).padStart(2,'0')}%`;
const fmtInput=p=>`${Math.floor(p/100)}.${String(p%100).padStart(2,'0')}`;
/* "1,234.5" -> integer hundredths, or null. Used for paise, and for percentages (max 10000). */
function parseFixed2(str,max){
 const s=String(str??'').trim().replace(/[,\s₹%]/g,'');
 const m=s.match(/^(\d{1,12})(?:\.(\d{1,2}))?$/);
 if(!m)return null;
 const n=Number(m[1])*100+Number((m[2]||'').padEnd(2,'0'));
 return isInt(n)&&n<=max?n:null;
}
/* Largest-remainder allocation: integer weights, shares sum to totalP exactly. */
function allocateLargestRemainder(totalP,entries){
 const W=entries.reduce((a,e)=>a+e.w,0);
 if(!W)return null;
 const raw=entries.map(e=>totalP*e.w);
 const base=raw.map(r=>Math.floor(r/W));
 const rem=raw.map((r,i)=>r-base[i]*W);
 let left=totalP-base.reduce((a,b)=>a+b,0);
 const order=entries.map((_,i)=>i).sort((a,b)=>(rem[b]-rem[a])||(a-b));
 for(let k=0;k<left;k++)base[order[k]]++;
 const out={};entries.forEach((e,i)=>out[e.id]=base[i]);
 return out;
}
function computeSplit(amountP,splitType,includedIds,values){
 const ids=[...new Set(includedIds||[])],v=values||{},num=id=>Number(v[id]);
 if(!ids.length)return {ok:false,error:'Choose at least one person to split between.'};
 if(!isInt(amountP)||amountP<1)return {ok:false,error:'Enter an amount above ₹0.00.'};
 if(splitType==='equal')return {ok:true,shares:allocateLargestRemainder(amountP,ids.map(id=>({id,w:1})))};
 if(splitType==='exact'){
  if(ids.some(id=>!isInt(num(id))||num(id)<0))return {ok:false,error:'Each amount must be zero or more.'};
  const sum=ids.reduce((a,id)=>a+num(id),0);
  if(sum!==amountP)return {ok:false,error:`Amounts add up to ${fmtP(sum)}. They must total ${fmtP(amountP)}.`};
  return {ok:true,shares:Object.fromEntries(ids.map(id=>[id,num(id)]))};
 }
 if(splitType==='percent'){
  if(ids.some(id=>!isInt(num(id))||num(id)<0||num(id)>10000))return {ok:false,error:'Each percentage must be between 0% and 100%.'};
  const sum=ids.reduce((a,id)=>a+num(id),0);
  if(sum!==10000)return {ok:false,error:`Percentages add up to ${fmtPct(sum)}. They must total 100%.`};
  return {ok:true,shares:allocateLargestRemainder(amountP,ids.map(id=>({id,w:num(id)})))};

function pauseFocus(){if(!state.focus.active)return;syncFocusClock();state.focus.active=false;state.focus.paused=true;state.focus.startedAt=null;state.focus.endsAt=null;state.events.push({type:'FOCUS_PAUSED',entityId:state.focus.taskId,at:Date.now()});persist();render();toast('Focus paused')}
function resumeFocus(){if(state.focus.active||!state.focus.taskId)return;state.focus.active=true;state.focus.paused=false;state.focus.startedAt=Date.now();state.focus.endsAt=state.focus.startedAt+state.focus.seconds*1000;state.events.push({type:'FOCUS_RESUMED',entityId:state.focus.taskId,at:Date.now()});persist();render();setNav('focus')}
function scheduleTask(id){const t=taskById(id);if(!t||t.scheduled)return;const at=openSlot(45);if(!at){toast('No open 45-minute window today');return}t.scheduled=true;state.planner.push({id:uid('p'),title:t.title,time:at,duration:45,type:'focus',taskId:id,fixed:false});state.events.push({type:'PLANNER_CREATED',entityId:id,at:Date.now()});closeDrawer();persist();render();toast('Scheduled at '+at)}
function stopFocus(){if(state.focus.active)syncFocusClock();if(!state.focus.active&&!state.focus.paused)return;const spent=Math.max(0,state.focus.initial-state.focus.seconds);const t=taskById(state.focus.taskId);if(t)t.timeSpent+=(spent/60);state.focus.active=false;state.focus.paused=false;state.focus.seconds=state.focus.initial;state.events.push({type:'FOCUS_COMPLETED',entityId:state.focus.taskId,seconds:spent,at:Date.now()});state.xp+=Math.round(spent/60);persist();render();toast('Focus saved')}
let timerHandle=null;
function tick(){if(isMinimalMode()||window.__minimalSwitching||!state.focus.active)return;syncFocusClock();if(state.focus.seconds===0)stopFocus();else renderFocusTimerOnly()}
function renderFocusTimerOnly(){const el=document.getElementById('focus-timer');if(el)el.textContent=fmtClock(state.focus.seconds);const b=document.getElementById('focus-bar');if(b)b.style.width=((state.focus.initial-state.focus.seconds)/state.focus.initial*100)+'%';if(state.focus.active)document.title=fmtClock(state.focus.seconds)+' · Focus'}
function openModal(view,data,opts){document.getElementById('backdrop').classList.add('open');const m=document.getElementById('modal');m.style.display='block';m.innerHTML=view(data,opts)||'';requestAnimationFrame(()=>m.classList.add('open'));}
function closeModal(){pendImgs=[];document.getElementById('backdrop').classList.remove('open');const m=document.getElementById('modal');m.style.display='none';m.classList.remove('open')}
function openDrawer(html){document.getElementById('drawer-content').innerHTML=html;document.getElementById('drawer-backdrop').classList.add('open');document.getElementById('drawer').classList.add('open')}
function closeDrawer(){document.getElementById('drawer-backdrop').classList.remove('open');document.getElementById('drawer').classList.remove('open')}
function taskModal(t,opts={}){t=t||{id:'',title:'',desc:'',priority:'Medium',energy:'Light',due:today,important:false,urgent:false,status:'Inbox',tags:[],timeSpent:0,scheduled:false,goalId:state.goals[0]?.id||''};return `<div class="modal-inner"><div class="split"><div><div class="eyebrow">${t.id?'Task':'Quick capture'}</div><h2 id="modal-title" style="margin:4px 0 4px">${esc(t.title||'New task')}</h2><div class="quiet">${opts.recommendation?'A dry-run preview is required before changing your planner.':''}</div></div><button class="btn icon-btn" onclick="closeModal()">×</button></div><form class="form" onsubmit="saveTask(event,${jarg(t.id)})" style="margin-top:18px"><div class="field"><label>Title</label><input name="title" required value="${esc(t.title)}"></div><div class="field"><label>Description</label><textarea name="desc">${esc(t.desc||'')}</textarea></div><div class="grid grid-2"><div class="field"><label>Priority</label><select name="priority">${['Low','Medium','High'].map(x=>`<option ${t.priority===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Energy</label><select name="energy">${['Light','Focused','Deep'].map(x=>`<option ${t.energy===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="grid grid-2"><div class="field"><label>Due date</label><input type="date" name="due" value="${esc(t.due||'')}"></div><div class="field"><label>Status</label><select name="status">${['Inbox','To Do','In Progress','Completed'].map(x=>`<option ${t.status===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>Goal</label><select name="goalId"><option value="">No goal</option>${state.goals.map(g=>`<option value="${g.id}" ${t.goalId===g.id?'selected':''}>${esc(g.title)}</option>`).join('')}</select></div><div class="field"><label>Repeat</label><select name="repeat"><option value="none" ${(t.repeat||"none")==="none"?"selected":""}>Does not repeat</option><option value="daily" ${t.repeat==="daily"?"selected":""}>Every day</option><option value="weekdays" ${t.repeat==="weekdays"?"selected":""}>Every weekday</option><option value="weekly" ${t.repeat==="weekly"?"selected":""}>Every week</option></select><div class="field-help">When you complete it, the next one is created automatically.</div></div><div class="field"><label>Tags</label><input name="tags" placeholder="e.g. launch, client, finance" value="${esc((t.tags||[]).join(', '))}"><div class="field-help">Comma-separated. Tags show on the task and are searchable.</div></div><div class="chips"><label class="check"><input type="checkbox" name="important" ${t.important?'checked':''}> Important</label><label class="check"><input type="checkbox" name="urgent" ${t.urgent?'checked':''}> Urgent</label></div>${opts.recommendation?`<div class="success-note"><b>Preview:</b> create one 45-minute planner entry at ${openSlot(45)||'the first open window (none free today)'}. Existing commitments are unchanged.</div>`:''}${imgZone(t.images)}<div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">${opts.recommendation?'Save & schedule':'Save task'}</button></div></form></div>`}
function saveTask(e,id){e.preventDefault();const f=new FormData(e.target);const wasDone=!!(id&&taskById(id)&&taskById(id).status==='Completed');let t=id?taskById(id):{id:uid('tsk'),tags:[],timeSpent:0,scheduled:false};Object.assign(t,{title:f.get('title'),desc:f.get('desc'),priority:f.get('priority'),energy:f.get('energy'),due:f.get('due')||null,status:f.get('status'),important:f.get('important')==='on',urgent:f.get('urgent')==='on',goalId:f.get('goalId')||null,repeat:pickOne(f.get('repeat'),REPEAT_RULES,'none'),tags:String(f.get('tags')||'').split(',').map(x=>x.trim()).filter(Boolean).slice(0,12)});t.images=pendImgs.slice();if(!wasDone&&t.status==='Completed')spawnNextRecurrence(t);if(!id)state.tasks.unshift(t);const opts=e.target.querySelector('.success-note');if(opts){const at=openSlot(45);if(at){t.scheduled=true;state.planner.push({id:uid('p'),title:t.title,time:at,duration:45,type:'focus',taskId:t.id,fixed:false})}}if(t.status==='Completed')dropBlocks(t);if(nav()==='work')window.workTab=t.status;state.events.push({type:id?'TASK_UPDATED':'TASK_CREATED',entityId:t.id,at:Date.now()});persist();closeModal();render()}
function noteModal(n={id:'',title:'',content:'',tags:[]}){return `<div class="modal-inner note-edit-modal"><div class="split"><div><div class="eyebrow">Note</div><h2 id="modal-title" style="margin:4px 0 4px">Capture context</h2></div><button class="btn icon-btn" onclick="closeModal()">×</button></div><form class="form" onsubmit="saveNote(event,${jarg(n.id)})" style="margin-top:18px"><div class="field"><label>Title</label><input name="title" required value="${esc(n.title)}"></div><div class="field"><label>Content</label><textarea name="content" required>${esc(n.content)}</textarea></div><div class="field"><label>Tags</label><input name="tags" value="${esc((n.tags||[]).join(', '))}"></div>${imgZone(n.images)}<div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save note</button></div></form></div>`}
function saveNote(e,id){e.preventDefault();const f=new FormData(e.target);let n=id?state.notes.find(x=>x.id===id):{id:uid('note')};Object.assign(n,{title:f.get('title'),content:f.get('content'),tags:String(f.get('tags')).split(',').map(x=>x.trim()).filter(Boolean),created:n.created||today});n.images=pendImgs.slice();if(!id)state.notes.unshift(n);state.events.push({type:id?'NOTE_UPDATED':'NOTE_CREATED',entityId:n.id,at:Date.now()});persist();closeModal();render()}
function expenseModal(){return `<div class="modal-inner"><div class="split"><div><div class="eyebrow">Quick capture</div><h2 id="modal-title" style="margin:4px 0">Expense</h2></div><button class="btn icon-btn" onclick="closeModal()">×</button></div><form class="form" onsubmit="saveExpense(event)" style="margin-top:18px"><div class="grid grid-2"><div class="field"><label>Amount</label><input name="amount" type="number" min="0.01" step="0.01" required placeholder="1240"></div><div class="field"><label>Category</label><select name="category">${[...new Set([...state.budgets.map(b=>b.name),'Food','Other'])].map(x=>`<option>${esc(x)}</option>`).join('')}</select></div></div><div class="field"><label>Description</label><input name="title" required placeholder="What was this expense?"></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save expense</button></div></form></div>`}
function saveExpense(e){e.preventDefault();const f=new FormData(e.target);state.transactions.unshift({id:uid('tx'),title:f.get('title'),amount:Number(f.get('amount')),category:f.get('category'),date:today});{const b=state.budgets.find(x=>x.name===f.get('category'));if(b)b.spent+=Number(f.get('amount'))}state.events.push({type:'TRANSACTION_CREATED',at:Date.now()});persist();closeModal();render()}
function decisionModal(d){return `<div class="modal-inner"><div class="split"><div><div class="eyebrow">Financial decision</div><h2 id="modal-title" style="margin:4px 0">${esc(d.title)}</h2></div><button class="btn icon-btn" onclick="closeModal()">×</button></div><div class="grid grid-3" style="margin-top:18px"><div class="metric surface"><div class="label">Projected</div><div class="value">${money(d.projected)}</div></div><div class="metric surface"><div class="label">Actual</div><div class="value">${money(d.actual)}</div></div><div class="metric surface"><div class="label">Variance</div><div class="value">${money(Math.abs(d.projected-d.actual))}</div><div class="trend">${d.actual<=d.projected?'under':'over'} projected</div></div></div><div class="success-note" style="margin-top:16px">This is a reconciliation action only. It does not give financial advice or change the transaction.</div><div class="form-actions" style="margin-top:16px"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="reconcile(${jarg(d.id)})">Reconcile</button></div></div>`}
function openDecision(id){const d=state.decisions.find(x=>x.id===id);if(d)openModal(decisionModal,d)} function reconcile(id){const d=state.decisions.find(x=>x.id===id);if(!d)return;d.status='Reconciled';state.events.push({type:'DECISION_RECONCILED',entityId:id,at:Date.now()});persist();closeModal();render();toast('Reconciled')}
function createGoalModal(){return `<div class="modal-inner"><div class="split"><div><div class="eyebrow">Goal / pathway</div><h2 id="modal-title" style="margin:4px 0">Create a goal</h2></div><button class="btn icon-btn" onclick="closeModal()">×</button></div><form class="form" onsubmit="saveGoal(event)" style="margin-top:18px"><div class="field"><label>Outcome</label><input name="title" required placeholder="What are you trying to achieve?"></div><div class="field"><label>First milestone</label><input name="step" required placeholder="The next concrete step"></div><div class="field"><label>Activity type</label><select name="type"><option>task</option><option>note</option><option>workout</option><option>time</option><option>story</option><option>finance</option></select></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Create goal</button></div></form></div>`}
function saveGoal(e){e.preventDefault();const f=new FormData(e.target);const g={id:uid('goal'),title:f.get('title'),progress:0,steps:[{id:uid('step'),title:f.get('step'),type:f.get('type'),done:false}]};state.goals.unshift(g);state.events.push({type:'GOAL_CREATED',entityId:g.id,at:Date.now()});persist();closeModal();render();setNav('goals')}
function globalCreate(){openModal(()=>`<div class="modal-inner"><div class="split"><div><div class="eyebrow">Create</div><h2 id="modal-title" style="margin:4px 0">Capture intent</h2></div><button class="btn icon-btn" onclick="closeModal()">×</button></div><div class="grid grid-2" style="margin-top:18px"><button class="btn" type="button" onclick="openModal(taskModal)"><b>+ Task</b><span class="muted-line">Something to do</span></button><button class="btn" type="button" onclick="openModal(noteModal)"><b>+ Note</b><span class="muted-line">Something to remember</span></button><button class="btn" type="button" onclick="openModal(expenseModal)"><b>+ Expense</b><span class="muted-line">Quick financial reality</span></button><button class="btn" type="button" onclick="openModal(createGoalModal)"><b>More</b><span class="muted-line">Project, goal, workout, budget</span></button></div></div>`)}
function inspect(entityType,id){
 let html='';
 if(entityType==='task'){const t=taskById(id);if(!t)return;html=`<div class="eyebrow">Task</div><h2>${esc(t.title)}</h2><div class="chips"><span class="chip">${esc(t.priority)}</span><span class="chip">${esc(t.energy)}</span>${t.important?'<span class="chip accent">Important</span>':''}${(t.tags||[]).map(x=>`<span class="chip accent">#${esc(x)}</span>`).join('')}</div><p class="muted-line" style="margin-top:14px">${esc(t.desc||'No description')}</p>${thumbs(t.images)}${subsHtml(t)}<div class="actions"><button class="btn primary" onclick="startFocus(${jarg(t.id)})">Focus</button>${!t.scheduled&&t.status!=='Completed'?`<button class="btn" onclick="scheduleTask(${jarg(t.id)})">Schedule 45m</button>`:''}${t.status!=='Completed'?`<button class="btn" onclick="completeTask(${jarg(t.id)})">Complete</button>`:''}<button class="btn" onclick="closeDrawer();openModal(taskModal,taskById(${jarg(t.id)}))">Edit</button><button class="btn" onclick="deleteTask(${jarg(t.id)})">Delete</button></div><div class="section"><div class="eyebrow">Relationships</div><div class="grid" style="margin-top:10px"><div class="surface" style="padding:13px">Focus · ${t.timeSpent.toFixed(0)}m logged</div><div class="surface" style="padding:13px">Planner · ${t.scheduled?'Scheduled':'Unscheduled'}</div><div class="surface" style="padding:13px">Goal · ${esc(goalName(t))}</div></div></div>`}
 if(entityType==='rule'){const r=RULES.find(x=>x.id===id);if(!r)return;html=`<div class="eyebrow">Rule inspector</div><h2>${esc(r.name)}</h2><div class="section"><div class="eyebrow">Observed</div><div class="chips" style="margin-top:9px">${r.evidence.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div><div class="section"><div class="eyebrow">Result</div><div class="surface" style="padding:14px;margin-top:9px">${esc(r.result)}</div></div>`}
 if(entityType==='vault'){html=vaultDrawer()}
 openDrawer(html||'<div class="empty"><strong>Nothing to inspect</strong></div>')
}
const RULES=[
 {id:'task_unscheduled_due_soon',name:'Important task is unscheduled',evidence:['High priority','Due today','No planner block','45m open'],result:'Suggested a 45-minute focus block.'},
 {id:'deep_task_open_window',name:'Deep task has a good window',evidence:['Energy = Deep','Open window ≥ 45m','No conflict'],result:'Make the compatible work session easy to start.'},
 {id:'stalled_task',name:'Task resurfacing without progress',evidence:['Repeated unfinished state','No recent progress'],result:'Offer Continue / Break down / Schedule / Dismiss.'},
 {id:'budget_pressure',name:'Budget pressure',evidence:['Actual ≥ 85% of configured limit'],result:'Show a review signal without telling the user what to spend.'},
 {id:'decision_awaiting_actual',name:'Decision ready to reconcile',evidence:['Provisional decision','Actual outcome available'],result:'Open a reconciliation preview.'},
 {id:'backup_overdue',name:'Backup is overdue',evidence:['Last backup beyond threshold'],result:'Surface a recovery action.'}
];
function viewWork(){const tabs=['Inbox','To Do','In Progress','Completed'];const current=window.workTab||'To Do';const list=state.tasks.filter(t=>t.status===current);return `<div class="page"><div class="split"><div><div class="eyebrow">Work</div><div class="h1">What needs doing?</div><div class="lead">A direct execution surface. Tasks remain connected to focus, time, goals, notes, and history.</div></div><button class="btn primary" onclick="openModal(taskModal)">+ Task</button></div><section class="section"><div class="tabs">${tabs.map(t=>`<button class="tab ${current===t?'active':''}" onclick="window.workTab='${t}';render()">${t}</button>`).join('')}</div></section><section class="section panel"><div class="panel-header"><h2>${current}</h2><small>${list.length} items</small></div><div class="list">${list.length?list.map(t=>`<div class="row task-card" style="border-left:3px solid ${t.urgent?'var(--red)':t.priority==='High'?'var(--amber)':t.priority==='Medium'?'var(--blue)':'var(--line)'}"><div class="row-main task-card-main"><div class="row-title"><a class="entity-link ${t.status==='Completed'?'done-text':''}" href="#/work" onclick="inspect('task',${jarg(t.id)});return false">${esc(t.title)}</a></div><div class="row-meta">${t.due?`Due ${dateShort(t.due)} · `:''}${t.energy} · ${t.timeSpent.toFixed(0)}m logged ${t.scheduled?'· scheduled':''} ${(t.subtasks||[]).length?`· ${t.subtasks.filter(x=>x.done).length}/${t.subtasks.length} subtasks`:''}</div><div class="chips" style="margin-top:7px"><span class="chip">🎯 ${esc(goalName(t))}</span>${(t.tags||[]).map(x=>`<span class="chip accent">#${esc(x)}</span>`).join('')}<span class="chip">${esc(t.priority)}</span>${t.important?'<span class="chip accent">Important</span>':''}${t.urgent?'<span class="chip danger">Urgent</span>':''}</div></div><div class="row-actions task-card-actions"><button class="btn mini" onclick="inspect('task',${jarg(t.id)})">Inspect</button>${t.status!=='Completed'?`<button class="btn mini accent" onclick="startFocus(${jarg(t.id)})">Focus</button><button class="btn mini" onclick="completeTask(${jarg(t.id)})">Complete</button>`:''}</div></div>`).join(''):`<div class="empty"><strong>No tasks here yet.</strong>Capture something you need to do.<div style="margin-top:12px"><button class="btn primary" onclick="openModal(taskModal)">Add task</button></div></div>`}</div></section><section class="section grid grid-2"><div class="panel"><div class="panel-header"><h2>Execution rules</h2><small>deterministic</small></div><div class="rule-card"><div class="rule-id">deep_task_open_window</div><div class="rule-name">Good window for deep work</div><div class="rule-why">When a compatible task and open time coexist, the system surfaces the opportunity without changing the schedule.</div></div><div class="rule-card"><div class="rule-id">stalled_task</div><div class="rule-name">This keeps coming back</div><div class="rule-why">The engine can offer a different action without inventing psychological explanations.</div></div></div><div class="panel"><div class="panel-header"><h2>Relationships</h2><small>one object, many contexts</small></div><div style="padding:18px"><div class="chips"><span class="chip accent">Task</span><span class="chip">→ Focus</span><span class="chip">→ Time log</span><span class="chip">→ Planner</span><span class="chip">→ Goal</span><span class="chip">→ Activity</span></div><p class="muted-line" style="margin-top:12px">The navigation is one way to access the object. Contextual links are equally important.</p></div></div></section></div>`}
function viewFocus(){let t=taskById(state.focus.taskId);if(!t||t.status==='Completed')t=state.tasks.find(x=>x.status!=='Completed');return `<div class="page"><div class="eyebrow">Focus</div><div class="h1">What am I doing now?</div><div class="lead">A dedicated concentration surface. No dashboard analytics while the timer is active.</div><section class="section"><div class="panel focus-panel" style="min-height:420px;display:grid;align-content:center;justify-items:center;text-align:center"><div class="eyebrow">${state.focus.active?'Current task':state.focus.paused?'Paused':'Ready'}</div><h2 style="font-size:28px;margin:10px 0">${esc(t?.title||'Choose a task to focus on')}</h2><div id="focus-timer" style="font-size:74px;letter-spacing:-.06em;line-height:1;font-variant-numeric:tabular-nums;margin:2px 0 4px">${fmtClock(state.focus.seconds)}</div><div class="bar" style="width:min(320px,80%);margin:0 auto 12px"><i id="focus-bar" style="width:${state.focus.initial?(state.focus.initial-state.focus.seconds)/state.focus.initial*100:0}%"></i></div><div class="chips"><span class="chip accent">${esc(state.focus.category)}</span>${t?`<span class="chip">${esc(t.energy)}</span>`:''}</div>${!state.focus.active&&!state.focus.paused?`<div class="chips" style="margin-bottom:12px;justify-content:center">${[15,25,45,60].map(m=>`<button class="chip ${(state.focus.len||25)===m?'accent':''}" onclick="setFocusLen(${m})" style="cursor:pointer">${m}m</button>`).join('')}</div>`:''}<div class="actions" style="justify-content:center">${state.focus.active?`<button class="btn primary" onclick="stopFocus()">End & save</button><button class="btn" onclick="pauseFocus()">Pause</button>`:`<button class="btn primary" onclick="${t?(state.focus.paused?'resumeFocus()':`startFocus(${jarg(t.id)})`):'globalCreate()'}">${t?(state.focus.paused?'Resume Focus':'Start Focus'):'Choose task'}</button>${state.focus.paused?`<button class="btn" onclick="stopFocus()">End & save</button>`:''}<button class="btn" onclick="setNav('work')">Browse work</button>`}</div><div class="reason" style="max-width:540px"><b>State-aware:</b> when focus is active, unrelated recommendations are suppressed and the active task remains accessible from Today, Work, Plan, and the task inspector.</div></div></section><section class="section grid grid-3"><div class="panel metric"><div class="label">Today's focus</div><div class="value">${loggedMin()}m</div><div class="trend">logged time</div></div><div class="panel metric"><div class="label">Category</div><div class="value" style="font-size:18px">Deep Work</div><div class="trend">local preference</div></div><div class="panel metric"><div class="label">XP</div><div class="value">${state.xp}</div><div class="trend">real actions first</div></div></section></div>`}
function viewPlan(){const hours=state.planner.reduce((a,b)=>a+b.duration,0);const upcoming=[
  {date:addDays(3),title:'Demo rehearsal',type:'work',kind:'calendar'},
  {date:addDays(4),title:'Workout',type:'life',kind:'life'},

const AMBIENT_TYPES=['Stars','Snow','Cosmic Dust','Night Drift','Off'];

 const c=document.getElementById('ambient-canvas');if(!c)return;
 const reduce=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
 const type=AMBIENT_TYPES.includes(state.settings.ambientEffect)?state.settings.ambientEffect:'Stars';
 c.style.opacity=(ambientOpacity()/100).toFixed(2);
 c.style.display=reduce||type==='Off'?'none':'block';
 if(reduce||type==='Off'){cancelAnimationFrame(__ambientRaf);__ambientRaf=0;return}
 const dpr=Math.min(window.devicePixelRatio||1,2);const w=Math.max(1,window.innerWidth),h=Math.max(1,window.innerHeight);
 __ambientW=w;__ambientH=h;c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);c.style.width=w+'px';c.style.height=h+'px';
 const ctx=c.getContext('2d');if(!ctx)return;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=(document.documentElement.getAttribute('data-theme')==='light')?'rgba(79,91,116,.95)':'rgba(255,255,255,.98)';__ambientParticles=ambientParticles(type,w,h,ambientStrength());

function ambientParticles(type,w,h,strength=45){
 const mobile=w<700;const base=Math.round((w*h)/22000);const scale=.35+.65*(Math.max(10,Math.min(90,strength))-10)/80;const count=Math.min(mobile?42:68,Math.max(8,Math.round(base*scale)));
 const a=[];for(let i=0;i<count;i++){
  a.push({x:Math.random()*w,y:Math.random()*h,r:.45+Math.random()*(type==='Snow'?1.15:1.8),a:.20+Math.random()*.48,phase:Math.random()*Math.PI*2,speed:.06+Math.random()*.16,drift:(Math.random()-.5)*.16,tw:.4+Math.random()*1.2,depth:.4+Math.random()*.7});
 }

}
function ambientFrame(ts){
 const c=document.getElementById('ambient-canvas');if(!c)return;const type=AMBIENT_TYPES.includes(state.settings.ambientEffect)?state.settings.ambientEffect:'Stars';
 if(type==='Off'||window.matchMedia?.('(prefers-reduced-motion: reduce)').matches){c.style.display='none';__ambientRaf=0;return}
 c.style.opacity=(ambientOpacity()/100).toFixed(2);
 if(!__ambientLast)__ambientLast=ts;const dt=Math.min(50,ts-__ambientLast);if(dt<32){__ambientRaf=requestAnimationFrame(ambientFrame);return}__ambientLast=ts;
 const ctx=c.getContext('2d');if(!ctx){__ambientRaf=0;return}ctx.clearRect(0,0,__ambientW,__ambientH);ctx.save();ctx.globalCompositeOperation='screen';
 const t=ts/1000;
 for(const p of __ambientParticles){
  if(type==='Snow'){
   p.y += (p.speed*18*dt/16.7)*p.depth;p.x += (Math.sin(t*p.tw+p.phase)*.22+p.drift)*dt;
   if(p.y>__ambientH+8){p.y=-8;p.x=Math.random()*__ambientW}
   if(p.x>__ambientW+8)p.x=-8;if(p.x<-8)p.x=__ambientW+8;

  }else if(type==='Stars'){
   const drift=Math.sin(t*.08+p.phase)*.05;p.x += drift*dt;if(p.x>__ambientW+4)p.x=-4;if(p.x<-4)p.x=__ambientW+4;
   const tw=.35+.65*(.5+.5*Math.sin(t*p.tw+p.phase));ctx.globalAlpha=p.a*.60*tw;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  }else if(type==='Cosmic Dust'){
   p.x += Math.cos(t*.16+p.phase)*p.speed*dt*.45;p.y += Math.sin(t*.13+p.phase)*p.speed*dt*.35;
   if(p.x>__ambientW+6)p.x=-6;if(p.x<-6)p.x=__ambientW+6;if(p.y>__ambientH+6)p.y=-6;if(p.y<-6)p.y=__ambientH+6;
   const glow=.42+.58*(.5+.5*Math.sin(t*.45+p.phase));ctx.globalAlpha=p.a*.36*glow;ctx.beginPath();ctx.arc(p.x,p.y,p.r*1.15,0,Math.PI*2);ctx.fill();
  }else{
   p.x += (Math.sin(t*.12+p.phase)*.18+p.drift)*dt;p.y += Math.cos(t*.09+p.phase)*.08*dt;
   if(p.x>__ambientW+8)p.x=-8;if(p.x<-8)p.x=__ambientW+8;if(p.y>__ambientH+8)p.y=-8;if(p.y<-8)p.y=__ambientH+8;
   const tw=.5+.5*(.5+.5*Math.sin(t*.6+p.phase));ctx.globalAlpha=p.a*.32*tw;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  }
 }

 __ambientRaf=requestAnimationFrame(ambientFrame);
}

const AMBIENT_SOUND_TYPES=['Off','White noise','Pink noise','Brown noise'];
let __focusAudio={ctx:null,gain:null,source:null,playing:false,type:'Off'};

function makeNoiseBuffer(ctx,type,seconds=3){
 const sampleRate=ctx.sampleRate,b=Math.max(1,Math.floor(sampleRate*seconds)),buffer=ctx.createBuffer(1,b,sampleRate),data=buffer.getChannelData(0);

 for(let i=0;i<b;i++){const white=Math.random()*2-1;let v=white;
  if(type==='Pink noise'){pinkB0=.99886*pinkB0+white*.0555179;pinkB1=.99332*pinkB1+white*.0750759;pinkB2=.96900*pinkB2+white*.1538520;pinkB3=.86650*pinkB3+white*.3104856;pinkB4=.55000*pinkB4+white*.5329522;pinkB5=-.7616*pinkB5-white*.0168980;v=(pinkB0+pinkB1+pinkB2+pinkB3+pinkB4+pinkB5+pinkB6+white*.5362)*.11;pinkB6=white*.115926;}
  else if(type==='Brown noise'){brown=(brown+white*.02)/1.02;v=brown*3.5;}
  data[i]=Math.max(-1,Math.min(1,v*.7));

}

async function restoreCheckpoint(){

 if(!confirm('Replace current data with the checkpoint? Current workspace will be overwritten. You can undo this for 24 hours.'))return;if(!await stashUndo('Before checkpoint restore'))return;
 const v=state.vault||{};
 if(v.encryptionEnabled&&!__vaultDataKey){toast('Unlock the vault first');return}
 const next=normalizeWorkspace(c,{fromImport:true});
 next.vault=Object.assign({},next.vault,{locked:false,encryptionEnabled:!!v.encryptionEnabled,recoveryAvailable:true,lastBackup:v.lastBackup||null,lastCheckpoint:v.lastCheckpoint||null});
 if(next.vault.encryptionEnabled)next.vault.encryptionMeta=clone(v.encryptionMeta||{});else delete next.vault.encryptionMeta;
 state=next;evSeen=state.events.length;closeDrawer();persist();render();toast('Checkpoint restored')
}

let pendingRestore=null;
function restorePreview(){
 if(!pendingRestore||!pendingRestore.workspace){toast('No backup selected');return}
 const ws=pendingRestore.workspace,m=pendingRestore.meta||{};
 const counts=WORKSPACE_LISTS.filter(k=>k in ws).map(k=>{const cur=new Set((state[k]||[]).map(x=>String(x.id)));const inc=new Set((ws[k]||[]).map(x=>String(x.id)));let a=0,r=0;inc.forEach(i=>{if(!cur.has(i))a++});cur.forEach(i=>{if(!inc.has(i))r++});return `<div class="surface" style="padding:13px">${k} · ${ws[k].length} in backup · <b>+${a}</b> new · <b>−${r}</b> would be removed</div>`}).join('');
 const when=m.exportedAt?String(m.exportedAt).slice(0,10):'unknown date';

async function applyRestore(){
 if(!pendingRestore||pendingRestore.encrypted||!pendingRestore.workspace){toast('Nothing to restore');return}
 if(window.__asosReadOnly){toast('Editing is paused; restore blocked to protect existing data');return}
 const wasEncrypted=!!state.vault?.encryptionEnabled;
 if(wasEncrypted&&!__vaultDataKey){toast('Unlock the vault before restoring');return}
 if(!confirm('Replace the current workspace with this backup? Current data will be overwritten. You can undo this for 24 hours.'))return;if(!await stashUndo('Before backup restore'))return;
 const keep=wasEncrypted?clone(state.vault.encryptionMeta||{}):null;
 const prev=state.vault||{};
 const next=normalizeWorkspace(pendingRestore.workspace,{fromImport:true});
 next.vault=Object.assign({},next.vault,{locked:false,encryptionEnabled:wasEncrypted,recoveryAvailable:true,lastBackup:prev.lastBackup||null,lastCheckpoint:prev.lastCheckpoint||null});
 if(wasEncrypted)next.vault.encryptionMeta=keep;else delete next.vault.encryptionMeta;
 state=next;evSeen=state.events.length;pendingRestore=null;closeDrawer();persist();render();
 toast(wasEncrypted?'Workspace restored and re-encrypted':'Workspace restored');
}

 const meta=state.vault.encryptionMeta;if(!__vaultDataKey||!meta?.recoveryWrap){toast('Unlock the encrypted vault first');return}
 const salt=crypto.getRandomValues(new Uint8Array(16)),pkey=await deriveVaultKey(pass,salt),raw=await crypto.subtle.exportKey('raw',__vaultDataKey),passWrap=await wrapRaw(pkey,raw);
 state.vault.encryptionMeta={...meta,salt:b64u(salt),iterations:ENC_ITER,passWrap};await persistEncryptedSnapshot(state);toast('Passphrase changed');render();
}
async function unlockVault(mode='pass'){
 const env=__encryptedEnvelope||(()=>{try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}})();
 if(vaultEnvelope(env)){
  try{
   let dataKey;
   if(mode==='recovery'){
    const k=await crypto.subtle.importKey('raw',fromB64u(q('#recovery-input')?.value.trim()),{name:'AES-GCM'},false,['encrypt','decrypt']);
    const raw=await unwrapRaw(k,env.recoveryWrap.iv,env.recoveryWrap.data);dataKey=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['encrypt','decrypt']);
   }else{
    const pass=q('#unlock-input')?.value||'';if(!pass){toast('Enter your passphrase');return}
    const pkey=await deriveVaultKey(pass,fromB64u(env.salt),env.iterations);const raw=await unwrapRaw(pkey,env.passWrap.iv,env.passWrap.data);dataKey=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['encrypt','decrypt']);
   }
   const plain=await openEncryptedSnapshot(env,dataKey);const snap=JSON.parse(plain);const ws=(snap&&snap.format===BACKUP_FORMAT&&isPlainObj(snap.workspace))?snap.workspace:snap;state=normalizeWorkspace(ws);state.vault=Object.assign({},state.vault,{locked:false,encryptionEnabled:true,recoveryAvailable:true,encryptionMeta:{salt:env.salt,iterations:env.iterations,passWrap:env.passWrap,recoveryWrap:env.recoveryWrap}});__vaultDataKey=dataKey;__encryptedEnvelope=env;__vaultReady=true;persist();render();toast('Vault unlocked');maybeAutoCheckpoint();
  }catch(e){toast(mode==='recovery'?'Recovery key rejected':'Wrong passphrase')}
  return;
 }
 // legacy screen-lock fallback for old beta vaults
 const i=q('#unlock-input');if(state.vault.pass&&(!i||await sha(i.value)!==state.vault.pass)){toast('Wrong passphrase');return}state.vault.locked=false;persist();render();toast('Vault unlocked')
}

function stripImagesForExport(input){let count=0,bytes=0;const seen=new WeakMap();const walk=v=>{if(typeof v==='string'){if(isImageDataString(v)){count++;bytes+=v.length;return null}return v}if(Array.isArray(v))return v.map(walk);if(v&&typeof v==='object'){if(seen.has(v))return seen.get(v);const out={};seen.set(v,out);for(const [k,val] of Object.entries(v))out[k]=walk(val);return out}return v};return {data:walk(clone(input)),count,bytes}}

function monday(d){const x=new Date(d+'T12:00:00');const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return isoDate(x)}
function weekDates(weeksAgo=0){const end=new Date(today+'T12:00:00');end.setDate(end.getDate()-weeksAgo*7);const start=new Date(end);start.setDate(end.getDate()-6);return {start:isoDate(start),end:isoDate(end)}}
function eventCountBetween(type,start,end){const a=new Date(start+'T00:00:00').getTime(),b=new Date(end+'T23:59:59').getTime();return state.events.filter(e=>e.type===type&&e.at>=a&&e.at<=b).length}
function focusWeekMin(start,end){const a=new Date(start+'T00:00:00').getTime(),b=new Date(end+'T23:59:59').getTime();return Math.round(state.events.filter(e=>e.type==='FOCUS_COMPLETED'&&e.at>=a&&e.at<=b).reduce((m,e)=>m+(Number(e.seconds||0)/60),0))}

function badgeShelf(){awardBadges();return `<section class="section panel"><div class="panel-header"><h2>Trophy shelf</h2><small>${state.badges.length}/${BADGES.length} unlocked</small></div><div style="padding:18px" class="feature-grid">${BADGES.map(b=>{const on=state.badges.includes(b.id);return `<div class="badge-tile ${on?'':'locked'}"><div class="badge-icon">${on?b.icon:'◌'}</div><div><div class="badge-name">${esc(b.name)}</div><div class="badge-desc">${esc(b.desc)}</div></div><span class="status-badge ${on?'done':'open'}">${on?'unlocked':'locked'}</span></div>`}).join('')}</div></section>`}
function viewProgress(){const done=state.events.filter(e=>e.type==='TASK_COMPLETED').length;const d=weeklyReviewData();return `<div class="page"><div class="eyebrow">Progress</div><div class="h1">Celebrate what actually happened.</div><div class="lead">Rewards reinforce real behavior. The weekly review turns raw activity into a useful reflection.</div>${weeklyReviewCard()}<section class="section grid grid-3"><div class="panel metric"><div class="label">Level</div><div class="value">${levelInfo().lvl}</div><div class="trend">${state.xp} XP</div></div><div class="panel metric"><div class="label">Streak</div><div class="value">${state.streak}</div><div class="trend">days</div></div><div class="panel metric"><div class="label">Completed</div><div class="value">${done}</div><div class="trend">tasks recorded</div></div></section>${badgeShelf()}${activitySection()}</div>`}

function parseWorkoutText(raw){const ex=[];String(raw||'').split(/\n+/).map(x=>x.trim()).filter(Boolean).forEach(line=>{const [name,...rest]=line.split('|');const sets=String(rest.join('|')).split(',').map(x=>x.trim()).filter(Boolean).map(seg=>{const m=seg.match(/^(\d+)x(\d+)(?:@([\d.]+))?$/i);return m?{sets:Number(m[1]),reps:Number(m[2]),weight:Number(m[3]||0)}:null}).filter(Boolean);if(name&&sets.length)ex.push({name:name.trim(),sets})});return ex}
function workoutText(w){return (w.exercises||[]).map(e=>`${e.name}|${e.sets.map(s=>`${s.sets}x${s.reps}${s.weight?`@${s.weight}`:''}`).join(', ')}`).join('\n')}
function workoutModal(w={id:'',title:"Today's session",type:'Strength',duration:45,rpe:7,date:today,exercises:[]}){return `<div class="modal-inner"><div class="split"><div><div class="eyebrow">Fitness log</div><h2 id="modal-title">Track the work, not just the workout.</h2></div><button class="btn icon-btn" onclick="closeModal()">×</button></div><form class="form" onsubmit="saveWorkout(event,${jarg(w.id)})" style="margin-top:18px"><div class="grid grid-2"><div class="field"><label>Workout</label><input name="title" required value="${esc(w.title)}"></div><div class="field"><label>Type</label><select name="type">${['Strength','Run','Cycle','Mobility','Sport','Other'].map(x=>`<option ${w.type===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="grid grid-3"><div class="field"><label>Minutes</label><input name="duration" type="number" min="1" value="${w.duration}"></div><div class="field"><label>RPE</label><input name="rpe" type="number" min="1" max="10" value="${w.rpe||6}"></div><div class="field"><label>Date</label><input name="date" type="date" value="${w.date||today}"></div></div><div class="field"><label>Exercises & sets</label><textarea name="exercises" placeholder="Bench Press|3x8@60, 2x6@70\nLat Pulldown|3x10@45">${esc(workoutText(w))}</textarea><div class="field-help">One exercise per line: <b>Exercise|sets×reps@weight</b>. Multiple set blocks are comma-separated. Weight is optional.</div></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save workout</button></div></form></div>`}
function saveWorkout(e,id){e.preventDefault();const f=new FormData(e.target),ex=parseWorkoutText(f.get('exercises')),w=id?state.workouts.find(x=>x.id===id):{id:uid('w')};Object.assign(w,{title:String(f.get('title')).trim(),type:f.get('type'),duration:Number(f.get('duration')),rpe:Number(f.get('rpe')),date:f.get('date'),exercises:ex});if(!id)state.workouts.unshift(w);state.events.push({type:id?'WORKOUT_UPDATED':'WORKOUT_LOGGED',entityId:w.id,at:Date.now()});state.xp+=15;persist();closeModal();render();toast('Workout saved')}
function logWorkout(){openModal(workoutModal)}
function fitnessStats(){const all=[];(state.workouts||[]).forEach(w=>(w.exercises||[]).forEach(e=>(e.sets||[]).forEach(s=>{const volume=(Number(s.sets)||0)*(Number(s.reps)||0)*(Number(s.weight)||0);for(let i=0;i<(Number(s.sets)||0);i++)all.push({exercise:e.name,reps:Number(s.reps),weight:Number(s.weight),volume:Number(s.reps)*Number(s.weight),date:w.date,volumeTotal:volume})})));const prs={};all.forEach(x=>{const p=prs[x.exercise]||{weight:0,reps:0};if(x.weight>p.weight)p.weight=x.weight;if(x.reps>p.reps)p.reps=x.reps;prs[x.exercise]=p});const weeks=[];for(let i=7;i>=0;i--){const {start,end}=weekDates(i);const vol=all.filter(x=>x.date>=start&&x.date<=end).reduce((a,x)=>a+x.volume,0);weeks.push({start,end,vol})}return {all,prs,weeks}}
function fitnessVolumeChart(){const {weeks}=fitnessStats(),max=Math.max(1,...weeks.map(w=>w.vol));return `<div class="chart">${weeks.map(w=>`<div class="chart-col"><div class="chart-val">${Math.round(w.vol)}</div><div class="chart-bar" style="height:${Math.max(4,w.vol/max*88)}%"></div><div class="chart-label">${w.start.slice(5)}</div></div>`).join('')}</div>`}
function fitnessPanel(){const {prs,all}=fitnessStats();return `<section class="section panel"><div class="panel-header"><h2>Fitness depth</h2><small>${state.workouts.length} workouts · ${Math.round(all.reduce((a,x)=>a+x.volume,0))} total weight×reps logged</small></div><div style="padding:18px"><div class="eyebrow">Weekly volume</div><div style="margin-top:9px">${fitnessVolumeChart()}</div><div class="eyebrow" style="margin-top:18px">Personal records</div><div class="list" style="margin-top:7px">${Object.keys(prs).length?Object.entries(prs).sort((a,b)=>b[1].weight-a[1].weight).map(([name,p])=>`<div class="exercise-chip"><span>${esc(name)}</span><span class="quiet">${p.weight?`${p.weight} kg best · `:''}${p.reps} reps best</span></div>`).join(''):'<div class="empty"><strong>No exercise data yet.</strong>Log an exercise with sets and weights.</div>'}</div></div></section>`}
function viewLife(){return `<div class="page"><div class="eyebrow">Life</div><div class="h1">Take care of the human, too.</div><div class="lead">Habits, workouts, and reminders stay connected to the same local context as the rest of the workspace.</div><section class="section grid grid-2"><div class="panel"><div class="panel-header"><h2>Habits</h2><button class="btn mini" onclick="addHabit()">+ Habit</button></div><div class="list">${state.habits.map(h=>`<div class="row habit-row"><div style="flex:1;min-width:0"><div class="row-title">${esc(h.title)}</div><div class="row-meta">${(h.frequency||'daily').toUpperCase()} · ${streakOf(state.habitLog[h.id]||{})} day streak · ${Object.keys(state.habitLog[h.id]||{}).length} logged days</div>${heat(state.habitLog[h.id]||{})}</div><div class="row-actions"><button class="btn mini ghost" onclick="renameHabit(${jarg(h.id)})">✎</button><button class="btn mini ghost" onclick="removeHabit(${jarg(h.id)})">×</button><button class="btn mini ${h.done?'':'primary'}" onclick="toggleHabit(${jarg(h.id)})">${h.done?'Done':'Mark done'}</button></div></div>`).join('')||'<div class="empty"><strong>No habits yet.</strong>Create one and start a streak.</div>'}</div></div><div class="panel"><div class="panel-header"><h2>Workout history</h2><button class="btn mini primary" onclick="logWorkout()">+ Workout</button></div><div class="list">${state.workouts.slice(0,8).map(w=>`<div class="row"><div class="row-main"><div class="row-title">${esc(w.title)}</div><div class="row-meta">${esc(w.type)} · ${w.duration}m · RPE ${w.rpe} · ${dateShort(w.date)} · ${(w.exercises||[]).length} exercise${(w.exercises||[]).length===1?'':'s'}</div><div class="chips" style="margin-top:6px">${(w.exercises||[]).slice(0,3).map(e=>`<span class="chip">${esc(e.name)} · ${e.sets.map(s=>`${s.sets}×${s.reps}${s.weight?` @ ${s.weight}`:''}`).join(', ')}</span>`).join('')}</div></div><div class="row-actions"><button class="btn mini ghost" onclick="editWorkout(${jarg(w.id)})">✎</button><button class="btn mini ghost" onclick="delWorkout(${jarg(w.id)})">×</button></div></div>`).join('')||'<div class="empty"><strong>No workouts yet.</strong>Log one to start your volume history.</div>'}</div></div></section>${fitnessPanel()}<section class="section panel"><div class="panel-header"><h2>Reminders</h2><button class="btn mini" onclick="addReminder()">+ Reminder</button></div><div class="list">${reminderRows()}</div></section></div>`}
function editWorkout(id){const w=state.workouts.find(x=>x.id===id);if(w)openModal(workoutModal,w)}
function delWorkout(id){state.workouts=state.workouts.filter(w=>w.id!==id);persist();render();toast('Workout deleted')}

function viewToday(){const f=facts(),rec=recommendation();const main=rec?rec.title:(f.focusActive?'Continue your focus':(f.openCount?'You have work worth moving':'Today is calm'));const mainTask=rec?taskById(rec.entityId):f.focusCompatible;return `<div class="page"><div class="split"><div><div class="eyebrow">${formatDay(today)}</div><div class="h1">${greeting()} 👋</div><div class="actions" style="margin-top:8px"><button class="btn mini" onclick="morningWizard()">Energy: ${esc((state.morningCheckins[today]||{energy:7}).energy||7)}/10 · Edit check-in</button></div><div class="lead">Your day is a small system: intent first, then work, focus, and reality.</div></div></div>${!isInstalled()&&__installPrompt?`<section class="section install-strip"><div><b>Install AstralSurge OS on this device</b><span>Works offline and adds Quick Capture to your launcher shortcuts.</span></div><button class="btn primary" onclick="installPWA()">Install app</button></section>`:''}<form class="panel pad quick-capture" onsubmit="quickCapture(event)"><input name="qc" aria-label="Quick capture" maxlength="200" autocomplete="off" placeholder="Capture an idea, then press Enter"><button class="btn primary quick-capture-btn">Capture</button></form>${morningPlanCard()}<section class="section"><div class="panel focus-panel"><div class="focus-row"><div><div class="eyebrow">${rec?'Next best action':'Current context'}</div><div class="focus-title">${esc(main)}</div><div class="lead">${rec?esc(rec.reason):(f.focusActive?'Your active session stays front and center until it ends.':`There are ${f.openCount} open tasks, ${f.importantUnscheduled} important task(s) without a block, and ${f.openWindow} minutes of open time.`)}</div>${rec?`<div class="reason"><b>Why:</b> ${rec.evidence.map(esc).join(' · ')} <button class="btn ghost mini" onclick="inspect('rule',${jarg(rec.ruleId)})">Why am I seeing this?</button></div>`:''}<div class="actions">${rec?`<button class="btn primary" onclick="actionForRec(recommendation())">${esc(rec.actionLabel)}</button>${rec.entityType==='task'?`<button class="btn" onclick="inspect('task',${jarg(rec.entityId)})">Open task</button>`:''}<button class="btn" onclick="dismissRecommendation(${jarg(rec.ruleId)})">Dismiss</button>`:mainTask?`<button class="btn primary" onclick="${f.focusActive?'setNav(\'focus\')':`startFocus(${jarg(mainTask.id)})`}">${f.focusActive?'Open Focus':'Start Focus'}</button><button class="btn" onclick="inspect('task',${jarg(mainTask.id)})">Inspect</button>`:'<button class="btn primary" onclick="globalCreate()">Capture something</button>'}</div></div><div style="min-width:210px"><div class="eyebrow">Workspace signal</div><div class="metric surface" style="margin-top:8px"><div class="label">Open time</div><div class="value">${openSlot(45)?'45m':'None'}</div><div class="trend">${openSlot(45)?'first window '+openSlot(45):'no open 45m window'}</div></div></div></div></div></section>${dailyProgress()}<section class="section grid grid-2"><div class="panel"><div class="panel-header"><h2>Today</h2><small>commitments</small></div><div class="timeline">${state.planner.slice().sort((a,b)=>a.time.localeCompare(b.time)).map(p=>`<div class="time-row"><div class="time">${esc(p.time)}</div><div class="event"><div class="event-title">${esc(p.title)}</div><div class="event-meta">${p.duration}m · ${esc(p.type)} ${p.taskId?'· task linked':''}</div></div></div>`).join('')}</div></div><div class="panel"><div class="panel-header"><h2>Quick capture</h2><small>organize later</small></div><div class="grid" style="padding:16px"><button class="btn" onclick="openModal(taskModal)">+ Task <span class="quiet">capture work</span></button><button class="btn" onclick="openModal(noteModal)">+ Note <span class="quiet">capture context</span></button><button class="btn" onclick="openModal(expenseModal)">+ Expense <span class="quiet">record reality</span></button><button class="btn" onclick="addReminder()">+ Reminder <span class="quiet">browser notification</span></button></div></div></section>${weeklyReviewCard()}<section class="section grid grid-3"><div class="panel metric"><div class="label">Needs attention</div><div class="value">${f.overdue}</div><div class="trend">overdue open tasks</div></div><div class="panel metric"><div class="label">Goal momentum</div><div class="value">${state.goals[0]?.progress||0}%</div><div class="trend">${esc(state.goals[0]?.title||'No active goal')}</div></div><div class="panel metric"><div class="label">Vault</div><div class="value">${state.vault.encryptionEnabled?'AES-GCM':'Local'}</div><div class="trend">${state.vault.encryptionEnabled?'encrypted':'browser storage'}</div></div></section></div>`}

function viewVault(){return `<div class="page"><div class="split"><div><div class="eyebrow">Vault</div><div class="h1">Private by construction, not by promise.</div><div class="lead">Workspace persistence is IndexedDB-first and local to this browser. JSON state is compressed; unencrypted image attachments are stored separately, while encrypted vaults keep their attachments inside the encrypted snapshot.</div></div><button class="btn primary" onclick="backupWorkspace()">${state.vault.encryptionEnabled?'Export encrypted backup':'Back up'}</button></div>${recoveryPanel()}<section class="section grid grid-2"><div class="panel pad"><div class="eyebrow">Encryption</div><h2 style="margin:7px 0">${state.vault.encryptionEnabled?'AES-GCM vault enabled':'Local vault not yet encrypted'}</h2><div class="muted-line">PBKDF2-SHA-256 derives a wrapping key from your passphrase; a random AES data key encrypts the workspace. The passphrase is never stored in app storage.</div><div class="actions">${state.vault.encryptionEnabled?`<button class="btn primary" onclick="toggleLock()">${state.vault.locked?'Unlock':'Lock vault'}</button><button class="btn" onclick="setPassphrase()">Change passphrase</button>`:`<button class="btn primary" onclick="setPassphrase()">Enable encrypted vault</button>`}<button class="btn" onclick="recoveryImport()">Unlock with recovery key</button></div><div class="notice-strip" style="margin-top:14px"><div><b>Threat-model boundary</b><span>Encryption does not protect data while the vault is unlocked or against a compromised browser/device/extension.</span></div></div></div><div class="panel pad"><div class="eyebrow">Storage health</div><h2 style="margin:7px 0">IndexedDB storage</h2><div id="storage-health" class="muted-line">Checking browser storage…</div><div class="storage-meter" style="margin-top:10px"><i id="storage-bar"></i></div><div class="field-help" style="margin-top:9px">IndexedDB is the primary workspace store, JSON is compressed when the browser supports CompressionStream, and image attachments are externalized for unencrypted workspaces. Persistent storage is requested where supported. Browser quota/eviction still cannot be guaranteed away, so keep portable backups for anything you cannot afford to lose.</div></div></section><section class="section panel"><div class="panel-header"><h2>Recovery & restore</h2><small>explicit, encrypted when possible</small></div><div style="padding:18px"><div class="feature-grid"><div class="feature-card"><div class="eyebrow">Checkpoint</div><div style="margin-top:6px">${dateShort(state.vault.lastCheckpoint)}</div><div class="field-help" style="margin-top:5px">${state.vault.encryptionEnabled?'Stored as an encrypted checkpoint while the vault is unlocked.':'Stored in IndexedDB for this browser profile.'}</div><div class="actions"><button class="btn mini" onclick="createCheckpoint()">Create</button><button class="btn mini" onclick="compareCheckpoint()">Compare</button></div></div><div class="feature-card"><div class="eyebrow">Portable backup</div><div style="margin-top:6px">${dateShort(state.vault.lastBackup)}</div><div class="field-help" style="margin-top:5px">${state.vault.encryptionEnabled?'Encrypted backup envelope.':'Readable JSON backup.'}</div><div class="actions"><button class="btn mini primary" onclick="backupWorkspace()">Export</button><button class="btn mini" onclick="exportRecoveryNoImages()">Recovery · no images</button><button class="btn mini" onclick="fileRestore()">Restore</button></div></div></div></div></section><section class="section panel"><div class="panel-header"><h2>Security notes</h2><small>honest boundaries</small></div><div class="row"><div><div class="row-title">Primary storage</div><div class="row-meta">This build persists the workspace in IndexedDB first; small compatibility metadata may still use localStorage. PWA assets may be cached by the service worker.</div></div><span class="chip good">local</span></div><div class="row"><div><div class="row-title">Recovery key</div><div class="row-meta">Exported once when encryption is enabled. The app does not intentionally retain the recovery key in browser storage.</div></div><span class="chip good">offline</span></div><div class="row"><div><div class="row-title">Plaintext checkpoints</div><div class="row-meta">Disabled while encrypted-vault mode is active; old plaintext checkpoint keys are removed when an encrypted envelope is detected.</div></div><span class="chip accent">hardened</span></div><div class="row"><div><div class="row-title">Offline / install</div><div class="row-meta">Offline behavior depends on a valid service worker and secure hosting. This HTML cannot guarantee OS background execution.</div></div><span class="chip">best effort</span></div></section></div>`}

function applyTheme(){const root=document.documentElement;root.classList.remove('minimal-mode-active');delete root.dataset.minimalTheme;document.body.style.removeProperty('background-color');root.style.removeProperty('color-scheme');const t=['Dark','Light','Auto'].includes(state.settings.theme)?state.settings.theme:'Dark';const light=t==='Light'||(t==='Auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches);document.documentElement.setAttribute('data-theme',light?'light':'dark');const st=state.settings,ac=safeColor(st.accent,'#9d88ff'),ac2=safeColor(st.accent2,'');const rt=document.documentElement.style;rt.setProperty('--accent',ac);rt.setProperty('--accent2',ac2||`color-mix(in srgb,${ac} 50%,#64d7db)`);let w=['None','Daily',...Object.keys(WALLS),'Custom'].includes(st.wallpaper)?st.wallpaper:'None';if(w==='Daily'){const k=Object.keys(WALLS);w=k[Math.floor(Date.now()/864e5)%k.length]}const custom=safeImageData(st.wallImg);const img=w==='Custom'&&custom?`linear-gradient(rgba(12,14,17,.55),rgba(12,14,17,.55)),url(${custom})`:WALLS[w];document.body.style.backgroundImage=img||'none';document.body.style.backgroundAttachment='scroll';document.body.style.backgroundPosition='center top';document.body.style.backgroundRepeat='no-repeat';document.body.style.backgroundSize='cover';document.documentElement.setAttribute('data-wall',img?'1':'0');const m=document.querySelector('meta[name=theme-color]');if(m)m.content=light?'#f3f1ee':ac}

  ?plan.map(x=>`<div class="row"><div class="row-main"><div class="row-title">${nm(x.fromId)} → ${nm(x.toId)}</div><div class="row-meta">pays ${fmtP(x.amountP)}</div></div><button class="btn mini primary split-touch" onclick="splitMarkPaid(${jarg(g.id)},${jarg(x.fromId)},${jarg(x.toId)},${x.amountP})">Mark paid</button></div>`).join('')
    +`<div class="actions"><button class="btn" onclick="splitMarkAll(${jarg(g.id)})">Mark all paid</button></div>`
  :'<div class="empty"><strong>All settled up.</strong>Nobody owes anybody in this group.</div>';
 const expenses=g.expenses.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(e=>{
  const r=computeSplit(e.amountP,e.splitType,e.includedIds,e.splitValues);
  const chips=r.ok?g.people.filter(p=>p.id in r.shares).map(p=>`<span class="chip">${esc(p.name)} · ${fmtP(r.shares[p.id])}</span>`).join(''):'<span class="chip danger">invalid split</span>';
  return `<div class="row split-expense"><div class="row-main"><div class="row-title">${esc(e.title)}</div><div class="row-meta">${dateShort(e.date)} · paid by ${nm(e.payerId)} · ${SPLIT_LABEL[e.splitType]}</div><div class="chips">${chips}</div></div><div class="row-actions"><b class="pill-value">${fmtP(e.amountP)}</b><button class="btn mini" onclick="splitExpenseModal(${jarg(g.id)},${jarg(e.id)})">Edit</button><button class="btn mini ghost" onclick="splitDeleteExpense(${jarg(g.id)},${jarg(e.id)})">Delete</button></div></div>`;
 }).join('')||'<div class="empty"><strong>No expenses yet.</strong>Add the first one.</div>';
 const payments=g.payments.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="row"><div class="row-main"><div class="row-title">${nm(x.fromId)} paid ${nm(x.toId)}</div><div class="row-meta">${dateShort(x.date)}</div></div><div class="row-actions"><b class="pill-value">${fmtP(x.amountP)}</b><button class="btn mini ghost" onclick="splitUndoPayment(${jarg(g.id)},${jarg(x.id)})">Undo</button></div></div>`).join('')||'<div class="quiet" style="padding:12px 16px">No settlements recorded.</div>';
 const people=g.people.map(p=>`<div class="row"><div class="split-person"><span class="split-avatar">${splitInitials(p.name)}</span><div class="row-title">${esc(p.name)}</div></div><button class="btn mini ghost" onclick="splitRemovePerson(${jarg(g.id)},${jarg(p.id)})">Remove</button></div>`).join('');
 return `<div class="page split-page">
 <div class="split"><div><a class="quiet" href="#/split">← all groups</a><div class="h1">${esc(g.name)}</div><div class="lead">${g.people.length} people · ${g.expenses.length} expenses · ${g.payments.length} settlements</div></div><div class="actions" style="margin:0"><button class="btn" onclick="splitGroupModal(${jarg(g.id)})">Rename</button><button class="btn" onclick="splitDeleteGroup(${jarg(g.id)})">Delete</button><button class="btn primary" onclick="splitExpenseModal(${jarg(g.id)})">+ Expense</button></div></div>
 <section class="section grid grid-3"><div class="panel metric"><div class="label">Total shared</div><div class="value">${fmtP(total)}</div><div class="trend">${g.expenses.length} expenses</div></div><div class="panel metric"><div class="label">Still owed</div><div class="value">${fmtP(unsettled)}</div><div class="trend">total across the group</div></div><div class="panel metric"><div class="label">Status</div><div class="value" style="font-size:20px">${unsettled?'Unsettled':'Settled up'}</div><div class="trend">${plan.length} suggested payment${plan.length===1?'':'s'}</div></div></section>
 <section class="section grid grid-2"><div class="panel"><div class="panel-header"><h2>Balances</h2><small>who gets back, who owes</small></div><div style="padding:8px 16px 16px;display:grid;gap:12px">${balances}</div></div><div class="panel"><div class="panel-header"><h2>Settle up</h2><small>fewest payments</small></div><div class="list">${settle}</div></div></section>
 <section class="section grid grid-2"><div class="panel"><div class="panel-header"><h2>Expenses</h2><small>${g.expenses.length}</small></div><div class="list">${expenses}</div></div><div class="panel"><div class="panel-header"><h2>People</h2><small>${g.people.length} of 50</small></div><div class="list">${people}</div><form class="mini-form split-add" style="margin:12px 16px 16px" onsubmit="splitAddPeople(event,${jarg(g.id)})"><input name="names" placeholder="Add people, comma-separated" required maxlength="400" aria-label="Names to add"><button class="btn mini primary">Add</button></form></div></section>
 <section class="section panel"><div class="panel-header"><h2>Settlements</h2><small>${g.payments.length} recorded</small></div><div class="list">${payments}</div></section>

function splitGroupModal(gid){
 const g=gid?splitGroup(gid):null;
 openModal(()=>`<div class="modal-inner split-modal"><div class="split"><div><div class="eyebrow">Split group</div><h2 id="modal-title" style="margin:4px 0">${g?'Rename group':'New group'}</h2></div><button class="btn icon-btn" onclick="closeModal()" aria-label="Close">×</button></div><form class="form" onsubmit="splitSaveGroup(event,${jarg(g?g.id:'')})" style="margin-top:18px"><div class="field"><label>Group name</label><input name="name" required maxlength="60" value="${esc(g?g.name:'')}" placeholder="e.g. Goa trip"></div>${g?'':`<div class="field"><label>People</label><textarea name="people" required placeholder="One per line, or comma-separated (2 to 50)"></textarea><div class="field-help">Duplicates are removed. Names up to 40 characters.</div></div>`}<div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">${g?'Save name':'Create group'}</button></div></form></div>`);
}
function splitSaveGroup(e,id){
 e.preventDefault();
 const f=new FormData(e.target),name=String(f.get('name')||'').trim().slice(0,60);
 if(!name){toast('Name the group');return}
 state.groups=state.groups||[];
 if(id){const g=splitGroup(id);if(!g)return;g.name=name}
 else{
  const names=splitParseNames(f.get('people'));
  if(names.length<2){toast('Add at least 2 people');return}
  if(names.length>SPLIT_MAX_PEOPLE){toast('A group can have at most 50 people');return}
  if(state.groups.length>=200){toast('Group limit reached');return}
  state.groups.push({id:uid('grp'),name,people:names.map(n=>({id:uid('p'),name:n})),expenses:[],payments:[]});
 }
 persist();closeModal();render();toast(id?'Group renamed':'Group created');
}
function splitDeleteGroup(gid){
 const g=splitGroup(gid);if(!g)return;
 if(!confirm(`Delete "${g.name}" with its ${g.expenses.length} expenses and ${g.payments.length} settlements? This cannot be undone.`))return;
 state.groups=state.groups.filter(x=>x.id!==gid);
 persist();setNav('split');render();toast('Group deleted');
}
function splitAddPeople(e,gid){
 e.preventDefault();const g=splitGroup(gid);if(!g)return;
 const incoming=splitParseNames(new FormData(e.target).get('names'));
 const have=new Set(g.people.map(p=>p.name.toLowerCase()));
 const fresh=incoming.filter(n=>!have.has(n.toLowerCase()));
 if(!fresh.length){toast('Those people are already in the group');return}
 if(g.people.length+fresh.length>SPLIT_MAX_PEOPLE){toast('A group can have at most 50 people');return}
 fresh.forEach(n=>g.people.push({id:uid('p'),name:n}));
 persist();render();toast(`Added ${fresh.length}`);
}
function splitRemovePerson(gid,pid){
 const g=splitGroup(gid);if(!g)return;const p=g.people.find(x=>x.id===pid);if(!p)return;
 if(splitPersonInUse(g,pid)){toast(`${p.name} is in an expense or settlement. Delete those first.`);return}
 if(g.people.length<=2){toast('A group needs at least 2 people');return}
 if(!confirm(`Remove ${p.name} from ${g.name}?`))return;
 g.people=g.people.filter(x=>x.id!==pid);persist();render();toast('Person removed');
}
function splitExpenseModal(gid,eid){
 const g=splitGroup(gid);if(!g){toast('Group not found');return}
 const e=eid?g.expenses.find(x=>x.id===eid):null,type=e?.splitType||'equal';
 const inc=new Set(e?e.includedIds:g.people.map(p=>p.id));

 openModal(()=>`<div class="modal-inner split-modal"><div class="split"><div><div class="eyebrow">Split expense</div><h2 id="modal-title" style="margin:4px 0">${e?'Edit expense':'New expense'}</h2></div><button class="btn icon-btn" onclick="closeModal()" aria-label="Close">×</button></div>
 <form class="form split-form" data-gid="${esc(g.id)}" data-eid="${esc(e?e.id:'')}" oninput="splitPreview(this)" onchange="splitPreview(this)" onsubmit="splitSaveExpense(event)" style="margin-top:18px">
 <div class="field"><label>Title</label><input name="title" required maxlength="120" value="${esc(e?e.title:'')}"></div>
 <div class="grid grid-2"><div class="field"><label>Amount (₹)</label><input name="amount" inputmode="decimal" required placeholder="0.00" value="${esc(e?fmtInput(e.amountP):'')}"></div><div class="field"><label>Date</label><input name="date" type="date" required value="${esc(e?e.date:today)}"></div></div>
 <div class="grid grid-2"><div class="field"><label>Paid by</label><select name="payer">${g.people.map(p=>`<option value="${esc(p.id)}" ${(e?e.payerId:g.people[0].id)===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Split</label><select name="splitType">${SPLIT_TYPES.map(t=>`<option value="${t}" ${type===t?'selected':''}>${SPLIT_LABEL[t]}</option>`).join('')}</select></div></div>
 <div class="field"><label>Between · <span id="split-col">included</span></label><div class="split-people">${g.people.map(p=>`<div class="split-line"><label class="check"><input type="checkbox" data-inc ${inc.has(p.id)?'checked':''}> ${esc(p.name)}</label><input data-pid="${esc(p.id)}" inputmode="decimal" placeholder="value" value="${esc(valOf(p.id))}" aria-label="Value for ${esc(p.name)}"></div>`).join('')}</div></div>
 <div class="field"><label>Each share</label><div id="split-preview" class="split-preview" aria-live="polite"></div></div>
 <div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">${e?'Save changes':'Save expense'}</button></div>

 const f=document.querySelector('#modal .split-form');if(f)splitPreview(f);
}
function splitReadForm(f){
 const g=splitGroup(f.dataset.gid);if(!g)return {hint:'Group not found.'};
 const title=f.querySelector('[name=title]').value.trim().slice(0,120);
 const type=f.querySelector('[name=splitType]').value;
 const amountP=parseFixed2(f.querySelector('[name=amount]').value,SPLIT_MAX_AMOUNT_P);
 const payerId=f.querySelector('[name=payer]').value;
 const date=f.querySelector('[name=date]').value;
 if(!SPLIT_TYPES.includes(type)||!g.people.some(p=>p.id===payerId))return {hint:'Choose who paid.'};
 if(!splitValidDay(date))return {hint:'Choose a valid date.'};
 if(!title)return {hint:'Add a title to see the split.'};
 if(amountP===null||amountP<=0)return {hint:'Enter an amount above ₹0.00 (up to 2 decimals).'};
 const includedIds=[],splitValues={};
 for(const line of f.querySelectorAll('.split-line')){
  const cb=line.querySelector('[data-inc]'),inp=line.querySelector('[data-pid]');
  if(!cb.checked)continue;
  const id=inp.dataset.pid;includedIds.push(id);
  if(type==='equal')continue;
  const raw=inp.value.trim();let v=null;
  if(type==='exact')v=parseFixed2(raw,SPLIT_MAX_AMOUNT_P);
  else if(type==='percent')v=parseFixed2(raw,10000);
  else if(/^\d{1,4}$/.test(raw))v=Number(raw);
  if(v===null){const who=g.people.find(p=>p.id===id)?.name||'';return {hint:`Enter a ${type==='exact'?'amount':type==='percent'?'percentage':'number of shares'} for ${who}.`}}
  splitValues[id]=v;
 }
 const r=computeSplit(amountP,type,includedIds,splitValues);
 if(!r.ok)return {error:r.error};
 return {data:{title,amountP,payerId,date,includedIds,splitType:type,splitValues:type==='equal'?{}:splitValues},shares:r.shares};
}
function splitPreview(f){
 const box=document.getElementById('split-preview');if(!box||!f||!f.dataset)return;
 const type=f.querySelector('[name=splitType]').value;
 const col=document.getElementById('split-col');
 if(col)col.textContent={equal:'included',exact:'amount each',percent:'% each',shares:'shares each'}[type]||'';
 f.querySelectorAll('.split-line').forEach(line=>{const on=line.querySelector('[data-inc]').checked;line.querySelector('[data-pid]').disabled=type==='equal'||!on});
 const r=splitReadForm(f);
 if(r.hint){box.innerHTML=`<div class="quiet">${esc(r.hint)}</div>`;return}
 if(r.error){box.innerHTML=`<div class="danger-note">${esc(r.error)}</div>`;return}
 const g=splitGroup(f.dataset.gid);
 box.innerHTML=`<div class="success-note">Each person's share</div>`+g.people.filter(p=>p.id in r.shares).map(p=>`<div class="row" style="padding:6px 0"><div class="row-main"><div class="row-title">${esc(p.name)}</div></div><span class="pill-value">${fmtP(r.shares[p.id])}</span></div>`).join('');
}
function splitSaveExpense(e){
 e.preventDefault();
 const f=e.target,r=splitReadForm(f);
 if(!r.data){toast(r.error||r.hint||'Check the form');splitPreview(f);return}

 state.events.push({type:i>=0?'SPLIT_EXPENSE_UPDATED':'SPLIT_EXPENSE_CREATED',entityId:stored.id,at:Date.now()});

}
function splitDeleteExpense(gid,eid){

function splitMarkPaid(gid,fromId,toId,amountP){

 if(!plan.some(x=>x.fromId===fromId&&x.toId===toId&&x.amountP===Number(amountP))){toast('Balances have changed. Review the list.');render();return}
 g.payments.push({id:uid('pay'),fromId,toId,amountP:Number(amountP),date:today});

function splitMarkAll(gid){
 const g=splitGroup(gid);if(!g)return;

 if(!plan.length){toast('Already settled up');return}
 plan.forEach(x=>g.payments.push({id:uid('pay'),fromId:x.fromId,toId:x.toId,amountP:x.amountP,date:today}));

function splitUndoPayment(gid,pid){

function fileRestore(){const i=document.createElement('input');i.type='file';i.accept='.json,.asbackup,application/json';i.onchange=()=>{const f=i.files[0];if(!f)return;if(f.size>64*1024*1024){toast('Backup is too large (64 MB max)');return}const r=new FileReader();r.onload=()=>{let parsed;try{parsed=JSON.parse(String(r.result))}catch(e){toast('This file is not valid JSON');return}const res=parseBackupObject(parsed);if(res.error){pendingRestore=null;toast(res.error);return}if(res.kind==='encrypted'){pendingRestore={name:f.name,envelope:res.envelope,encrypted:true};openDrawer(`<div class="eyebrow">Encrypted backup</div><h2>${esc(f.name)}</h2><p class="muted-line">Valid encrypted envelope. Nothing changes until you confirm. You will need the backup passphrase or recovery key afterward.</p><div class="danger-note" style="margin-top:14px">Replacing storage removes the current workspace from this browser.</div><div class="actions"><button class="btn" onclick="closeDrawer()">Cancel</button><button class="btn primary" onclick="applyEncryptedRestore()">Replace storage</button></div>`);return}pendingRestore={name:f.name,workspace:res.workspace,meta:res.meta,encrypted:false};restorePreview()};r.readAsText(f)};i.click()}
async function applyEncryptedRestore(){
 if(!pendingRestore?.encrypted||!pendingRestore.envelope)return;
 if(window.__asosReadOnly){toast('Editing is paused; restore blocked to protect existing data');return}
 if(!confirm('Replace the stored workspace with this encrypted backup? You will need its passphrase or recovery key to open it.'))return;if(!await stashRaw('Before storage replace'))return;
 try{
  const json=JSON.stringify(pendingRestore.envelope),packed=await gzipText(json);
  await idbPut(IDB_KV,IDB_WORKSPACE,{v:3,encoding:packed.encoding,data:packed.data,updatedAt:Date.now(),bytes:json.length,compressed:packed.encoding==='gzip'});
  try{localStorage.removeItem(KEY);localStorage.removeItem(CPK)}catch(e){}
  __encryptedEnvelope=clone(pendingRestore.envelope);__vaultDataKey=null;__vaultReady=false;
  state=makeLockedState();pendingRestore=null;closeDrawer();render();toast('Encrypted backup restored · unlock required');
 }catch(e){toast('Could not restore encrypted backup')}
}
