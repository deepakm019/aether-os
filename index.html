<style>

.sidebar{border-right:1px solid var(--line);background:#0e1014;display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:11px;align-items:center;padding:8px 10px 22px}.brand-mark{width:34px;height:34px;border:1px solid #363b45;border-radius:11px;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(145deg,#25212f,#101318)}.brand b{font-size:14px;letter-spacing:.02em}.brand span{display:block;color:var(--muted2);font-size:10px;margin-top:2px}.nav{display:grid;gap:4px}.nav button,.mobile-nav button{border:0;background:transparent;color:var(--muted);height:46px;border-radius:12px;display:flex;gap:11px;align-items:center;padding:0 12px;text-align:left}.nav button:hover,.mobile-nav button:hover{background:#171a20;color:#fff}.nav button.active{background:#1a1921;color:#fff;box-shadow:inset 0 0 0 1px #302b3e}.icon{width:18px;display:inline-grid;place-items:center;font-size:14px}.sidebar-bottom{margin-top:auto}.status{padding:13px;border:1px solid var(--line);border-radius:14px;background:#111419}.status-top{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}.dot{width:7px;height:7px;border-radius:99px;background:var(--green);display:inline-block;margin-right:6px}.main{min-width:0}.topbar{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;background:rgba(12,14,17,.9);backdrop-filter:blur(18px);z-index:10}.topbar-left{display:flex;align-items:center;gap:12px}.crumb{color:var(--muted);font-size:13px}.top-actions{display:flex;gap:8px;align-items:center}.btn{border:1px solid var(--line);background:#171a20;color:#e9e8e3;border-radius:11px;padding:10px 13px;min-height:42px}.btn:hover{background:#1d2128}.btn.primary{background:#eee9dc;color:#17181a;border-color:#eee9dc;font-weight:700}.btn.accent{background:#1b1924;border-color:#3a334f;color:#e8e2ff}.btn.ghost{background:transparent}.icon-btn{width:42px;padding:0;display:grid;place-items:center}.page{max-width:var(--max);margin:0 auto;padding:28px 30px 100px}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2);font-weight:700}.h1{font-size:clamp(28px,4vw,46px);letter-spacing:-.035em;line-height:1.02;margin:7px 0}.lead{color:var(--muted);font-size:14px;max-width:700px;line-height:1.65}.grid{display:grid;gap:16px}.grid-2{grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr)}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.split{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.section{margin-top:28px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 32px rgba(0,0,0,.12)}.panel.pad{padding:20px}.panel-header{padding:19px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px}.panel-header h2{margin:0;font-size:15px;letter-spacing:-.01em}.panel-header small{color:var(--muted2)}.surface{background:#101318;border:1px solid #22272e;border-radius:15px}.focus-panel{padding:23px;background:radial-gradient(circle at top right,rgba(157,136,255,.09),transparent 45%),#15171c;border-color:#34303f}.focus-row{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.focus-title{font-size:28px;letter-spacing:-.025em;margin:5px 0 9px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{font-size:11px;padding:6px 8px;border-radius:999px;border:1px solid #2b3038;color:#b4bac3;background:#111419}.chip.good{color:#a4dfbf;border-color:#294437;background:#111a15}.chip.warn{color:#e6c985;border-color:#473a25;background:#1a1711}.chip.danger{color:#eca0a0;border-color:#4b2929;background:#1c1313}.chip.accent{color:#d7ccff;border-color:#3b3350;background:#181520}.reason{margin-top:15px;padding-top:15px;border-top:1px solid var(--line);color:#c6c9cf;font-size:13px;line-height:1.55}.reason b{color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}.list{display:grid}.row{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px}.row:last-child{border-bottom:0}.row-main{min-width:0}.row-title{font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-meta{margin-top:4px;color:var(--muted);font-size:12px}.row-actions{display:flex;gap:6px;flex-shrink:0}.mini{padding:8px 10px;min-height:36px;font-size:12px;border-radius:10px}.quiet{color:var(--muted2);font-size:12px}.metric{padding:18px}.metric .label{color:var(--muted2);font-size:11px;text-transform:uppercase;letter-spacing:.12em}.metric .value{font-size:28px;margin-top:5px;letter-spacing:-.03em}.metric .trend{margin-top:5px;font-size:11px;color:var(--muted)}.timeline{position:relative;padding:5px 0}.timeline:before{content:"";position:absolute;left:94px;top:10px;bottom:10px;width:1px;background:var(--line)}.time-row{display:grid;grid-template-columns:74px 1fr;gap:38px;position:relative;padding:13px 0}.time-row:after{content:"";position:absolute;left:90px;top:23px;width:9px;height:9px;border-radius:50%;background:#242933;border:2px solid #0f1115}.time-row .time{color:var(--muted2);font-size:11px;padding-top:3px;text-align:right}.time-row .event{padding:0 8px}.event-title{font-size:13px;font-weight:650}.event-meta{font-size:11px;color:var(--muted);margin-top:3px}.bar{height:7px;background:#252a31;border-radius:99px;overflow:hidden}.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}.progress{display:grid;gap:9px}.progress-line{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.tabs{display:flex;gap:6px;padding:6px;background:#111419;border:1px solid var(--line);border-radius:12px;width:max-content;max-width:100%;overflow:auto}.tab{border:0;background:transparent;color:var(--muted);padding:9px 11px;border-radius:8px;white-space:nowrap}.tab.active{background:#1d2026;color:#fff}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:13px 16px;border-bottom:1px solid var(--line)}.table th{color:var(--muted2);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.1em}.pill-value{font-variant-numeric:tabular-nums}.empty{padding:40px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;color:#eee;margin-bottom:6px}.drawer-backdrop,.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:50;display:none}.drawer,.modal{position:fixed;z-index:51;background:#12151a;border:1px solid #2b3038;box-shadow:var(--shadow)}.drawer{right:0;top:0;bottom:0;width:min(500px,100vw);transform:translateX(102%);transition:transform .22s ease;overflow:auto}.drawer.open{transform:translateX(0)}.modal{left:50%;top:50%;transform:translate(-50%,-48%);width:min(640px,calc(100vw - 28px));max-height:min(86vh,800px);overflow:auto;border-radius:18px}.modal-backdrop.open,.drawer-backdrop.open{display:block}.modal-inner,.drawer-inner{padding:20px}.form{display:grid;gap:13px}.field{display:grid;gap:6px}.field label{font-size:11px;color:var(--muted2);text-transform:uppercase;letter-spacing:.1em}.field input,.field textarea,.field select{width:100%;background:#0f1216;border:1px solid #2b3038;color:#f0eee8;border-radius:11px;padding:12px 13px;outline:0}.field input:focus,.field textarea:focus,.field select:focus{border-color:#504663;box-shadow:0 0 0 3px rgba(157,136,255,.08)}.field textarea{min-height:110px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:8px;padding-top:6px}.search{position:relative;width:min(380px,35vw)}.search input{width:100%;background:#12151a;border:1px solid var(--line);padding:10px 38px 10px 13px;border-radius:11px;color:#fff;outline:0}.search span{position:absolute;right:12px;top:10px;color:var(--muted2);font-size:12px}.mobile-nav{display:none}.mobile-fab{display:none}.kbd{border:1px solid #323740;background:#111419;border-radius:6px;padding:1px 5px;font-size:10px;color:#a8adb5}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:90;background:#eae6da;color:#1a1b1e;border-radius:11px;padding:11px 15px;font-size:12px;font-weight:700;box-shadow:var(--shadow);transition:.22s}.toast.show{opacity:1;transform:translate(-50%,0)}.danger-note{padding:12px 14px;border:1px solid #473030;background:#1b1212;border-radius:12px;color:#e7b0b0;font-size:12px;line-height:1.5}.success-note{padding:12px 14px;border:1px solid #2c4638;background:#111913;border-radius:12px;color:#acd9be;font-size:12px;line-height:1.5}.rule-card{padding:17px;border-bottom:1px solid var(--line)}.rule-card:last-child{border-bottom:0}.rule-id{font-size:11px;color:var(--muted2);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.rule-name{font-size:14px;margin-top:4px;font-weight:700}.rule-why{color:#aeb3bb;font-size:12px;margin-top:6px;line-height:1.5}.check{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.status-badge{font-size:10px;padding:4px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.08em;border:1px solid #30353d;color:#aab0ba}.status-badge.open{border-color:#4b422b;color:#e0c37d}.status-badge.done{border-color:#2d4839;color:#9fd4b4}.status-badge.focus{border-color:#43395a;color:#c8b9ff}.entity-link{color:#e8e5de}.entity-link:hover{color:#fff;text-decoration:underline}.muted-line{color:var(--muted);font-size:12px;line-height:1.55}.legal-copy{white-space:pre-wrap;color:#bfc3ca;font-size:12px;line-height:1.7;background:#0f1216;border:1px solid var(--line);padding:16px;border-radius:12px}.footer-note{color:var(--muted2);font-size:11px;text-align:center;margin-top:38px}
@media (max-width:980px){.app{grid-template-columns:1fr}.sidebar{display:none}.topbar{padding:0 16px}.search{width:min(320px,42vw)}.page{padding:22px 16px 100px}.grid-2,.grid-3{grid-template-columns:1fr}.mobile-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:8px;right:8px;bottom:8px;background:rgba(16,18,22,.96);border:1px solid #2a2f36;border-radius:16px;padding:5px;z-index:30;backdrop-filter:blur(18px);box-shadow:0 14px 40px rgba(0,0,0,.4)}.mobile-nav button{height:52px;padding:0;display:grid;gap:2px;place-items:center;font-size:10px}.mobile-nav .icon{font-size:15px}.mobile-nav button.active{background:#1b1d22;color:#fff}.topbar .btn span{display:none}.focus-title{font-size:23px}.timeline:before{left:62px}.time-row{grid-template-columns:50px 1fr;gap:28px}.time-row:after{left:58px}.time-row .time{text-align:left}.modal{max-height:82vh}.drawer{width:100%}}
@media (max-width:620px){.topbar{height:62px}.crumb{display:none}.top-actions .search{display:none}.h1{font-size:34px}.lead{font-size:13px}.panel-header{padding:15px}.row{padding:13px 14px}.row-actions .btn{display:none}.focus-row{flex-direction:column}.focus-row .actions{width:100%}.focus-row .actions .btn{flex:1}.section{margin-top:22px}.page{padding-top:18px}.metric .value{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast">Saved</div>
<div id="backdrop" class="modal-backdrop" onclick="closeModal()"></div>
<div id="modal" class="modal" aria-modal="true" role="dialog" aria-labelledby="modal-title" style="display:none"></div>
<div id="drawer-backdrop" class="drawer-backdrop" onclick="closeDrawer()"></div>
<div id="drawer" class="drawer" aria-label="Details"><div id="drawer-content" class="drawer-inner"></div></div>
<script>
(() => {
'use strict';
const KEY='astralsurge.os.v1';
const now=new Date();
const isoDate=d=>d.toISOString().slice(0,10);
const today=isoDate(now);
const fmtTime=m=>{const h=Math.floor(m/60)%24,mm=String(m%60).padStart(2,'0');return `${String(h).padStart(2,'0')}:${mm}`};
const money=n=>`₹${Number(n||0).toLocaleString('en-IN')}`;
const uid=p=>p+'_'+Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));

function demoState(){
 const d=today;
 return {mode:'demo',vault:{locked:false,hasBackup:true,lastBackup:'2026-10-04',lastCheckpoint:'2026-10-06'},
 tasks:[
  {id:'tsk_proposal',title:'Finish proposal',desc:'Close the final draft and attach the review notes.',priority:'High',energy:'Deep',due:d,status:'To Do',important:true,urgent:false,timeSpent:70,tags:['Launch'],scheduled:false},
  {id:'tsk_oauth',title:'Rotate OAuth secrets',desc:'Complete the production credential rotation checklist.',priority:'High',energy:'Focused',due:d,status:'In Progress',important:true,urgent:true,timeSpent:35,tags:['Security'],scheduled:true},
  {id:'tsk_invoice',title:'Review client invoice',desc:'Confirm line items before sending.',priority:'Medium',energy:'Light',due:d,status:'To Do',important:false,urgent:false,timeSpent:0,tags:['Finance'],scheduled:false},
  {id:'tsk_docs',title:'Polish launch docs',desc:'Tighten the setup section and screenshots.',priority:'Low',energy:'Light',due:null,status:'Inbox',important:false,urgent:false,timeSpent:20,tags:['Docs'],scheduled:false},
  {id:'tsk_old',title:'Clean up archive links',desc:'Replace stale links in the archive.',priority:'Medium',energy:'Light',due:'2026-10-03',status:'To Do',important:false,urgent:false,timeSpent:0,tags:['Maintenance'],scheduled:false}
 ],
 stories:[{id:'story_launch',title:'Portfolio launch',state:'In Progress',points:8,criteria:[{t:'Working demo published',done:true},{t:'README polished',done:true},{t:'Deploy checklist complete',done:false}]}],
 goals:[{id:'goal_launch',title:'Portfolio launch',progress:68,steps:[{id:'step_1',title:'Finalize product story',type:'note',done:true},{id:'step_2',title:'Publish working demo',type:'task',done:false},{id:'step_3',title:'Collect first feedback',type:'story',done:false}]}],
 planner:[{id:'p1',title:'Client meeting',time:'09:30',duration:60,type:'meeting',fixed:true},{id:'p2',title:'Lunch',time:'12:30',duration:45,type:'break',fixed:true},{id:'p3',title:'Deep work',time:'14:00',duration:45,type:'focus',taskId:'tsk_oauth',fixed:false}],
 notes:[{id:'n1',title:'Launch notes',content:'Demo feels strongest when Today connects time → task → focus.',tags:['product','launch'],created:'2026-10-06'}],
 habits:[{id:'h1',title:'Read 20 pages',done:false,streak:9},{id:'h2',title:'Stretch',done:true,streak:4}],
 workouts:[{id:'w1',title:'Upper body',type:'Strength',duration:42,rpe:7,date:'2026-10-06'},{id:'w2',title:'Easy run',type:'Run',duration:28,rpe:5,date:'2026-10-03'}],
 budgets:[{id:'b1',name:'Dining',limit:8000,spent:7040},{id:'b2',name:'Transport',limit:4500,spent:2100},{id:'b3',name:'Tools',limit:6000,spent:5100}],
 transactions:[{id:'tx1',title:'Grocery',amount:1240,category:'Food',date:'2026-10-06'},{id:'tx2',title:'Hosting',amount:1600,category:'Tools',date:'2026-10-05'},{id:'tx3',title:'Cab',amount:420,category:'Transport',date:'2026-10-05'}],
 decisions:[{id:'d1',title:'New monitor',projected:18000,actual:16500,status:'Awaiting reconciliation'}],
 activities:[{id:'a1',time:'10:14',title:'Acceptance criterion completed',meta:'Portfolio launch · Story'},{id:'a2',time:'12:05',title:'45 minutes became available',meta:'Planner · Open time'},{id:'a3',time:'18:20',title:'Dining reached 88% of configured limit',meta:'Money · Budget pressure'}],
 focus:{active:false,paused:false,taskId:'tsk_oauth',seconds:25*60,initial:25*60,category:'Deep Work',startedAt:null},
 xp:1240,level:8,streak:9,settings:{suggestions:'On',density:'Normal',hideAmounts:false},dismissed:{},events:[]};
}
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){} return demoState()}
let state=load();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));toast('Saved')}catch(e){toast('Could not save')}
}
function resetDemo(){state=demoState();persist();render()}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),1500)}
function nav(){return location.hash.replace('#/','')||'today'}
function setNav(x){location.hash='/'+x}
function formatDay(d){const x=new Date(d+'T12:00:00');return x.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})}
function dateShort(d){if(!d)return 'No due date';const x=new Date(d+'T12:00:00');return x.toLocaleDateString('en-IN',{day:'numeric',month:'short'})}
function taskById(id){return state.tasks.find(t=>t.id===id)}
function facts(){
 const open=state.tasks.filter(t=>t.status!=='Completed');
 const overdue=open.filter(t=>t.due && t.due<today).length;
 const dueSoon=open.filter(t=>t.due && t.due<=today).length;
 const importantUnscheduled=open.filter(t=>t.important&&!t.scheduled).length;
 const openWindow=45;
 const focusCompatible=open.find(t=>t.important && (t.energy==='Deep'||t.energy==='Focused')) || open[0];
 const budgetPressure=state.budgets.filter(b=>b.spent/b.limit>=.85);
 const awaiting=state.decisions.filter(d=>d.status==='Awaiting reconciliation');
 const habitOpen=state.habits.filter(h=>!h.done).length;
 return {openCount:open.length,overdue,dueSoon,importantUnscheduled,openWindow,focusCompatible,budgetPressure,awaiting,habitOpen,focusActive:state.focus.active,backupOverdue:daysSince(state.vault.lastBackup)>=5};
}
function daysSince(d){if(!d)return 999;return Math.floor((Date.now()-new Date(d+'T12:00:00').getTime())/86400000)}
function recommendation(){
 if(state.settings.suggestions==='Off')return null;
 const f=facts();
 const t=f.focusCompatible;
 if(f.focusActive)return null;
 if(t && t.important && t.due && t.due<=today && !t.scheduled && !state.dismissed['task_unscheduled_due']) return {id:'rec1',ruleId:'task_unscheduled_due_soon',entityType:'task',entityId:t.id,title:t.title,reason:'Important + due today + no focused block',evidence:['High priority','Due today','No scheduled block','45m open'],priority:96,action:'use_window',actionLabel:`Use ${f.openWindow} min`};
 if(f.budgetPressure.length && !state.dismissed['budget_pressure']){const b=f.budgetPressure[0];return {id:'rec2',ruleId:'budget_pressure',entityType:'budget',entityId:b.id,title:`${b.name} is at ${Math.round(b.spent/b.limit*100)}%`,reason:'Actual spending is approaching its configured limit',evidence:[money(b.spent)+' spent',money(b.limit)+' configured limit'],priority:72,action:'review_budget',actionLabel:'Review spending'} }
 if(f.awaiting.length && !state.dismissed['decision_reconcile']){const d=f.awaiting[0];return {id:'rec3',ruleId:'decision_awaiting_actual',entityType:'decision',entityId:d.id,title:'Ready to reconcile',reason:'A planned expense now has an actual amount',evidence:[`Projected ${money(d.projected)}`,`Actual ${money(d.actual)}`,`Variance ${money(d.projected-d.actual)} under`],priority:70,action:'reconcile',actionLabel:'Reconcile'} }
 if(f.backupOverdue && !state.dismissed['backup_overdue'])return {id:'rec4',ruleId:'backup_overdue',entityType:'vault',entityId:'vault',title:'Your backup is overdue',reason:'Your latest portable backup is older than the configured threshold',evidence:[`Last backup ${dateShort(state.vault.lastBackup)}`],priority:84,action:'backup',actionLabel:'Back up'};
 return null;
}
function actionForRec(rec){
 if(!rec)return;
 if(rec.action==='use_window'){openModal(taskModal,taskById(rec.entityId),{recommendation:true});}
 if(rec.action==='review_budget')setNav('money');
 if(rec.action==='reconcile')openModal(decisionModal,state.decisions.find(x=>x.id===rec.entityId));
 if(rec.action==='backup')setNav('vault');
}
function completeTask(id){const t=taskById(id);if(!t)return;t.status='Completed';t.scheduled=false;state.events.push({type:'TASK_COMPLETED',entityId:id,at:Date.now()});state.xp+=20;persist();render();toast('Completed')}
function startFocus(id){const t=taskById(id);if(!t)return;state.focus.active=true;state.focus.paused=false;state.focus.taskId=id;state.focus.seconds=25*60;state.focus.initial=25*60;state.focus.startedAt=Date.now();state.focus.category='Deep Work';state.events.push({type:'FOCUS_STARTED',entityId:id,at:Date.now()});persist();render();setNav('focus')}
function pauseFocus(){if(!state.focus.active)return;state.focus.active=false;state.focus.paused=true;state.events.push({type:'FOCUS_PAUSED',entityId:state.focus.taskId,at:Date.now()});persist();render();toast('Focus paused')}
function resumeFocus(){if(state.focus.active||!state.focus.taskId)return;state.focus.active=true;state.focus.paused=false;state.focus.startedAt=Date.now();state.events.push({type:'FOCUS_RESUMED',entityId:state.focus.taskId,at:Date.now()});persist();render();setNav('focus')}
function scheduleTask(id){const t=taskById(id);if(!t)return;t.scheduled=true;state.planner.push({id:uid('p'),title:t.title,time:'14:00',duration:45,type:'focus',taskId:id,fixed:false});state.events.push({type:'PLANNER_CREATED',entityId:id,at:Date.now()});persist();render();toast('Scheduled')}
function stopFocus(){if(!state.focus.active)return;const spent=Math.max(0,state.focus.initial-state.focus.seconds);const t=taskById(state.focus.taskId);if(t)t.timeSpent+=(spent/60);state.focus.active=false;state.focus.paused=false;state.events.push({type:'FOCUS_COMPLETED',entityId:state.focus.taskId,seconds:spent,at:Date.now()});state.xp+=Math.round(spent/60);persist();render();toast('Focus saved')}
let timerHandle=null;
function tick(){if(!state.focus.active)return;state.focus.seconds=Math.max(0,state.focus.seconds-1);if(state.focus.seconds===0)stopFocus();else renderFocusTimerOnly()}
function renderFocusTimerOnly(){const el=document.getElementById('focus-timer');if(el)el.textContent=fmtTime(Math.floor(state.focus.seconds/60))+':'+String(state.focus.seconds%60).padStart(2,'0')}
function openModal(view,data,opts){document.getElementById('backdrop').classList.add('open');const m=document.getElementById('modal');m.style.display='block';m.innerHTML=view(data,opts)||'';requestAnimationFrame(()=>m.classList.add('open'));}
function closeModal(){document.getElementById('backdrop').classList.remove('open');const m=document.getElementById('modal');m.style.display='none';m.classList.remove('open')}
function openDrawer(html){document.getElementById('drawer-content').innerHTML=html;document.getElementById('drawer-backdrop').classList.add('open');document.getElementById('drawer').classList.add('open')}
function closeDrawer(){document.getElementById('drawer-backdrop').classList.remove('open');document.getElementById('drawer').classList.remove('open')}
function taskModal(t,opts={}){t=t||{id:'',title:'',desc:'',priority:'Medium',energy:'Light',due:today,important:false,urgent:false,status:'Inbox',tags:[],timeSpent:0,scheduled:false};return `<div class="modal-inner"><div class="split"><div><div class="eyebrow">${t.id?'Task':'Quick capture'}</div><h2 id="modal-title" style="margin:4px 0 4px">${esc(t.title||'New task')}</h2><div class="quiet">${opts.recommendation?'A dry-run preview is required before changing your planner.':''}</div></div><button class="btn icon-btn" onclick="closeModal()">×</button></div><form class="form" onsubmit="saveTask(event,'${esc(t.id)}')" style="margin-top:18px"><div class="field"><label>Title</label><input name="title" required value="${esc(t.title)}"></div><div class="field"><label>Description</label><textarea name="desc">${esc(t.desc||'')}</textarea></div><div class="grid grid-2"><div class="field"><label>Priority</label><select name="priority">${['Low','Medium','High'].map(x=>`<option ${t.priority===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Energy</label><select name="energy">${['Light','Focused','Deep'].map(x=>`<option ${t.energy===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="grid grid-2"><div class="field"><label>Due date</label><input type="date" name="due" value="${esc(t.due||'')}"></div><div class="field"><label>Status</label><select name="status">${['Inbox','To Do','In Progress','Completed'].map(x=>`<option ${t.status===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="chips"><label class="check"><input type="checkbox" name="important" ${t.important?'checked':''}> Important</label><label class="check"><input type="checkbox" name="urgent" ${t.urgent?'checked':''}> Urgent</label></div>${opts.recommendation?`<div class="success-note"><b>Preview:</b> create one 45-minute planner entry at the first open compatible window. Existing commitments are unchanged.</div>`:''}<div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">${opts.recommendation?'Save & schedule':'Save task'}</button></div></form></div>`}
function saveTask(e,id){e.preventDefault();const f=new FormData(e.target);let t=id?taskById(id):{id:uid('tsk'),tags:[],timeSpent:0,scheduled:false};Object.assign(t,{title:f.get('title'),desc:f.get('desc'),priority:f.get('priority'),energy:f.get('energy'),due:f.get('due')||null,status:f.get('status'),important:f.get('important')==='on',urgent:f.get('urgent')==='on'});if(!id)state.tasks.unshift(t);const opts=e.target.querySelector('.success-note');if(opts){t.scheduled=true;state.planner.push({id:uid('p'),title:t.title,time:'14:00',duration:45,type:'focus',taskId:t.id,fixed:false});}state.events.push({type:id?'TASK_UPDATED':'TASK_CREATED',entityId:t.id,at:Date.now()});persist();closeModal();render()}
function noteModal(n={id:'',title:'',content:'',tags:[]}){return `<div class="modal-inner"><div class="split"><div><div class="eyebrow">Note</div><h2 id="modal-title" style="margin:4px 0 4px">Capture context</h2></div><button class="btn icon-btn" onclick="closeModal()">×</button></div><form class="form" onsubmit="saveNote(event,'${esc(n.id)}')" style="margin-top:18px"><div class="field"><label>Title</label><input name="title" required value="${esc(n.title)}"></div><div class="field"><label>Content</label><textarea name="content" required>${esc(n.content)}</textarea></div><div class="field"><label>Tags</label><input name="tags" value="${esc((n.tags||[]).join(', '))}"></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save note</button></div></form></div>`}
function saveNote(e,id){e.preventDefault();const f=new FormData(e.target);let n=id?state.notes.find(x=>x.id===id):{id:uid('note')};Object.assign(n,{title:f.get('title'),content:f.get('content'),tags:String(f.get('tags')).split(',').map(x=>x.trim()).filter(Boolean),created:today});if(!id)state.notes.unshift(n);state.events.push({type:id?'NOTE_UPDATED':'NOTE_CREATED',entityId:n.id,at:Date.now()});persist();closeModal();render()}
function expenseModal(){return `<div class="modal-inner"><div class="split"><div><div class="eyebrow">Quick capture</div><h2 id="modal-title" style="margin:4px 0">Expense</h2></div><button class="btn icon-btn" onclick="closeModal()">×</button></div><form class="form" onsubmit="saveExpense(event)" style="margin-top:18px"><div class="grid grid-2"><div class="field"><label>Amount</label><input name="amount" type="number" min="1" required placeholder="1240"></div><div class="field"><label>Category</label><select name="category"><option>Food</option><option>Dining</option><option>Transport</option><option>Tools</option><option>Other</option></select></div></div><div class="field"><label>Description</label><input name="title" required placeholder="What was this expense?"></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save expense</button></div></form></div>`}
function saveExpense(e){e.preventDefault();const f=new FormData(e.target);state.transactions.unshift({id:uid('tx'),title:f.get('title'),amount:Number(f.get('amount')),category:f.get('category'),date:today});state.events.push({type:'TRANSACTION_CREATED',at:Date.now()});persist();closeModal();render()}
function decisionModal(d){return `<div class="modal-inner"><div class="split"><div><div class="eyebrow">Financial decision</div><h2 id="modal-title" style="margin:4px 0">${esc(d.title)}</h2></div><button class="btn icon-btn" onclick="closeModal()">×</button></div><div class="grid grid-3" style="margin-top:18px"><div class="metric surface"><div class="label">Projected</div><div class="value">${money(d.projected)}</div></div><div class="metric surface"><div class="label">Actual</div><div class="value">${money(d.actual)}</div></div><div class="metric surface"><div class="label">Variance</div><div class="value">${money(Math.abs(d.projected-d.actual))}</div><div class="trend">${d.actual<=d.projected?'under':'over'} projected</div></div></div><div class="success-note" style="margin-top:16px">This is a reconciliation action only. It does not give financial advice or change the transaction.</div><div class="form-actions" style="margin-top:16px"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="reconcile('${d.id}')">Reconcile</button></div></div>`}
function reconcile(id){const d=state.decisions.find(x=>x.id===id);if(!d)return;d.status='Reconciled';state.events.push({type:'DECISION_RECONCILED',entityId:id,at:Date.now()});persist();closeModal();render();toast('Reconciled')}
function createGoalModal(){return `<div class="modal-inner"><div class="split"><div><div class="eyebrow">Goal / pathway</div><h2 id="modal-title" style="margin:4px 0">Create a goal</h2></div><button class="btn icon-btn" onclick="closeModal()">×</button></div><form class="form" onsubmit="saveGoal(event)" style="margin-top:18px"><div class="field"><label>Outcome</label><input name="title" required placeholder="What are you trying to achieve?"></div><div class="field"><label>First milestone</label><input name="step" required placeholder="The next concrete step"></div><div class="field"><label>Activity type</label><select name="type"><option>task</option><option>note</option><option>workout</option><option>time</option><option>story</option><option>finance</option></select></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Create goal</button></div></form></div>`}
function saveGoal(e){e.preventDefault();const f=new FormData(e.target);const g={id:uid('goal'),title:f.get('title'),progress:0,steps:[{id:uid('step'),title:f.get('step'),type:f.get('type'),done:false}]};state.goals.unshift(g);state.events.push({type:'GOAL_CREATED',entityId:g.id,at:Date.now()});persist();closeModal();render();setNav('goals')}
function globalCreate(){openModal(()=>`<div class="modal-inner"><div class="split"><div><div class="eyebrow">Create</div><h2 id="modal-title" style="margin:4px 0">Capture intent</h2></div><button class="btn icon-btn" onclick="closeModal()">×</button></div><div class="grid grid-2" style="margin-top:18px"><button class="btn" type="button" onclick="openModal(taskModal)"><b>+ Task</b><span class="muted-line">Something to do</span></button><button class="btn" type="button" onclick="openModal(noteModal)"><b>+ Note</b><span class="muted-line">Something to remember</span></button><button class="btn" type="button" onclick="openModal(expenseModal)"><b>+ Expense</b><span class="muted-line">Quick financial reality</span></button><button class="btn" type="button" onclick="openModal(createGoalModal)"><b>More</b><span class="muted-line">Project, goal, workout, budget</span></button></div></div>`)}
function inspect(entityType,id){
 let html='';
 if(entityType==='task'){const t=taskById(id);html=`<div class="eyebrow">Task</div><h2>${esc(t.title)}</h2><div class="chips"><span class="chip">${esc(t.priority)}</span><span class="chip">${esc(t.energy)}</span>${t.important?'<span class="chip accent">Important</span>':''}</div><p class="muted-line" style="margin-top:14px">${esc(t.desc||'No description')}</p><div class="actions"><button class="btn primary" onclick="startFocus('${t.id}')">Focus</button>${!t.scheduled&&t.status!=='Completed'?`<button class="btn" onclick="scheduleTask('${t.id}')">Schedule 45m</button>`:''}${t.status!=='Completed'?`<button class="btn" onclick="completeTask('${t.id}')">Complete</button>`:''}</div><div class="section"><div class="eyebrow">Relationships</div><div class="grid" style="margin-top:10px"><div class="surface" style="padding:13px">Focus · ${t.timeSpent.toFixed(0)}m logged</div><div class="surface" style="padding:13px">Planner · ${t.scheduled?'Scheduled':'Unscheduled'}</div><div class="surface" style="padding:13px">Goal · Portfolio launch</div></div></div>`}
 if(entityType==='rule'){const r=RULES.find(x=>x.id===id);html=`<div class="eyebrow">Rule inspector</div><h2>${esc(r.name)}</h2><div class="section"><div class="eyebrow">Observed</div><div class="chips" style="margin-top:9px">${r.evidence.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div><div class="section"><div class="eyebrow">Result</div><div class="surface" style="padding:14px;margin-top:9px">${esc(r.result)}</div></div>`}
 if(entityType==='vault'){html=vaultDrawer()}
 openDrawer(html||'<div class="empty"><strong>Nothing to inspect</strong></div>')
}
const RULES=[
 {id:'task_unscheduled_due_soon',name:'Important task is unscheduled',evidence:['High priority','Due today','No planner block','45m open'],result:'Suggested a 45-minute focus block.'},
 {id:'deep_task_open_window',name:'Deep task has a good window',evidence:['Energy = Deep','Open window ≥ 45m','No conflict'],result:'Make the compatible work session easy to start.'},
 {id:'stalled_task',name:'Task resurfacing without progress',evidence:['Repeated unfinished state','No recent progress'],result:'Offer Continue / Break down / Schedule / Dismiss.'},
 {id:'budget_pressure',name:'Budget pressure',evidence:['Actual ≥ 85% of configured limit'],result:'Show a review signal without telling the user what to spend.'},
 {id:'decision_awaiting_actual',name:'Decision ready to reconcile',evidence:['Provisional decision','Actual outcome available'],result:'Open a reconciliation preview.'},
 {id:'backup_overdue',name:'Backup is overdue',evidence:['Last backup beyond threshold'],result:'Surface a recovery action.'}
];
function viewToday(){const f=facts(),rec=recommendation();const main=rec?rec.title:(f.focusActive?'Continue your focus':(f.openCount?'You have work worth moving':'Today is calm'));const mainTask=rec?taskById(rec.entityId):f.focusCompatible;return `<div class="page"><div class="split"><div><div class="eyebrow">Today</div><div class="h1">${formatDay(today)}</div><div class="lead">A quiet command center for what matters, what needs doing, and what deserves attention now.</div></div><div class="chips"><span class="chip ${state.mode==='demo'?'accent':'good'}">${state.mode==='demo'?'Demo workspace':'Private workspace'}</span><span class="chip">Local only</span></div></div><section class="section"><div class="panel focus-panel"><div class="focus-row"><div><div class="eyebrow">${rec?'Next best action':'Current context'}</div><div class="focus-title">${esc(main)}</div><div class="lead">${rec?esc(rec.reason):(f.focusActive?'Your active session stays front and center until it ends.':`There are ${f.openCount} open tasks, ${f.importantUnscheduled} important task(s) without a block, and ${f.openWindow} minutes of open time.`)}</div>${rec?`<div class="reason"><b>Why:</b> ${rec.evidence.map(esc).join(' · ')} <button class="btn ghost mini" onclick="inspect('rule','${rec.ruleId}')">Why am I seeing this?</button></div>`:''}<div class="actions">${rec?`<button class="btn primary" onclick="actionForRec(recommendation())">${esc(rec.actionLabel)}</button><button class="btn" onclick="setNav('work')">Open task</button><button class="btn" onclick="state.dismissed['${rec.action==='review_budget'?'budget_pressure':rec.action==='reconcile'?'decision_reconcile':rec.ruleId}']=Date.now();persist();render()">Dismiss</button>`:mainTask?`<button class="btn primary" onclick="startFocus('${mainTask.id}')">Start Focus</button><button class="btn" onclick="inspect('task','${mainTask.id}')">Inspect</button>`:'<button class="btn primary" onclick="globalCreate()">Capture something</button>'}</div></div><div style="min-width:210px"><div class="eyebrow">Workspace signal</div><div class="metric surface" style="margin-top:8px"><div class="label">Open time</div><div class="value">45m</div><div class="trend">before your next commitment</div></div></div></div></div></section><section class="section grid grid-2"><div class="panel"><div class="panel-header"><h2>Today</h2><small>commitments</small></div><div class="timeline">${state.planner.slice().sort((a,b)=>a.time.localeCompare(b.time)).map(p=>`<div class="time-row"><div class="time">${esc(p.time)}</div><div class="event"><div class="event-title">${esc(p.title)}</div><div class="event-meta">${p.duration}m · ${esc(p.type)} ${p.taskId?'· task linked':''}</div></div></div>`).join('')}</div></div><div class="panel"><div class="panel-header"><h2>Quick capture</h2><small>organize later</small></div><div class="grid" style="padding:16px"><button class="btn" onclick="openModal(taskModal)">+ Task <span class="quiet">capture work</span></button><button class="btn" onclick="openModal(noteModal)">+ Note <span class="quiet">capture context</span></button><button class="btn" onclick="openModal(expenseModal)">+ Expense <span class="quiet">record reality</span></button><button class="btn" onclick="setNav('focus')">Timer <span class="quiet">enter focus</span></button></div></div></section><section class="section grid grid-3"><div class="panel metric"><div class="label">Needs attention</div><div class="value">${f.overdue}</div><div class="trend">overdue open tasks</div></div><div class="panel metric"><div class="label">Goal momentum</div><div class="value">${state.goals[0]?.progress||0}%</div><div class="trend">${esc(state.goals[0]?.title||'No active goal')}</div></div><div class="panel metric"><div class="label">Vault health</div><div class="value">${f.backupOverdue?'Review':'Good'}</div><div class="trend">last backup ${dateShort(state.vault.lastBackup)}</div></div></section></div>`}
function viewWork(){const tabs=['Inbox','To Do','In Progress','Completed'];const current=window.workTab||'To Do';const list=state.tasks.filter(t=>t.status===current);return `<div class="page"><div class="split"><div><div class="eyebrow">Work</div><div class="h1">What needs doing?</div><div class="lead">A direct execution surface. Tasks remain connected to focus, time, goals, notes, and history.</div></div><button class="btn primary" onclick="openModal(taskModal)">+ Task</button></div><section class="section"><div class="tabs">${tabs.map(t=>`<button class="tab ${current===t?'active':''}" onclick="window.workTab='${t}';render()">${t}</button>`).join('')}</div></section><section class="section panel"><div class="panel-header"><h2>${current}</h2><small>${list.length} items</small></div><div class="list">${list.length?list.map(t=>`<div class="row"><div class="row-main"><div class="row-title"><a class="entity-link" href="#/work">${esc(t.title)}</a></div><div class="row-meta">${t.due?`Due ${dateShort(t.due)} · `:''}${t.energy} · ${t.timeSpent.toFixed(0)}m logged ${t.scheduled?'· scheduled':''}</div><div class="chips" style="margin-top:7px"><span class="chip">${esc(t.priority)}</span>${t.important?'<span class="chip accent">Important</span>':''}${t.urgent?'<span class="chip danger">Urgent</span>':''}</div></div><div class="row-actions"><button class="btn mini" onclick="inspect('task','${t.id}')">Inspect</button>${t.status!=='Completed'?`<button class="btn mini accent" onclick="startFocus('${t.id}')">Focus</button><button class="btn mini" onclick="completeTask('${t.id}')">Complete</button>`:''}</div></div>`).join(''):`<div class="empty"><strong>No tasks here yet.</strong>Capture something you need to do.<div style="margin-top:12px"><button class="btn primary" onclick="openModal(taskModal)">Add task</button></div></div>`}</div></section><section class="section grid grid-2"><div class="panel"><div class="panel-header"><h2>Execution rules</h2><small>deterministic</small></div><div class="rule-card"><div class="rule-id">deep_task_open_window</div><div class="rule-name">Good window for deep work</div><div class="rule-why">When a compatible task and open time coexist, the system surfaces the opportunity without changing the schedule.</div></div><div class="rule-card"><div class="rule-id">stalled_task</div><div class="rule-name">This keeps coming back</div><div class="rule-why">The engine can offer a different action without inventing psychological explanations.</div></div></div><div class="panel"><div class="panel-header"><h2>Relationships</h2><small>one object, many contexts</small></div><div style="padding:18px"><div class="chips"><span class="chip accent">Task</span><span class="chip">→ Focus</span><span class="chip">→ Time log</span><span class="chip">→ Planner</span><span class="chip">→ Goal</span><span class="chip">→ Activity</span></div><p class="muted-line" style="margin-top:12px">The navigation is one way to access the object. Contextual links are equally important.</p></div></div></section></div>`}
function viewFocus(){const t=taskById(state.focus.taskId)||state.tasks.find(x=>x.status!=='Completed');return `<div class="page"><div class="eyebrow">Focus</div><div class="h1">What am I doing now?</div><div class="lead">A dedicated concentration surface. No dashboard analytics while the timer is active.</div><section class="section"><div class="panel focus-panel" style="min-height:420px;display:grid;align-content:center;justify-items:center;text-align:center"><div class="eyebrow">${state.focus.active?'Current task':'Ready'}</div><h2 style="font-size:28px;margin:10px 0">${esc(t?.title||'Choose a task to focus on')}</h2><div id="focus-timer" style="font-size:74px;letter-spacing:-.06em;font-variant-numeric:tabular-nums;margin:6px 0 18px">${fmtTime(Math.floor(state.focus.seconds/60))}:${String(state.focus.seconds%60).padStart(2,'0')}</div><div class="chips"><span class="chip accent">${esc(state.focus.category)}</span>${t?`<span class="chip">${esc(t.energy)}</span>`:''}</div><div class="actions" style="justify-content:center">${state.focus.active?`<button class="btn primary" onclick="stopFocus()">End & save</button><button class="btn" onclick="pauseFocus()">Pause</button>`:`<button class="btn primary" onclick="${t?(state.focus.paused?'resumeFocus()':`startFocus('${t.id}')`):'globalCreate()'}">${t?(state.focus.paused?'Resume Focus':'Start Focus'):'Choose task'}</button><button class="btn" onclick="setNav('work')">Browse work</button>`}</div><div class="reason" style="max-width:540px"><b>State-aware:</b> when focus is active, unrelated recommendations are suppressed and the active task remains accessible from Today, Work, Plan, and the task inspector.</div></div></section><section class="section grid grid-3"><div class="panel metric"><div class="label">Today's focus</div><div class="value">115m</div><div class="trend">logged time</div></div><div class="panel metric"><div class="label">Category</div><div class="value" style="font-size:18px">Deep Work</div><div class="trend">local preference</div></div><div class="panel metric"><div class="label">XP</div><div class="value">${state.xp}</div><div class="trend">real actions first</div></div></section></div>`}
function viewPlan(){const hours=state.planner.reduce((a,b)=>a+b.duration,0);const open=60;return `<div class="page"><div class="split"><div><div class="eyebrow">Plan</div><div class="h1">How should I use my time?</div><div class="lead">Planning, calendar, reminders, and time tools stay distinct. This surface is for the shape of the day.</div></div><div class="tabs"><button class="tab active">Plan</button><button class="tab" onclick="setNav('calendar')">Calendar</button><button class="tab" onclick="setNav('reminders')">Remind</button><button class="tab" onclick="setNav('timer')">Time tools</button></div></div><section class="section grid grid-2"><div class="panel"><div class="panel-header"><h2>Today’s shape</h2><small>fixed commitments first</small></div><div class="list">${state.planner.map(p=>`<div class="row"><div class="row-main"><div class="row-title">${esc(p.title)}</div><div class="row-meta">${esc(p.time)} · ${p.duration}m · ${esc(p.type)}</div></div><span class="status-badge ${p.fixed?'open':'focus'}">${p.fixed?'fixed':'planned'}</span></div>`).join('')}<div class="row"><div class="row-main"><div class="row-title">Open window</div><div class="row-meta">14:45–15:45 · compatible work possible</div></div><span class="chip good">60m open</span></div></div></div><div class="panel pad"><div class="eyebrow">Capacity</div><h2 style="font-size:27px;margin:7px 0">${hours>300?'Over capacity':'Within capacity'}</h2><p class="muted-line">Fixed commitments, travel, breaks, and planned work are evaluated together. Nothing is silently moved.</p><div class="progress" style="margin-top:18px"><div class="progress-line"><span>Planned</span><b>${hours}m</b></div><div class="bar"><i style="width:${Math.min(100,Math.round(hours/480*100))}%"></i></div></div><div class="actions"><button class="btn" onclick="openModal(taskModal)">Add focused block</button><button class="btn" onclick="toast('No commitments were moved')">Rebalance</button></div></div></section><section class="section panel"><div class="panel-header"><h2>Upcoming</h2><small>next 7 days</small></div><table class="table"><thead><tr><th>Time</th><th>Commitment</th><th>Type</th><th>Link</th></tr></thead><tbody>${['10 Oct','11 Oct','13 Oct'].map((d,i)=>`<tr><td>${d}</td><td>${['Demo rehearsal','Workout','Client follow-up'][i]}</td><td>${['work','life','meeting'][i]}</td><td><span class="chip">Open</span></td></tr>`).join('')}</tbody></table></section></div>`}
function viewGoals(){return `<div class="page"><div class="split"><div><div class="eyebrow">Goals</div><div class="h1">What am I trying to achieve?</div><div class="lead">A roadmap is an ordered path, not a checklist dump. Each milestone routes into the real entity that executes it.</div></div><button class="btn primary" onclick="openModal(createGoalModal)">+ Goal</button></div><section class="section grid grid-2">${state.goals.map(g=>`<div class="panel"><div class="panel-header"><div><h2>${esc(g.title)}</h2><small>${g.steps.length} milestones</small></div><span class="chip accent">${g.progress}%</span></div><div style="padding:18px"><div class="bar"><i style="width:${g.progress}%"></i></div><div class="list" style="margin-top:10px">${g.steps.map((s,i)=>`<div class="row"><div class="row-main"><div class="row-title">${s.done?'✓ ':''}${esc(s.title)}</div><div class="row-meta">Step ${i+1} · activity type: ${s.type}</div></div>${s.done?'<span class="status-badge done">done</span>':`<button class="btn mini primary" onclick="executeStep('${g.id}','${s.id}')">Prepare ${esc(s.type)}</button>`}</div>`).join('')}</div></div></div>`).join('')}</section><section class="section panel pad"><div class="eyebrow">Connected entities</div><div class="chips" style="margin-top:10px"><span class="chip accent">Goal</span><span class="chip">→ Pathway step</span><span class="chip">→ Task</span><span class="chip">→ Story</span><span class="chip">→ Note</span><span class="chip">→ Finance</span><span class="chip">→ Workout</span></div></section></div>`}
function executeStep(gid,sid){const g=state.goals.find(x=>x.id===gid),s=g?.steps.find(x=>x.id===sid);if(!s)return;if(s.type==='task'){openModal(taskModal,{title:s.title,priority:'High',energy:'Focused',due:today,important:true,status:'To Do',desc:`Goal: ${g.title}`})}else if(s.type==='note')openModal(noteModal,{title:s.title,content:`Goal context: ${g.title}`,tags:['goal']});else toast(`Open ${s.type} flow`)}
function viewLife(){return `<div class="page"><div class="eyebrow">Life</div><div class="h1">How am I taking care of myself?</div><div class="lead">Fitness, habits, and reminders live here without competing visually with execution.</div><section class="section grid grid-2"><div class="panel"><div class="panel-header"><h2>Habits</h2><small>today</small></div><div class="list">${state.habits.map(h=>`<div class="row"><div><div class="row-title">${esc(h.title)}</div><div class="row-meta">${h.streak} day streak context</div></div><button class="btn mini ${h.done?'':'primary'}" onclick="toggleHabit('${h.id}')">${h.done?'Done':'Mark done'}</button></div>`).join('')}</div></div><div class="panel"><div class="panel-header"><h2>Fitness</h2><button class="btn mini" onclick="logWorkout()">+ Log</button></div><div class="list">${state.workouts.map(w=>`<div class="row"><div><div class="row-title">${esc(w.title)}</div><div class="row-meta">${esc(w.type)} · ${w.duration}m · RPE ${w.rpe} · ${dateShort(w.date)}</div></div></div>`).join('')}</div></div></section><section class="section panel"><div class="panel-header"><h2>Reminders</h2><small>time-based</small></div><div class="row"><div><div class="row-title">Hydrate</div><div class="row-meta">Tomorrow · 11:30 · local alarm</div></div><span class="status-badge open">scheduled</span></div><div class="row"><div><div class="row-title">Call family</div><div class="row-meta">Friday · 19:00 · notification permission respected</div></div><span class="status-badge open">scheduled</span></div></section></div>`}
function toggleHabit(id){const h=state.habits.find(x=>x.id===id);if(h){h.done=!h.done;if(h.done){h.streak+=1;state.xp+=5;state.events.push({type:'HABIT_COMPLETED',entityId:id,at:Date.now()})}persist();render()}}
function logWorkout(){state.workouts.unshift({id:uid('w'),title:"Today's session",type:'Training',duration:30,rpe:6,date:today});state.xp+=15;state.events.push({type:'WORKOUT_LOGGED',at:Date.now()});persist();render();toast('Workout logged')}
function viewMoney(){const income=120000,spent=state.transactions.reduce((a,t)=>a+t.amount,0);return `<div class="page"><div class="eyebrow">Money</div><div class="h1">Where do I stand?</div><div class="lead">Calm, data-forward financial awareness. Budget is intention, decision is anticipated choice, transaction is reality.</div><section class="section grid grid-3"><div class="panel metric"><div class="label">Income</div><div class="value">${state.settings.hideAmounts?'••••':money(income)}</div><div class="trend">configured baseline</div></div><div class="panel metric"><div class="label">Spent</div><div class="value">${state.settings.hideAmounts?'••••':money(spent)}</div><div class="trend">recorded transactions</div></div><div class="panel metric"><div class="label">Room / pressure</div><div class="value">2 signals</div><div class="trend">review configured limits</div></div></section><section class="section grid grid-2"><div class="panel"><div class="panel-header"><h2>Budgets</h2><small>configured boundaries</small></div>${state.budgets.map(b=>{const pct=Math.min(100,b.spent/b.limit*100);return `<div class="row"><div class="row-main"><div class="row-title">${esc(b.name)}</div><div class="row-meta">${money(b.spent)} / ${money(b.limit)}</div><div class="bar" style="margin-top:8px"><i style="width:${pct}%"></i></div></div><span class="chip ${pct>=100?'danger':pct>=85?'warn':'good'}">${Math.round(pct)}%</span></div>`}).join('')}</div><div class="panel"><div class="panel-header"><h2>Decisions</h2><small>anticipated → actual</small></div>${state.decisions.map(d=>`<div class="row"><div class="row-main"><div class="row-title">${esc(d.title)}</div><div class="row-meta">Projected ${money(d.projected)} · Actual ${money(d.actual)}</div></div><button class="btn mini ${d.status==='Reconciled'?'':'primary'}" onclick="${d.status==='Reconciled'?'toast(\'Already reconciled\')':`openModal(decisionModal,state.decisions.find(x=>x.id==='${d.id}'))`}">${d.status==='Reconciled'?'Reconciled':'Reconcile'}</button></div>`).join('')}</div></section><section class="section panel"><div class="panel-header"><h2>Transactions</h2><button class="btn mini" onclick="openModal(expenseModal)">+ Expense</button></div><table class="table"><thead><tr><th>Date</th><th>What</th><th>Category</th><th>Amount</th></tr></thead><tbody>${state.transactions.map(t=>`<tr><td>${dateShort(t.date)}</td><td>${esc(t.title)}</td><td>${esc(t.category)}</td><td class="pill-value">${state.settings.hideAmounts?'••••':money(t.amount)}</td></tr>`).join('')}</tbody></table></section></div>`}
function viewMemory(){return `<div class="page"><div class="eyebrow">Memory</div><div class="h1">What do I want to remember?</div><div class="lead">Notes, history, and recovery are connected without creating a hidden second “AI memory.”</div><section class="section grid grid-2"><div class="panel"><div class="panel-header"><h2>Notes</h2><button class="btn mini" onclick="openModal(noteModal)">+ Note</button></div><div class="list">${state.notes.map(n=>`<div class="row"><div class="row-main"><div class="row-title">${esc(n.title)}</div><div class="row-meta">${dateShort(n.created)} · ${(n.tags||[]).join(' · ')}</div><div class="muted-line" style="margin-top:7px">${esc(n.content)}</div></div><button class="btn mini" onclick="convertNote('${n.id}')">→ Task</button></div>`).join('')}</div></div><div class="panel"><div class="panel-header"><h2>History</h2><small>what happened</small></div><div class="list">${state.activities.concat(state.events.slice(-6).reverse().map(e=>({time:new Date(e.at||Date.now()).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}),title:e.type,meta:e.entityId||'Workspace'}))).slice(0,8).map(a=>`<div class="row"><div><div class="row-title">${esc(a.title)}</div><div class="row-meta">${esc(a.time)} · ${esc(a.meta)}</div></div></div>`).join('')}</div></div></section><section class="section panel"><div class="panel-header"><h2>Recovery</h2><div class="chips"><button class="btn mini" onclick="setNav('vault')">Vault</button></div></div><div style="padding:18px"><div class="grid grid-2"><div class="surface" style="padding:16px"><div class="eyebrow">Checkpoint</div><div style="margin-top:5px;font-weight:650">Local restore point</div><div class="muted-line" style="margin-top:4px">Last checkpoint ${dateShort(state.vault.lastCheckpoint)}</div></div><div class="surface" style="padding:16px"><div class="eyebrow">Backup</div><div style="margin-top:5px;font-weight:650">Portable encrypted representation</div><div class="muted-line" style="margin-top:4px">Last backup ${dateShort(state.vault.lastBackup)}</div></div></div></div></section></div>`}
function convertNote(id){const n=state.notes.find(x=>x.id===id);if(!n)return;openModal(taskModal,{title:n.title,desc:n.content,priority:'Medium',energy:'Light',due:today,status:'Inbox',important:false,urgent:false})}
function vaultDrawer(){return `<div class="eyebrow">Your private vault</div><h2>Recovery & safety</h2><p class="muted-line">This interface keeps the vault mental model local: no conventional server account, no cloud storage, and no remote inference in this static experience.</p><div class="section"><div class="surface" style="padding:15px"><div class="split"><span>Vault state</span><span class="status-badge ${state.vault.locked?'open':'done'}">${state.vault.locked?'locked':'unlocked'}</span></div><div class="muted-line" style="margin-top:8px">Locking hides the workspace and clears the in-memory passphrase reference.</div></div></div><div class="section"><div class="eyebrow">Backup</div><div class="muted-line" style="margin:7px 0 12px">Last backup ${dateShort(state.vault.lastBackup)}</div><button class="btn primary" onclick="backupWorkspace()">Create backup</button></div><div class="section"><div class="eyebrow">Checkpoint</div><div class="muted-line" style="margin:7px 0 12px">Last checkpoint ${dateShort(state.vault.lastCheckpoint)}</div><div class="actions"><button class="btn" onclick="createCheckpoint()">Create checkpoint</button><button class="btn" onclick="compareCheckpoint()">Compare</button></div></div><div class="section danger-note">Restore is designed as a validate → preview → explicit replacement flow. This demo never overwrites state without an explicit action.</div>`}
function viewVault(){return `<div class="page"><div class="split"><div><div class="eyebrow">Vault</div><div class="h1">Is my workspace safe?</div><div class="lead">Recovery should be visible, deliberate, and boring in the best possible way.</div></div><button class="btn primary" onclick="backupWorkspace()">Back up</button></div><section class="section grid grid-2"><div class="panel pad"><div class="eyebrow">Vault health</div><h2 style="margin:7px 0">${facts().backupOverdue?'Review needed':'Healthy enough to continue'}</h2><div class="grid" style="margin-top:18px"><div class="surface" style="padding:14px"><div class="split"><span>Portable backup</span><span class="status-badge ${facts().backupOverdue?'open':'done'}">${facts().backupOverdue?'overdue':'current'}</span></div><div class="muted-line" style="margin-top:5px">Last backup: ${dateShort(state.vault.lastBackup)}</div></div><div class="surface" style="padding:14px"><div class="split"><span>Local checkpoint</span><span class="status-badge done">available</span></div><div class="muted-line" style="margin-top:5px">Last checkpoint: ${dateShort(state.vault.lastCheckpoint)}</div></div></div></div><div class="panel pad"><div class="eyebrow">Returning user</div><h2 style="margin:7px 0">${state.vault.locked?'Vault locked':'Vault unlocked'}</h2><div class="actions"><button class="btn primary" onclick="toggleLock()">${state.vault.locked?'Unlock':'Lock Vault'}</button><button class="btn" onclick="resetDemo()">Create new demo vault</button></div><p class="muted-line" style="margin-top:12px">For a true production vault, the source application's existing crypto, migration, and storage engines should remain authoritative.</p></div></section><section class="section panel"><div class="panel-header"><h2>Restore</h2><small>safe replacement flow</small></div><div style="padding:18px"><div class="grid grid-2"><div class="surface" style="padding:15px"><div class="eyebrow">1 · inspect</div><div class="muted-line" style="margin-top:6px">Choose a backup file, validate its envelope, indexes, and decrypted state before touching current storage.</div></div><div class="surface" style="padding:15px"><div class="eyebrow">2 · preview</div><div class="muted-line" style="margin-top:6px">Show exactly what would replace the current vault before commit.</div></div></div><div class="actions"><button class="btn" onclick="fileRestore()">Choose backup file</button><button class="btn" onclick="toast('No file selected')">Inspect restore</button></div></div></section><section class="section panel"><div class="panel-header"><h2>Recovery actions</h2><small>explicit</small></div><div class="row"><div><div class="row-title">Checkpoint</div><div class="row-meta">Create a local restore point without changing current state.</div></div><button class="btn mini" onclick="createCheckpoint()">Create checkpoint</button></div><div class="row"><div><div class="row-title">Compare</div><div class="row-meta">Review the display-level diff before making any replacement.</div></div><button class="btn mini" onclick="compareCheckpoint()">Compare</button></div></section><section class="section panel"><div class="panel-header"><h2>Security principles</h2><small>implementation constraints</small></div><div class="row"><div><div class="row-title">Local-only</div><div class="row-meta">No server, no cloud storage, no telemetry.</div></div><span class="chip good">active</span></div><div class="row"><div><div class="row-title">Encrypted persistence</div><div class="row-meta">The production source should retain its Web Crypto, PBKDF2, AES-GCM, and envelope behavior.</div></div><span class="chip accent">source-led</span></div><div class="row"><div><div class="row-title">Untrusted imports</div><div class="row-meta">Validate envelope structure, strings, numbers, arrays, object shapes, and image data.</div></div><span class="chip warn">guarded</span></div></section></div>`}
function toggleLock(){state.vault.locked=!state.vault.locked;persist();if(state.vault.locked){toast('Vault locked')}else{toast('Vault unlocked')}render()}
function backupWorkspace(){state.vault.lastBackup=today;state.events.push({type:'BACKUP_EXPORTED',at:Date.now()});persist();const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='astralsurge-workspace-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);render();toast('Backup created')}
function createCheckpoint(){state.vault.lastCheckpoint=today;state.events.push({type:'CHECKPOINT_CREATED',at:Date.now()});persist();render();toast('Checkpoint created')}
function compareCheckpoint(){openDrawer(`<div class="eyebrow">Checkpoint diff</div><h2>Yesterday → now</h2><p class="muted-line">This demo compares safe, display-level workspace changes without replacing current state.</p><div class="section"><div class="surface" style="padding:13px">+ 1 completed acceptance criterion</div><div class="surface" style="padding:13px;margin-top:8px">+ 1 focus event</div><div class="surface" style="padding:13px;margin-top:8px">+ 1 transaction</div></div>`)}
function fileRestore(){const i=document.createElement('input');i.type='file';i.accept='.json,.asbackup';i.onchange=()=>{if(!i.files[0])return;toast('Backup selected — validation preview ready');openDrawer(`<div class="eyebrow">Restore preview</div><h2>${esc(i.files[0].name)}</h2><p class="muted-line">The current vault has not been changed. A production restore must validate and decrypt before explicit replacement.</p><div class="success-note">Current state remains untouched.</div><div class="actions"><button class="btn" onclick="closeDrawer()">Cancel</button></div>`)};i.click()}
function viewProgress(){const done=state.tasks.filter(t=>t.status==='Completed').length;return `<div class="page"><div class="eyebrow">Progress</div><div class="h1">Celebrate real action</div><div class="lead">XP, levels, streaks, and achievements are secondary reinforcement—not the work itself.</div><section class="section grid grid-3"><div class="panel metric"><div class="label">Level</div><div class="value">${state.level}</div><div class="trend">${state.xp} XP</div></div><div class="panel metric"><div class="label">Streak</div><div class="value">${state.streak}</div><div class="trend">days</div></div><div class="panel metric"><div class="label">Completed</div><div class="value">${done}</div><div class="trend">tasks in workspace</div></div></section><section class="section panel"><div class="panel-header"><h2>Weekly review</h2><small>reflection</small></div><div style="padding:18px"><div class="grid grid-3"><div class="surface" style="padding:15px"><div class="eyebrow">What moved</div><div style="margin-top:6px">${done} tasks + ${state.workouts.length} workouts</div></div><div class="surface" style="padding:15px"><div class="eyebrow">Where time went</div><div style="margin-top:6px">115m focused work</div></div><div class="surface" style="padding:15px"><div class="eyebrow">Next</div><div style="margin-top:6px">${esc(state.goals[0]?.steps.find(x=>!x.done)?.title||'Keep going')}</div></div></div></div></section><section class="section panel"><div class="panel-header"><h2>Achievements</h2><small>quiet reinforcement</small></div><div class="row"><div><div class="row-title">Momentum</div><div class="row-meta">Maintained a ${state.streak}-day habit streak context.</div></div><span class="chip accent">earned</span></div><div class="row"><div><div class="row-title">Deep Work</div><div class="row-meta">100+ minutes of focus logged.</div></div><span class="chip good">earned</span></div></section></div>`}
function viewRules(){return `<div class="page"><div class="eyebrow">Agent activity</div><div class="h1">Useful when it speaks.</div><div class="lead">Deterministic rules observe real state, derive facts, rank candidate actions, explain evidence, ask for approval, then route through existing domain capabilities.</div><section class="section grid grid-2"><div class="panel"><div class="panel-header"><h2>Suggestions</h2><small>attention budget</small></div><div class="row"><div><div class="row-title">Today</div><div class="row-meta">Maximum 1 dominant recommendation + 2–4 supporting signals.</div></div><span class="chip good">quiet</span></div><div class="row"><div><div class="row-title">Current focus</div><div class="row-meta">Suppress irrelevant suggestions while focus is active.</div></div><span class="chip accent">contextual</span></div></div><div class="panel"><div class="panel-header"><h2>Rule inspector</h2><small>why this?</small></div>${RULES.map(r=>`<div class="rule-card"><div class="rule-id">${r.id}</div><div class="rule-name">${esc(r.name)}</div><div class="rule-why">${esc(r.result)}</div><div class="actions"><button class="btn mini" onclick="inspect('rule','${r.id}')">Inspect rule</button></div></div>`).join('')}</div></section><section class="section panel"><div class="panel-header"><h2>Closed loop</h2><small>no fake intelligence</small></div><div style="padding:18px"><div class="chips"><span class="chip">Raw state</span><span class="chip">→ Derived facts</span><span class="chip">→ Rules</span><span class="chip">→ Candidate</span><span class="chip">→ Policy</span><span class="chip">→ User approval</span><span class="chip">→ Domain engine</span><span class="chip">→ Result event</span></div></div></section></div>`}
function viewSettings(){return `<div class="page"><div class="eyebrow">Settings</div><div class="h1">Keep it simple.</div><div class="lead">A few high-signal controls; no settings labyrinth.</div><section class="section panel"><div class="row"><div><div class="row-title">Suggestions</div><div class="row-meta">Control how much the rule engine surfaces.</div></div><select onchange="state.settings.suggestions=this.value;persist();render()" style="background:#0f1216;color:#fff;border:1px solid #2b3038;border-radius:9px;padding:8px"><option ${state.settings.suggestions==='On'?'selected':''}>On</option><option ${state.settings.suggestions==='Reduced'?'selected':''}>Reduced</option><option ${state.settings.suggestions==='Off'?'selected':''}>Off</option></select></div><div class="row"><div><div class="row-title">Density</div><div class="row-meta">Minimal information before progressive disclosure.</div></div><select onchange="state.settings.density=this.value;persist();render()" style="background:#0f1216;color:#fff;border:1px solid #2b3038;border-radius:9px;padding:8px"><option ${state.settings.density==='Minimal'?'selected':''}>Minimal</option><option ${state.settings.density==='Normal'?'selected':''}>Normal</option></select></div><div class="row"><div><div class="row-title">Hide amounts</div><div class="row-meta">Visually suppress money values on screen.</div></div><button class="btn mini" onclick="state.settings.hideAmounts=!state.settings.hideAmounts;persist();render()">${state.settings.hideAmounts?'On':'Off'}</button></div><div class="row"><div><div class="row-title">Theme</div><div class="row-meta">Deep charcoal · warm near-black · restrained accents.</div></div><span class="chip accent">Dark</span></div></section><section class="section panel"><div class="panel-header"><h2>Data controls</h2></div><div class="row"><div><div class="row-title">Export workspace snapshot</div><div class="row-meta">Local JSON export for this static demo state.</div></div><button class="btn mini" onclick="downloadState()">Export</button></div><div class="row"><div><div class="row-title">Reset demo</div><div class="row-meta">Recreates explicit demo data only.</div></div><button class="btn mini" onclick="resetDemo()">Reset</button></div></section></div>`}
function downloadState(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='astralsurge-workspace-demo.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function viewLegal(){return `<div class="page"><div class="eyebrow">Legal & security</div><div class="h1">Read the source text unchanged.</div><div class="lead">This static redesign intentionally does not invent or paraphrase the application's legal wording. Insert the exact legal/security copy from the authoritative source build before shipping.</div><section class="section panel pad"><div class="danger-note">The provided rearchitecture specification requires the existing legal/security text to remain verbatim. That source text was not included in the uploaded specification itself, so this page does not fabricate it.</div><div class="section"><div class="eyebrow">Required preservation areas</div><div class="chips" style="margin-top:9px"><span class="chip">Local-only processing</span><span class="chip">Hosting metadata</span><span class="chip">GitHub Pages origin warning</span><span class="chip">Encryption claims</span><span class="chip">Passphrase recovery limitation</span><span class="chip">Storage quota risks</span><span class="chip">Health disclaimer</span><span class="chip">Financial disclaimer</span><span class="chip">License notices</span></div></div></div></section></div>`}
let calendarCursor=new Date();calendarCursor.setDate(1);
function shiftCalendar(delta){calendarCursor.setMonth(calendarCursor.getMonth()+delta);render()}
function resetCalendar(){calendarCursor=new Date();calendarCursor.setDate(1);render()}
function viewCalendar(){const y=calendarCursor.getFullYear(),m=calendarCursor.getMonth();const monthLabel=new Date(y,m,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'});const daysInMonth=new Date(y,m+1,0).getDate();const samples=['Focus · 45m','Client meeting','Open time','Demo rehearsal','Workout','Review budget'];return `<div class="page"><div class="eyebrow">Calendar</div><div class="h1">The month at a glance.</div><div class="lead">Aggregated planner entries, tasks, workouts, habits, and recurring financial items remain accessible without becoming the home screen.</div><section class="section panel"><div class="panel-header"><h2>${esc(monthLabel)}</h2><div class="actions" style="margin:0"><button class="btn mini" onclick="shiftCalendar(-1)" aria-label="Previous month">‹</button><button class="btn mini" onclick="resetCalendar()">Today</button><button class="btn mini" onclick="shiftCalendar(1)" aria-label="Next month">›</button></div></div><div style="padding:18px"><div class="grid grid-3">${Array.from({length:Math.min(daysInMonth,12)},(_,i)=>{const d=i+1;return `<div class="surface" style="padding:16px;min-height:110px"><div class="eyebrow">${d} ${monthLabel.split(' ')[0]}</div><div style="margin-top:9px;font-size:12px">${esc(samples[i%samples.length])}</div></div>`}).join('')}</div></div></section></div>`}
function viewReminders(){return `<div class="page"><div class="eyebrow">Remind</div><div class="h1">Reminder tools, separated.</div><div class="lead">One-time alarms and timer tools are distinct from planning. Notification permission is respected.</div><section class="section grid grid-2"><div class="panel pad"><div class="eyebrow">Alarms</div><h2 style="margin:7px 0">2 scheduled</h2><div class="list" style="margin-top:12px"><div class="row"><div><div class="row-title">Hydrate</div><div class="row-meta">11:30</div></div><span class="status-badge open">local</span></div><div class="row"><div><div class="row-title">Call family</div><div class="row-meta">Friday · 19:00</div></div><span class="status-badge open">local</span></div></div></div><div class="panel pad"><div class="eyebrow">Timezone</div><h2 style="margin:7px 0">Asia/Kolkata</h2><div class="muted-line">Current browser clock is used for local time display.</div><div class="actions"><button class="btn" onclick="setNav('timer')">Open timer tools</button></div></div></section></div>`}
function viewTimer(){return `<div class="page"><div class="eyebrow">Time tools</div><div class="h1">Timer tools.</div><div class="lead">Countdown, stopwatch, laps, and local clock remain a focused utility rather than a dashboard.</div><section class="section panel focus-panel"><div style="text-align:center"><div class="eyebrow">Countdown</div><div id="tool-timer" style="font-size:64px;letter-spacing:-.06em;font-variant-numeric:tabular-nums;margin:10px 0">25:00</div><div class="actions" style="justify-content:center"><button class="btn primary" onclick="startStandaloneTimer()">Start</button><button class="btn" onclick="resetStandaloneTimer()">Reset</button></div></div></section></div>`}
let standalone=1500,standaloneHandle=null;function startStandaloneTimer(){if(standaloneHandle)return;standaloneHandle=setInterval(()=>{standalone=Math.max(0,standalone-1);const e=document.getElementById('tool-timer');if(e)e.textContent=`${String(Math.floor(standalone/60)).padStart(2,'0')}:${String(standalone%60).padStart(2,'0')}`;if(standalone===0)stopStandalone()},1000);toast('Timer started')};function stopStandalone(){clearInterval(standaloneHandle);standaloneHandle=null};function resetStandaloneTimer(){stopStandalone();standalone=1500;render()}
function search(q){const needle=q.trim().toLowerCase();if(!needle)return [];const out=[];state.tasks.forEach(t=>{if([t.title,t.desc,...(t.tags||[])].join(' ').toLowerCase().includes(needle))out.push({type:'Task',title:t.title,id:t.id,context:`${t.status} · ${t.priority}`})});state.notes.forEach(n=>{if([n.title,n.content,...(n.tags||[])].join(' ').toLowerCase().includes(needle))out.push({type:'Note',title:n.title,id:n.id,context:'Memory'})});state.goals.forEach(g=>{if(g.title.toLowerCase().includes(needle))out.push({type:'Goal',title:g.title,id:g.id,context:'Goals'})});state.transactions.forEach(t=>{if([t.title,t.category].join(' ').toLowerCase().includes(needle))out.push({type:'Transaction',title:t.title,id:t.id,context:`${t.category} · ${money(t.amount)}`})});return out.slice(0,10)}
function globalSearch(){openModal(()=>`<div class="modal-inner"><div class="split"><div><div class="eyebrow">Global search</div><h2 id="modal-title" style="margin:4px 0">Find anything</h2></div><button class="btn icon-btn" onclick="closeModal()">×</button></div><div class="field" style="margin-top:16px"><label>Workspace retrieval</label><input id="search-input" autofocus placeholder="Try proposal, launch, food…" oninput="drawSearchResults(this.value)"></div><div id="search-results" style="margin-top:12px"></div></div>`);}
function drawSearchResults(q){
 const e=document.getElementById('search-results');
 if(!e)return;
 const needle=q.trim();
 if(!needle){e.innerHTML='<div class=\"empty\"><strong>Search the whole workspace.</strong>Tasks, projects, goals, notes, transactions, workouts, planner entries, history, and commands.</div>';return;}
 const r=search(q);
 if(!r.length){e.innerHTML='<div class=\"empty\"><strong>No matching workspace objects.</strong>Search is deterministic: titles, categories, tags, dates, and entity types.</div>';return;}
 e.innerHTML=r.map(x=>`<div class=\"row surface\" style=\"margin-bottom:7px;border:1px solid var(--line)\"><div><div class=\"row-title\">${esc(x.title)}</div><div class=\"row-meta\">${x.type} · ${esc(x.context)}</div></div><button class=\"btn mini\" onclick=\"searchOpen('${x.type}','${esc(x.id)}')\">Open</button></div>`).join('');
}
function searchOpen(type,id){closeModal();if(type==='Task')inspect('task',id);else if(type==='Note'){const n=state.notes.find(x=>x.id===id);openModal(noteModal,n)}else if(type==='Goal')setNav('goals');else if(type==='Transaction')setNav('money')}
function navItems(){return [['today','Today','◉'],['work','Work','✓'],['focus','Focus','◌'],['plan','Plan','⌁'],['more','More','＋']]}
function renderShell(content){const n=nav();return `<div class="app"><aside class="sidebar"><div class="brand"><div class="brand-mark">AS</div><div><b>AstralSurge</b><span>private operating system</span></div></div><nav class="nav">${navItems().map(([id,label,ic])=>`<button class="${n===id?'active':''}" onclick="setNav('${id}')"><span class="icon">${ic}</span>${label}</button>`).join('')}</nav><div class="sidebar-bottom"><div class="status"><div class="status-top"><span><i class="dot"></i>Local</span><span>${state.mode==='demo'?'Demo':'Private'}</span></div><div style="font-size:12px;margin-top:8px">${facts().openCount} open · ${state.xp} XP</div><button class="btn mini" style="width:100%;margin-top:10px" onclick="setNav('vault')">Vault health</button></div></div></aside><main class="main"><header class="topbar"><div class="topbar-left"><div class="crumb">AstralSurge / ${esc(n.charAt(0).toUpperCase()+n.slice(1))}</div><button class="btn icon-btn" onclick="globalSearch()" aria-label="Search">⌕</button></div><div class="top-actions"><div class="search"><input aria-label="Search workspace" placeholder="Search workspace" onclick="globalSearch()"><span>⌘K</span></div><button class="btn primary" onclick="globalCreate()"><span>＋ Create</span></button><button class="btn icon-btn" onclick="setNav('settings')">⚙</button></div></header>${content}<nav class="mobile-nav">${navItems().map(([id,label,ic])=>`<button class="${n===id?'active':''}" onclick="setNav('${id}')"><span class="icon">${ic}</span><span>${label}</span></button>`).join('')}</nav></main></div>`}
function moreIndex(){return `<div class="page"><div class="eyebrow">More</div><div class="h1">The rest, when you need it.</div><div class="lead">Secondary contexts keep the primary experience calm without removing any capability.</div><section class="section grid grid-3">${[['goals','Goals','Roadmaps & milestones'],['life','Life','Fitness, habits, reminders'],['money','Money','Budgets, decisions, reality'],['memory','Memory','Notes, history, recovery'],['progress','Progress','XP, streaks, weekly review'],['rules','Agent activity','Suggestions & rule inspector'],['vault','Vault','Backup, checkpoints, restore'],['calendar','Calendar','Month view & aggregation'],['reminders','Reminders','Alarms & notifications'],['timer','Time tools','Countdown & stopwatch'],['settings','Settings','Preferences & data controls'],['legal','Legal','Source-of-truth legal copy']].map(x=>`<button class="btn" style="text-align:left;min-height:106px" onclick="setNav('${x[0]}')"><b style="font-size:14px">${x[1]}</b><span class="muted-line" style="display:block;margin-top:7px">${x[2]}</span></button>`).join('')}</section><div class="footer-note">THE USER BRINGS INTENT · THE SYSTEM UNDERSTANDS CONTEXT · THE USER REMAINS IN CONTROL.</div></div>`}
function render(){const n=nav();let c='';if(n==='today')c=viewToday();else if(n==='work')c=viewWork();else if(n==='focus')c=viewFocus();else if(n==='plan')c=viewPlan();else if(n==='more')c=moreIndex();else if(n==='goals')c=viewGoals();else if(n==='life')c=viewLife();else if(n==='money')c=viewMoney();else if(n==='memory')c=viewMemory();else if(n==='progress')c=viewProgress();else if(n==='rules')c=viewRules();else if(n==='vault')c=viewVault();else if(n==='calendar')c=viewCalendar();else if(n==='reminders')c=viewReminders();else if(n==='timer')c=viewTimer();else if(n==='settings')c=viewSettings();else if(n==='legal')c=viewLegal();else c=viewToday();document.getElementById('app').innerHTML=renderShell(c);if(timerHandle)clearInterval(timerHandle);if(state.focus.active)timerHandle=setInterval(tick,1000)}
window.addEventListener('hashchange',render);window.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();globalSearch()}if(e.key==='Escape'){closeModal();closeDrawer()}});

// Inline HTML handlers run in the global scope. The app itself is intentionally
// enclosed in an IIFE, so expose only the interaction API they need.
Object.defineProperty(window,'state',{configurable:true,get:()=>state});
Object.assign(window,{demoState,load,persist,resetDemo,toast,nav,setNav,formatDay,dateShort,taskById,facts,daysSince,
  recommendation,actionForRec,completeTask,startFocus,scheduleTask,stopFocus,resumeFocus,pauseFocus,tick,renderFocusTimerOnly,
  openModal,closeModal,openDrawer,closeDrawer,taskModal,saveTask,noteModal,saveNote,expenseModal,saveExpense,decisionModal,reconcile,
  createGoalModal,saveGoal,globalCreate,inspect,viewToday,viewWork,viewFocus,viewPlan,viewGoals,executeStep,viewLife,toggleHabit,
  logWorkout,viewMoney,viewMemory,convertNote,vaultDrawer,viewVault,toggleLock,backupWorkspace,createCheckpoint,compareCheckpoint,
  fileRestore,shiftCalendar,resetCalendar,viewProgress,viewRules,viewSettings,downloadState,viewLegal,viewCalendar,viewReminders,viewTimer,startStandaloneTimer,
  stopStandalone,resetStandaloneTimer,search,globalSearch,drawSearchResults,searchOpen,navItems,renderShell,moreIndex,render});

render();
})();
</script>
