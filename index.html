function load(){try{const s=localStorage.getItem(KEY);if(s)return migrate(JSON.parse(s))}catch(e){} return demoState()}

let state=load();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));toast('Saved')}catch(e){toast('Could not save')}
}
function resetDemo(){if(!confirm('Reset all data to the demo workspace? This replaces your current data.'))return;state=demoState();persist();render()}

function monthEndISO(){const d=new Date();return isoDate(new Date(d.getFullYear(),d.getMonth()+1,0))}

function moneyAnalysis(){const income=120000,all=state.budgets.flatMap(b=>(b.items||[]).map(i=>({...i,cat:b.name}))),rec=all.filter(i=>i.repeat&&i.repeat!=='none'),mEq=rec.reduce((a,i)=>a+i.amount/PER[i.repeat],0),spent=state.budgets.reduce((a,b)=>a+b.spent,0),com=state.budgets.reduce((a,b)=>a+committed(b),0),free=income-spent-com,n=new Date(),dim=new Date(n.getFullYear(),n.getMonth()+1,0).getDate(),dom=n.getDate(),up=all.filter(i=>!i.done&&i.next&&i.next<=addDays(30)).sort((a,b)=>a.next.localeCompare(b.next)),tot=spent||1;const m=(l,v,t)=>`<div class="panel metric"><div class="label">${l}</div><div class="value">${v}</div><div class="trend">${t}</div></div>`;return `<section class="section"><div class="eyebrow" style="margin-bottom:10px">Analysis</div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">${m('Free to spend',money(free),Math.round(free/income*100)+'% of income after commitments')}${m('Recurring / month',money(Math.round(mEq)),money(Math.round(mEq*12))+' per year')}${m('Committed this month',money(com),'unpaid items due by month end')}${m('Recurring items',rec.length,'monthly · quarterly · yearly')}</div></section><section class="section grid grid-2"><div class="panel"><div class="panel-header"><h2>Spend share & pace</h2><small>where it goes</small></div>${state.budgets.map(b=>{const proj=b.spent/Math.max(1,dom)*dim,over=proj+committed(b)>b.limit;return `<div class="row"><div class="row-main"><div class="row-title">${esc(b.name)} · ${Math.round(b.spent/tot*100)}% of spend</div><div class="bar" style="margin-top:7px"><i style="width:${b.spent/tot*100}%"></i></div></div><span class="chip ${over?'warn':'good'}">${over?'over pace':'on pace'}</span></div>`}).join('')}</div><div class="panel"><div class="panel-header"><h2>Upcoming bills</h2><small>next 30 days</small></div>${up.length?up.map(i=>`<div class="row"><div class="row-main"><div class="row-title">${esc(i.title)}</div><div class="row-meta">${dateShort(i.next)} · ${esc(i.cat)} · ${i.repeat||'one-time'}</div></div><b class="pill-value">${money(i.amount)}</b></div>`).join(''):'<div class="empty"><strong>Nothing due.</strong>No bills in the next 30 days.</div>'}</div></section>`}

function facts(){
 const open=state.tasks.filter(t=>t.status!=='Completed');
 const overdue=open.filter(t=>t.due && t.due<today).length;
 const dueSoon=open.filter(t=>t.due && t.due<=today).length;
 const importantUnscheduled=open.filter(t=>t.important&&!t.scheduled).length;
 const openWindow=45;
 const focusCompatible=open.find(t=>t.important && (t.energy==='Deep'||t.energy==='Focused')) || open[0];
 const budgetPressure=state.budgets.filter(b=>budgetUse(b)>=.85);

 const habitOpen=state.habits.filter(h=>!h.done).length;
 return {openCount:open.length,overdue,dueSoon,importantUnscheduled,openWindow,focusCompatible,budgetPressure,awaiting,habitOpen,focusActive:state.focus.active,backupOverdue:daysSince(state.vault.lastBackup)>=5};
}

 return null;

function noteModal(n={id:'',title:'',content:'',tags:[]}){return `<div class="modal-inner"><div class="split"><div><div class="eyebrow">Note</div><h2 id="modal-title" style="margin:4px 0 4px">Capture context</h2></div><button class="btn icon-btn" onclick="closeModal()">×</button></div><form class="form" onsubmit="saveNote(event,'${esc(n.id)}')" style="margin-top:18px"><div class="field"><label>Title</label><input name="title" required value="${esc(n.title)}"></div><div class="field"><label>Content</label><textarea name="content" required>${esc(n.content)}</textarea></div><div class="field"><label>Tags</label><input name="tags" value="${esc((n.tags||[]).join(', '))}"></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save note</button></div></form></div>`}
function saveNote(e,id){e.preventDefault();const f=new FormData(e.target);let n=id?state.notes.find(x=>x.id===id):{id:uid('note')};Object.assign(n,{title:f.get('title'),content:f.get('content'),tags:String(f.get('tags')).split(',').map(x=>x.trim()).filter(Boolean),created:n.created||today});if(!id)state.notes.unshift(n);state.events.push({type:id?'NOTE_UPDATED':'NOTE_CREATED',entityId:n.id,at:Date.now()});persist();closeModal();render()}
function expenseModal(){return `<div class="modal-inner"><div class="split"><div><div class="eyebrow">Quick capture</div><h2 id="modal-title" style="margin:4px 0">Expense</h2></div><button class="btn icon-btn" onclick="closeModal()">×</button></div><form class="form" onsubmit="saveExpense(event)" style="margin-top:18px"><div class="grid grid-2"><div class="field"><label>Amount</label><input name="amount" type="number" min="0.01" step="0.01" required placeholder="1240"></div><div class="field"><label>Category</label><select name="category">${[...new Set([...state.budgets.map(b=>b.name),'Food','Other'])].map(x=>`<option>${esc(x)}</option>`).join('')}</select></div></div><div class="field"><label>Description</label><input name="title" required placeholder="What was this expense?"></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save expense</button></div></form></div>`}
function saveExpense(e){e.preventDefault();const f=new FormData(e.target);state.transactions.unshift({id:uid('tx'),title:f.get('title'),amount:Number(f.get('amount')),category:f.get('category'),date:today});{const b=state.budgets.find(x=>x.name===f.get('category'));if(b)b.spent+=Number(f.get('amount'))}state.events.push({type:'TRANSACTION_CREATED',at:Date.now()});persist();closeModal();render()}
function decisionModal(d){return `<div class="modal-inner"><div class="split"><div><div class="eyebrow">Financial decision</div><h2 id="modal-title" style="margin:4px 0">${esc(d.title)}</h2></div><button class="btn icon-btn" onclick="closeModal()">×</button></div><div class="grid grid-3" style="margin-top:18px"><div class="metric surface"><div class="label">Projected</div><div class="value">${money(d.projected)}</div></div><div class="metric surface"><div class="label">Actual</div><div class="value">${money(d.actual)}</div></div><div class="metric surface"><div class="label">Variance</div><div class="value">${money(Math.abs(d.projected-d.actual))}</div><div class="trend">${d.actual<=d.projected?'under':'over'} projected</div></div></div><div class="success-note" style="margin-top:16px">This is a reconciliation action only. It does not give financial advice or change the transaction.</div><div class="form-actions" style="margin-top:16px"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="reconcile('${d.id}')">Reconcile</button></div></div>`}
function reconcile(id){const d=state.decisions.find(x=>x.id===id);if(!d)return;d.status='Reconciled';state.events.push({type:'DECISION_RECONCILED',entityId:id,at:Date.now()});persist();closeModal();render();toast('Reconciled')}
function createGoalModal(){return `<div class="modal-inner"><div class="split"><div><div class="eyebrow">Goal / pathway</div><h2 id="modal-title" style="margin:4px 0">Create a goal</h2></div><button class="btn icon-btn" onclick="closeModal()">×</button></div><form class="form" onsubmit="saveGoal(event)" style="margin-top:18px"><div class="field"><label>Outcome</label><input name="title" required placeholder="What are you trying to achieve?"></div><div class="field"><label>First milestone</label><input name="step" required placeholder="The next concrete step"></div><div class="field"><label>Activity type</label><select name="type"><option>task</option><option>note</option><option>workout</option><option>time</option><option>story</option><option>finance</option></select></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Create goal</button></div></form></div>`}
function saveGoal(e){e.preventDefault();const f=new FormData(e.target);const g={id:uid('goal'),title:f.get('title'),progress:0,steps:[{id:uid('step'),title:f.get('step'),type:f.get('type'),done:false}]};state.goals.unshift(g);state.events.push({type:'GOAL_CREATED',entityId:g.id,at:Date.now()});persist();closeModal();render();setNav('goals')}
function globalCreate(){openModal(()=>`<div class="modal-inner"><div class="split"><div><div class="eyebrow">Create</div><h2 id="modal-title" style="margin:4px 0">Capture intent</h2></div><button class="btn icon-btn" onclick="closeModal()">×</button></div><div class="grid grid-2" style="margin-top:18px"><button class="btn" type="button" onclick="openModal(taskModal)"><b>+ Task</b><span class="muted-line">Something to do</span></button><button class="btn" type="button" onclick="openModal(noteModal)"><b>+ Note</b><span class="muted-line">Something to remember</span></button><button class="btn" type="button" onclick="openModal(expenseModal)"><b>+ Expense</b><span class="muted-line">Quick financial reality</span></button><button class="btn" type="button" onclick="openModal(createGoalModal)"><b>More</b><span class="muted-line">Project, goal, workout, budget</span></button></div></div>`)}
function inspect(entityType,id){
 let html='';
 if(entityType==='task'){const t=taskById(id);if(!t)return;html=`<div class="eyebrow">Task</div><h2>${esc(t.title)}</h2><div class="chips"><span class="chip">${esc(t.priority)}</span><span class="chip">${esc(t.energy)}</span>${t.important?'<span class="chip accent">Important</span>':''}</div><p class="muted-line" style="margin-top:14px">${esc(t.desc||'No description')}</p>${subsHtml(t)}<div class="actions"><button class="btn primary" onclick="startFocus('${t.id}')">Focus</button>${!t.scheduled&&t.status!=='Completed'?`<button class="btn" onclick="scheduleTask('${t.id}')">Schedule 45m</button>`:''}${t.status!=='Completed'?`<button class="btn" onclick="completeTask('${t.id}')">Complete</button>`:''}<button class="btn" onclick="closeDrawer();openModal(taskModal,taskById('${t.id}'))">Edit</button><button class="btn" onclick="deleteTask('${t.id}')">Delete</button></div><div class="section"><div class="eyebrow">Relationships</div><div class="grid" style="margin-top:10px"><div class="surface" style="padding:13px">Focus · ${t.timeSpent.toFixed(0)}m logged</div><div class="surface" style="padding:13px">Planner · ${t.scheduled?'Scheduled':'Unscheduled'}</div><div class="surface" style="padding:13px">Goal · Portfolio launch</div></div></div>`}
 if(entityType==='rule'){const r=RULES.find(x=>x.id===id);if(!r)return;html=`<div class="eyebrow">Rule inspector</div><h2>${esc(r.name)}</h2><div class="section"><div class="eyebrow">Observed</div><div class="chips" style="margin-top:9px">${r.evidence.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div><div class="section"><div class="eyebrow">Result</div><div class="surface" style="padding:14px;margin-top:9px">${esc(r.result)}</div></div>`}
 if(entityType==='vault'){html=vaultDrawer()}
 openDrawer(html||'<div class="empty"><strong>Nothing to inspect</strong></div>')
}
const RULES=[
 {id:'task_unscheduled_due_soon',name:'Important task is unscheduled',evidence:['High priority','Due today','No planner block','45m open'],result:'Suggested a 45-minute focus block.'},
 {id:'deep_task_open_window',name:'Deep task has a good window',evidence:['Energy = Deep','Open window ≥ 45m','No conflict'],result:'Make the compatible work session easy to start.'},
 {id:'stalled_task',name:'Task resurfacing without progress',evidence:['Repeated unfinished state','No recent progress'],result:'Offer Continue / Break down / Schedule / Dismiss.'},
 {id:'budget_pressure',name:'Budget pressure',evidence:['Actual ≥ 85% of configured limit'],result:'Show a review signal without telling the user what to spend.'},
 {id:'decision_awaiting_actual',name:'Decision ready to reconcile',evidence:['Provisional decision','Actual outcome available'],result:'Open a reconciliation preview.'},
 {id:'backup_overdue',name:'Backup is overdue',evidence:['Last backup beyond threshold'],result:'Surface a recovery action.'}
];
function viewToday(){const f=facts(),rec=recommendation();const main=rec?rec.title:(f.focusActive?'Continue your focus':(f.openCount?'You have work worth moving':'Today is calm'));const mainTask=rec?taskById(rec.entityId):f.focusCompatible;return `<div class="page"><div class="split"><div><div class="eyebrow">${formatDay(today)}</div><div class="h1">${greeting()} 👋</div><div class="lead">A quiet command center for what matters, what needs doing, and what deserves attention now.</div></div><div class="chips"><span class="chip ${state.mode==='demo'?'accent':'good'}">${state.mode==='demo'?'Demo workspace':'Private workspace'}</span><span class="chip">Local only</span></div></div><section class="section"><div class="panel focus-panel"><div class="focus-row"><div><div class="eyebrow">${rec?'Next best action':'Current context'}</div><div class="focus-title">${esc(main)}</div><div class="lead">${rec?esc(rec.reason):(f.focusActive?'Your active session stays front and center until it ends.':`There are ${f.openCount} open tasks, ${f.importantUnscheduled} important task(s) without a block, and ${f.openWindow} minutes of open time.`)}</div>${rec?`<div class="reason"><b>Why:</b> ${rec.evidence.map(esc).join(' · ')} <button class="btn ghost mini" onclick="inspect('rule','${rec.ruleId}')">Why am I seeing this?</button></div>`:''}<div class="actions">${rec?`<button class="btn primary" onclick="actionForRec(recommendation())">${esc(rec.actionLabel)}</button>${rec.entityType==='task'?`<button class="btn" onclick="inspect('task','${rec.entityId}')">Open task</button>`:''}<button class="btn" onclick="state.dismissed['${rec.action==='review_budget'?'budget_pressure':rec.action==='reconcile'?'decision_reconcile':rec.ruleId}']=Date.now();persist();render()">Dismiss</button>`:mainTask?`<button class="btn primary" onclick="${f.focusActive?"setNav('focus')":`startFocus('${mainTask.id}')`}">${f.focusActive?'Open Focus':'Start Focus'}</button><button class="btn" onclick="inspect('task','${mainTask.id}')">Inspect</button>`:'<button class="btn primary" onclick="globalCreate()">Capture something</button>'}</div></div><div style="min-width:210px"><div class="eyebrow">Workspace signal</div><div class="metric surface" style="margin-top:8px"><div class="label">Open time</div><div class="value">${openSlot(45)?'45m':'None'}</div><div class="trend">${openSlot(45)?'first window '+openSlot(45):'no open 45m window'}</div></div></div></div></div></section>${dailyProgress()}<section class="section grid grid-2"><div class="panel"><div class="panel-header"><h2>Today</h2><small>commitments</small></div><div class="timeline">${state.planner.slice().sort((a,b)=>a.time.localeCompare(b.time)).map(p=>`<div class="time-row"><div class="time">${esc(p.time)}</div><div class="event"><div class="event-title">${esc(p.title)}</div><div class="event-meta">${p.duration}m · ${esc(p.type)} ${p.taskId?'· task linked':''}</div></div></div>`).join('')}</div></div><div class="panel"><div class="panel-header"><h2>Quick capture</h2><small>organize later</small></div><div class="grid" style="padding:16px"><button class="btn" onclick="openModal(taskModal)">+ Task <span class="quiet">capture work</span></button><button class="btn" onclick="openModal(noteModal)">+ Note <span class="quiet">capture context</span></button><button class="btn" onclick="openModal(expenseModal)">+ Expense <span class="quiet">record reality</span></button><button class="btn" onclick="setNav('focus')">Timer <span class="quiet">enter focus</span></button></div></div></section><section class="section grid grid-3"><div class="panel metric"><div class="label">Needs attention</div><div class="value">${f.overdue}</div><div class="trend">overdue open tasks</div></div><div class="panel metric"><div class="label">Goal momentum</div><div class="value">${state.goals[0]?.progress||0}%</div><div class="trend">${esc(state.goals[0]?.title||'No active goal')}</div></div><div class="panel metric"><div class="label">Vault health</div><div class="value">${f.backupOverdue?'Review':'Good'}</div><div class="trend">last backup ${dateShort(state.vault.lastBackup)}</div></div></section></div>`}
function viewWork(){const tabs=['Inbox','To Do','In Progress','Completed'];const current=window.workTab||'To Do';const list=state.tasks.filter(t=>t.status===current);return `<div class="page"><div class="split"><div><div class="eyebrow">Work</div><div class="h1">What needs doing?</div><div class="lead">A direct execution surface. Tasks remain connected to focus, time, goals, notes, and history.</div></div><button class="btn primary" onclick="openModal(taskModal)">+ Task</button></div><section class="section"><div class="tabs">${tabs.map(t=>`<button class="tab ${current===t?'active':''}" onclick="window.workTab='${t}';render()">${t}</button>`).join('')}</div></section><section class="section panel"><div class="panel-header"><h2>${current}</h2><small>${list.length} items</small></div><div class="list">${list.length?list.map(t=>`<div class="row" style="border-left:3px solid ${t.urgent?'var(--red)':t.priority==='High'?'var(--amber)':t.priority==='Medium'?'var(--blue)':'var(--line)'}"><div class="row-main"><div class="row-title"><a class="entity-link ${t.status==='Completed'?'done-text':''}" href="#/work" onclick="inspect('task','${t.id}');return false">${esc(t.title)}</a></div><div class="row-meta">${t.due?`Due ${dateShort(t.due)} · `:''}${t.energy} · ${t.timeSpent.toFixed(0)}m logged ${t.scheduled?'· scheduled':''} ${(t.subtasks||[]).length?`· ${t.subtasks.filter(x=>x.done).length}/${t.subtasks.length} subtasks`:''}</div><div class="chips" style="margin-top:7px"><span class="chip">${esc(t.priority)}</span>${t.important?'<span class="chip accent">Important</span>':''}${t.urgent?'<span class="chip danger">Urgent</span>':''}</div></div><div class="row-actions"><button class="btn mini" onclick="inspect('task','${t.id}')">Inspect</button>${t.status!=='Completed'?`<button class="btn mini accent" onclick="startFocus('${t.id}')">Focus</button><button class="btn mini" onclick="completeTask('${t.id}')">Complete</button>`:''}</div></div>`).join(''):`<div class="empty"><strong>No tasks here yet.</strong>Capture something you need to do.<div style="margin-top:12px"><button class="btn primary" onclick="openModal(taskModal)">Add task</button></div></div>`}</div></section><section class="section grid grid-2"><div class="panel"><div class="panel-header"><h2>Execution rules</h2><small>deterministic</small></div><div class="rule-card"><div class="rule-id">deep_task_open_window</div><div class="rule-name">Good window for deep work</div><div class="rule-why">When a compatible task and open time coexist, the system surfaces the opportunity without changing the schedule.</div></div><div class="rule-card"><div class="rule-id">stalled_task</div><div class="rule-name">This keeps coming back</div><div class="rule-why">The engine can offer a different action without inventing psychological explanations.</div></div></div><div class="panel"><div class="panel-header"><h2>Relationships</h2><small>one object, many contexts</small></div><div style="padding:18px"><div class="chips"><span class="chip accent">Task</span><span class="chip">→ Focus</span><span class="chip">→ Time log</span><span class="chip">→ Planner</span><span class="chip">→ Goal</span><span class="chip">→ Activity</span></div><p class="muted-line" style="margin-top:12px">The navigation is one way to access the object. Contextual links are equally important.</p></div></div></section></div>`}
function viewFocus(){let t=taskById(state.focus.taskId);if(!t||t.status==='Completed')t=state.tasks.find(x=>x.status!=='Completed');return `<div class="page"><div class="eyebrow">Focus</div><div class="h1">What am I doing now?</div><div class="lead">A dedicated concentration surface. No dashboard analytics while the timer is active.</div><section class="section"><div class="panel focus-panel" style="min-height:420px;display:grid;align-content:center;justify-items:center;text-align:center"><div class="eyebrow">${state.focus.active?'Current task':state.focus.paused?'Paused':'Ready'}</div><h2 style="font-size:28px;margin:10px 0">${esc(t?.title||'Choose a task to focus on')}</h2><div id="focus-timer" style="font-size:74px;letter-spacing:-.06em;font-variant-numeric:tabular-nums;margin:6px 0 12px">${fmtClock(state.focus.seconds)}</div><div class="bar" style="width:min(320px,80%);margin:0 auto 18px"><i id="focus-bar" style="width:${state.focus.initial?(state.focus.initial-state.focus.seconds)/state.focus.initial*100:0}%"></i></div><div class="chips"><span class="chip accent">${esc(state.focus.category)}</span>${t?`<span class="chip">${esc(t.energy)}</span>`:''}</div>${!state.focus.active&&!state.focus.paused?`<div class="chips" style="margin-bottom:12px;justify-content:center">${[15,25,45,60].map(m=>`<button class="chip ${(state.focus.len||25)===m?'accent':''}" onclick="setFocusLen(${m})" style="cursor:pointer">${m}m</button>`).join('')}</div>`:''}<div class="actions" style="justify-content:center">${state.focus.active?`<button class="btn primary" onclick="stopFocus()">End & save</button><button class="btn" onclick="pauseFocus()">Pause</button>`:`<button class="btn primary" onclick="${t?(state.focus.paused?'resumeFocus()':`startFocus('${t.id}')`):'globalCreate()'}">${t?(state.focus.paused?'Resume Focus':'Start Focus'):'Choose task'}</button>${state.focus.paused?`<button class="btn" onclick="stopFocus()">End & save</button>`:''}<button class="btn" onclick="setNav('work')">Browse work</button>`}</div><div class="reason" style="max-width:540px"><b>State-aware:</b> when focus is active, unrelated recommendations are suppressed and the active task remains accessible from Today, Work, Plan, and the task inspector.</div></div></section><section class="section grid grid-3"><div class="panel metric"><div class="label">Today's focus</div><div class="value">${loggedMin()}m</div><div class="trend">logged time</div></div><div class="panel metric"><div class="label">Category</div><div class="value" style="font-size:18px">Deep Work</div><div class="trend">local preference</div></div><div class="panel metric"><div class="label">XP</div><div class="value">${state.xp}</div><div class="trend">real actions first</div></div></section></div>`}
function viewPlan(){const hours=state.planner.reduce((a,b)=>a+b.duration,0);const open=60;return `<div class="page"><div class="split"><div><div class="eyebrow">Plan</div><div class="h1">How should I use my time?</div><div class="lead">Planning, calendar, reminders, and time tools stay distinct. This surface is for the shape of the day.</div></div><div class="tabs"><button class="tab active">Plan</button><button class="tab" onclick="setNav('calendar')">Calendar</button><button class="tab" onclick="setNav('reminders')">Remind</button><button class="tab" onclick="setNav('timer')">Time tools</button></div></div><section class="section grid grid-2"><div class="panel"><div class="panel-header"><h2>Today’s shape</h2><small>fixed commitments first</small></div><div class="list">${state.planner.slice().sort((a,b)=>a.time.localeCompare(b.time)).map(p=>`<div class="row"><div class="row-main"><div class="row-title">${esc(p.title)}</div><div class="row-meta">${esc(p.time)} · ${p.duration}m · ${esc(p.type)}</div></div><div class="row-actions">${p.fixed?'':`<button class="btn mini" onclick="removeBlock('${p.id}')">Remove</button>`}<span class="status-badge ${p.fixed?'open':'focus'}">${p.fixed?'fixed':'planned'}</span></div></div>`).join('')}<div class="row"><div class="row-main"><div class="row-title">Open window</div><div class="row-meta">${openSlot(45)?openSlot(45)+' · compatible work possible':'No open 45m window left today'}</div></div><span class="chip ${openSlot(45)?'good':'warn'}">${openSlot(45)?'45m open':'full'}</span></div></div></div><div class="panel pad"><div class="eyebrow">Capacity</div><h2 style="font-size:27px;margin:7px 0">${hours>480?'Over capacity':'Within capacity'}</h2><p class="muted-line">Fixed commitments, travel, breaks, and planned work are evaluated together. Nothing is silently moved.</p><div class="progress" style="margin-top:18px"><div class="progress-line"><span>Planned</span><b>${hours}m</b></div><div class="bar"><i style="width:${Math.min(100,Math.round(hours/480*100))}%"></i></div></div><div class="actions"><button class="btn" onclick="openModal(taskModal)">Add focused block</button><button class="btn" onclick="toast('No commitments were moved')">Rebalance</button></div></div></section><section class="section panel"><div class="panel-header"><h2>Upcoming</h2><small>next 7 days</small></div><table class="table"><thead><tr><th>Time</th><th>Commitment</th><th>Type</th><th>Link</th></tr></thead><tbody>${[3,4,6].map(n=>dateShort(addDays(n))).map((d,i)=>`<tr><td>${d}</td><td>${['Demo rehearsal','Workout','Client follow-up'][i]}</td><td>${['work','life','meeting'][i]}</td><td><span class="chip">Open</span></td></tr>`).join('')}</tbody></table></section></div>`}
function viewGoals(){return `<div class="page"><div class="split"><div><div class="eyebrow">Goals</div><div class="h1">What am I trying to achieve?</div><div class="lead">A roadmap is an ordered path, not a checklist dump. Each milestone routes into the real entity that executes it.</div></div><button class="btn primary" onclick="openModal(createGoalModal)">+ Goal</button></div><section class="section grid grid-2">${state.goals.map(g=>`<div class="panel"><div class="panel-header"><div><h2>${esc(g.title)}</h2><small>${g.steps.length} milestones</small></div><span class="chip accent">${g.progress}%</span></div><div style="padding:18px"><div class="bar"><i style="width:${g.progress}%"></i></div><div class="list" style="margin-top:10px">${g.steps.map((s,i)=>`<div class="row"><div class="row-main"><div class="row-title">${s.done?'✓ ':''}${esc(s.title)}</div><div class="row-meta">Step ${i+1} · activity type: ${s.type}</div></div>${s.done?'<span class="status-badge done">done</span>':`<div class="row-actions"><button class="btn mini primary" onclick="executeStep('${g.id}','${s.id}')">Prepare ${esc(s.type)}</button><button class="btn mini" onclick="doneStep('${g.id}','${s.id}')">Mark done</button></div>`}</div>`).join('')}</div></div></div>`).join('')}</section><section class="section panel pad"><div class="eyebrow">Connected entities</div><div class="chips" style="margin-top:10px"><span class="chip accent">Goal</span><span class="chip">→ Pathway step</span><span class="chip">→ Task</span><span class="chip">→ Story</span><span class="chip">→ Note</span><span class="chip">→ Finance</span><span class="chip">→ Workout</span></div></section></div>`}
function executeStep(gid,sid){const g=state.goals.find(x=>x.id===gid),s=g?.steps.find(x=>x.id===sid);if(!s)return;if(s.type==='task'){openModal(taskModal,{title:s.title,priority:'High',energy:'Focused',due:today,important:true,status:'To Do',desc:`Goal: ${g.title}`})}else if(s.type==='note')openModal(noteModal,{title:s.title,content:`Goal context: ${g.title}`,tags:['goal']});else if(s.type==='finance')openModal(expenseModal);else if(s.type==='workout')setNav('life');else if(s.type==='time')setNav('timer');else setNav('work')}
function viewLife(){return `<div class="page"><div class="eyebrow">Life</div><div class="h1">How am I taking care of myself?</div><div class="lead">Fitness, habits, and reminders live here without competing visually with execution.</div><section class="section grid grid-2"><div class="panel"><div class="panel-header"><h2>Habits</h2><small>today</small></div><div class="list">${state.habits.map(h=>`<div class="row"><div><div class="row-title">${esc(h.title)}</div><div class="row-meta">${h.streak} day streak context</div></div><button class="btn mini ${h.done?'':'primary'}" onclick="toggleHabit('${h.id}')">${h.done?'Done':'Mark done'}</button></div>`).join('')}</div></div><div class="panel"><div class="panel-header"><h2>Fitness</h2><button class="btn mini" onclick="logWorkout()">+ Log</button></div><div class="list">${state.workouts.map(w=>`<div class="row"><div><div class="row-title">${esc(w.title)}</div><div class="row-meta">${esc(w.type)} · ${w.duration}m · RPE ${w.rpe} · ${dateShort(w.date)}</div></div></div>`).join('')}</div></div></section><section class="section panel"><div class="panel-header"><h2>Reminders</h2><small>time-based</small></div><div class="row"><div><div class="row-title">Hydrate</div><div class="row-meta">Tomorrow · 11:30 · local alarm</div></div><span class="status-badge open">scheduled</span></div><div class="row"><div><div class="row-title">Call family</div><div class="row-meta">Friday · 19:00 · notification permission respected</div></div><span class="status-badge open">scheduled</span></div></section></div>`}
function toggleHabit(id){const h=state.habits.find(x=>x.id===id);if(h){h.done=!h.done;if(h.done){h.streak+=1;state.xp+=5;celebrate();state.events.push({type:'HABIT_COMPLETED',entityId:id,at:Date.now()})}else{h.streak=Math.max(0,h.streak-1);state.xp=Math.max(0,state.xp-5)}persist();render()}}
function logWorkout(){state.workouts.unshift({id:uid('w'),title:"Today's session",type:'Training',duration:30,rpe:6,date:today});state.xp+=15;state.events.push({type:'WORKOUT_LOGGED',at:Date.now()});persist();render();toast('Workout logged')}
function viewMoney(){const income=120000,spent=state.transactions.reduce((a,t)=>a+t.amount,0);return `<div class="page"><div class="eyebrow">Money</div><div class="h1">Where do I stand?</div><div class="lead">Calm, data-forward financial awareness. Budget is intention, decision is anticipated choice, transaction is reality.</div><section class="section grid grid-3"><div class="panel metric"><div class="label">Income</div><div class="value">${state.settings.hideAmounts?'••••':money(income)}</div><div class="trend">configured baseline</div></div><div class="panel metric"><div class="label">Spent</div><div class="value">${state.settings.hideAmounts?'••••':money(spent)}</div><div class="trend">recorded transactions</div></div><div class="panel metric"><div class="label">Room / pressure</div><div class="value">${facts().budgetPressure.length} signals</div><div class="trend">review configured limits</div></div></section>${moneyAnalysis()}<section class="section grid grid-2"><div class="panel"><div class="panel-header"><h2>Budgets</h2><button class="btn mini" onclick="addBudget()">+ Category</button></div>${budgetRows()}</div><div class="panel"><div class="panel-header"><h2>Decisions</h2><small>anticipated → actual</small></div>${state.decisions.map(d=>`<div class="row"><div class="row-main"><div class="row-title">${esc(d.title)}</div><div class="row-meta">Projected ${money(d.projected)} · Actual ${money(d.actual)}</div></div><button class="btn mini ${d.status==='Reconciled'?'':'primary'}" onclick="${d.status==='Reconciled'?'toast(\'Already reconciled\')':`openModal(decisionModal,state.decisions.find(x=>x.id==='${d.id}'))`}">${d.status==='Reconciled'?'Reconciled':'Reconcile'}</button></div>`).join('')}</div></section><section class="section panel"><div class="panel-header"><h2>Transactions</h2><button class="btn mini" onclick="openModal(expenseModal)">+ Expense</button></div><table class="table"><thead><tr><th>Date</th><th>What</th><th>Category</th><th>Amount</th></tr></thead><tbody>${state.transactions.map(t=>`<tr><td>${dateShort(t.date)}</td><td>${esc(t.title)}</td><td>${esc(t.category)}</td><td class="pill-value">${state.settings.hideAmounts?'••••':money(t.amount)}</td></tr>`).join('')}</tbody></table></section></div>`}
function viewMemory(){return `<div class="page"><div class="eyebrow">Memory</div><div class="h1">What do I want to remember?</div><div class="lead">Notes, history, and recovery are connected without creating a hidden second “AI memory.”</div><section class="section grid grid-2"><div class="panel"><div class="panel-header"><h2>Notes</h2><button class="btn mini" onclick="openModal(noteModal)">+ Note</button></div><div class="list">${state.notes.map(n=>`<div class="row"><div class="row-main"><div class="row-title">${esc(n.title)}</div><div class="row-meta">${dateShort(n.created)} · ${(n.tags||[]).join(' · ')}</div><div class="muted-line" style="margin-top:7px">${esc(n.content)}</div></div><div class="row-actions"><button class="btn mini" onclick="openModal(noteModal,state.notes.find(x=>x.id==='${n.id}'))">Edit</button><button class="btn mini" onclick="deleteNote('${n.id}')">Delete</button><button class="btn mini" onclick="convertNote('${n.id}')">→ Task</button></div></div>`).join('')}</div></div><div class="panel"><div class="panel-header"><h2>History</h2><small>what happened</small></div><div class="list">${state.activities.concat(state.events.slice(-6).reverse().map(e=>({time:new Date(e.at||Date.now()).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}),title:e.type,meta:e.entityId||'Workspace'}))).slice(0,8).map(a=>`<div class="row"><div><div class="row-title">${esc(a.title)}</div><div class="row-meta">${esc(a.time)} · ${esc(a.meta)}</div></div></div>`).join('')}</div></div></section><section class="section panel"><div class="panel-header"><h2>Recovery</h2><div class="chips"><button class="btn mini" onclick="setNav('vault')">Vault</button></div></div><div style="padding:18px"><div class="grid grid-2"><div class="surface" style="padding:16px"><div class="eyebrow">Checkpoint</div><div style="margin-top:5px;font-weight:650">Local restore point</div><div class="muted-line" style="margin-top:4px">Last checkpoint ${dateShort(state.vault.lastCheckpoint)}</div></div><div class="surface" style="padding:16px"><div class="eyebrow">Backup</div><div style="margin-top:5px;font-weight:650">Portable encrypted representation</div><div class="muted-line" style="margin-top:4px">Last backup ${dateShort(state.vault.lastBackup)}</div></div></div></div></section></div>`}
function convertNote(id){const n=state.notes.find(x=>x.id===id);if(!n)return;openModal(taskModal,{title:n.title,desc:n.content,priority:'Medium',energy:'Light',due:today,status:'Inbox',important:false,urgent:false})}
function vaultDrawer(){return `<div class="eyebrow">Your private vault</div><h2>Recovery & safety</h2><p class="muted-line">This interface keeps the vault mental model local: no conventional server account, no cloud storage, and no remote inference in this static experience.</p><div class="section"><div class="surface" style="padding:15px"><div class="split"><span>Vault state</span><span class="status-badge ${state.vault.locked?'open':'done'}">${state.vault.locked?'locked':'unlocked'}</span></div><div class="muted-line" style="margin-top:8px">Locking hides the workspace on screen. Data in browser storage is not encrypted in this beta.</div></div></div><div class="section"><div class="eyebrow">Backup</div><div class="muted-line" style="margin:7px 0 12px">Last backup ${dateShort(state.vault.lastBackup)}</div><button class="btn primary" onclick="backupWorkspace()">Create backup</button></div><div class="section"><div class="eyebrow">Checkpoint</div><div class="muted-line" style="margin:7px 0 12px">Last checkpoint ${dateShort(state.vault.lastCheckpoint)}</div><div class="actions"><button class="btn" onclick="createCheckpoint()">Create checkpoint</button><button class="btn" onclick="compareCheckpoint()">Compare</button></div></div><div class="section danger-note">Restore is designed as a validate → preview → explicit replacement flow. This demo never overwrites state without an explicit action.</div>`}
function viewVault(){return `<div class="page"><div class="split"><div><div class="eyebrow">Vault</div><div class="h1">Is my workspace safe?</div><div class="lead">Recovery should be visible, deliberate, and boring in the best possible way.</div></div><button class="btn primary" onclick="backupWorkspace()">Back up</button></div><section class="section grid grid-2"><div class="panel pad"><div class="eyebrow">Vault health</div><h2 style="margin:7px 0">${facts().backupOverdue?'Review needed':'Healthy enough to continue'}</h2><div class="grid" style="margin-top:18px"><div class="surface" style="padding:14px"><div class="split"><span>Portable backup</span><span class="status-badge ${facts().backupOverdue?'open':'done'}">${facts().backupOverdue?'overdue':'current'}</span></div><div class="muted-line" style="margin-top:5px">Last backup: ${dateShort(state.vault.lastBackup)}</div></div><div class="surface" style="padding:14px"><div class="split"><span>Local checkpoint</span><span class="status-badge ${hasCp()?'done':'open'}">${hasCp()?'available':'none yet'}</span></div><div class="muted-line" style="margin-top:5px">Last checkpoint: ${dateShort(state.vault.lastCheckpoint)}</div></div></div></div><div class="panel pad"><div class="eyebrow">Returning user</div><h2 style="margin:7px 0">${state.vault.locked?'Vault locked':'Vault unlocked'}</h2><div class="actions"><button class="btn primary" onclick="toggleLock()">${state.vault.locked?'Unlock':'Lock Vault'}</button><button class="btn" onclick="setPassphrase()">${state.vault.pass?'Change':'Set'} passphrase</button><button class="btn" onclick="resetDemo()">Create new demo vault</button></div><p class="muted-line" style="margin-top:12px">For a true production vault, the source application's existing crypto, migration, and storage engines should remain authoritative.</p></div></section><section class="section panel"><div class="panel-header"><h2>Restore</h2><small>safe replacement flow</small></div><div style="padding:18px"><div class="grid grid-2"><div class="surface" style="padding:15px"><div class="eyebrow">1 · inspect</div><div class="muted-line" style="margin-top:6px">Choose a backup file, validate its envelope, indexes, and decrypted state before touching current storage.</div></div><div class="surface" style="padding:15px"><div class="eyebrow">2 · preview</div><div class="muted-line" style="margin-top:6px">Show exactly what would replace the current vault before commit.</div></div></div><div class="actions"><button class="btn" onclick="fileRestore()">Choose backup file</button><button class="btn" onclick="restorePreview()">Inspect restore</button></div></div></section><section class="section panel"><div class="panel-header"><h2>Recovery actions</h2><small>explicit</small></div><div class="row"><div><div class="row-title">Checkpoint</div><div class="row-meta">Create a local restore point without changing current state.</div></div><button class="btn mini" onclick="createCheckpoint()">Create checkpoint</button></div><div class="row"><div><div class="row-title">Compare</div><div class="row-meta">Review the display-level diff before making any replacement.</div></div><button class="btn mini" onclick="compareCheckpoint()">Compare</button></div></section><section class="section panel"><div class="panel-header"><h2>Security principles</h2><small>implementation constraints</small></div><div class="row"><div><div class="row-title">Local-only</div><div class="row-meta">No server, no cloud storage, no telemetry.</div></div><span class="chip good">active</span></div><div class="row"><div><div class="row-title">Encrypted persistence</div><div class="row-meta">The production source should retain its Web Crypto, PBKDF2, AES-GCM, and envelope behavior.</div></div><span class="chip warn">not in beta yet</span></div><div class="row"><div><div class="row-title">Untrusted imports</div><div class="row-meta">Validate envelope structure, strings, numbers, arrays, object shapes, and image data.</div></div><span class="chip warn">guarded</span></div></section></div>`}
function toggleLock(){state.vault.locked=!state.vault.locked;closeModal();closeDrawer();persist();if(state.vault.locked){toast('Vault locked')}else{toast('Vault unlocked')}render()}
function backupWorkspace(){state.vault.lastBackup=today;state.events.push({type:'BACKUP_EXPORTED',at:Date.now()});persist();const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='astralsurge-workspace-backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),500);render();toast('Backup created')}
const CPK='astralsurge.os.checkpoint',BETA_KEY='astralsurge.beta.ack';
const hasCp=()=>{try{return !!localStorage.getItem(CPK)}catch(e){return false}};
const betaAck=()=>{try{return localStorage.getItem(BETA_KEY)==='1'}catch(e){return true}};
function acceptBeta(){try{localStorage.setItem(BETA_KEY,'1')}catch(e){}render()}
function showBeta(){try{localStorage.removeItem(BETA_KEY)}catch(e){}render()}
function applyTheme(){const t=state.settings.theme||'Dark';const light=t==='Light'||(t==='Auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches);document.documentElement.setAttribute('data-theme',light?'light':'dark');const m=document.querySelector('meta[name=theme-color]');if(m)m.content=light?'#f3f1ee':'#0d0f12'}
function betaScreen(){const rows=[['Things will change','This is an early beta. Some screens use demo data, features are unfinished, and bugs are expected.'],['Your data stays on this device','Everything is saved in this browser only. Clearing site data or switching browser erases it. No account, no cloud.'],['Back up regularly','Vault → Back up downloads a file. Backups are not encrypted, so store them somewhere safe.'],['The vault lock is a screen lock','A passphrase hides the workspace on screen. It does not encrypt your data yet.'],['Not professional advice','Money, fitness and health items are for tracking only, not financial or medical advice.']];return `<div class="page" style="max-width:640px;padding-top:6vh"><span class="chip warn">BETA · WORK IN PROGRESS</span><div class="h1" style="margin-top:14px">Welcome to AstralSurge OS</div><div class="lead">Thanks for trying it early. A few honest notes before you start.</div><div class="panel" style="margin-top:22px">${rows.map(r=>`<div class="row"><div class="row-main" style="white-space:normal"><div class="row-title" style="white-space:normal">${r[0]}</div><div class="row-meta">${r[1]}</div></div></div>`).join('')}</div><div class="actions"><button class="btn primary" onclick="acceptBeta()">I understand — let's go</button></div></div>`}
async function sha(t){if(!(window.crypto&&crypto.subtle))return 'x'+[...t].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function setPassphrase(){const p=prompt('Choose a passphrase (4+ characters). It locks the screen only; data is not encrypted.');if(!p)return;if(p.length<4){toast('Too short');return}state.vault.pass=await sha(p);persist();render();toast('Passphrase set')}
async function unlockVault(){const i=document.getElementById('unlock-input');if(state.vault.pass&&(!i||await sha(i.value)!==state.vault.pass)){toast('Wrong passphrase');return}state.vault.locked=false;persist();render();toast('Vault unlocked')}
function createCheckpoint(){try{localStorage.setItem(CPK,JSON.stringify(Object.assign(clone(state),{__at:new Date().toLocaleString('en-IN')})))}catch(e){toast('Could not save checkpoint');return}state.vault.lastCheckpoint=today;state.events.push({type:'CHECKPOINT_CREATED',at:Date.now()});persist();render();toast('Checkpoint created')}
function restoreCheckpoint(){const raw=localStorage.getItem(CPK);if(!raw||!confirm('Replace current data with the checkpoint?'))return;const c=JSON.parse(raw);delete c.__at;const v=state.vault;state=Object.assign(demoState(),c);state.vault=Object.assign({},state.vault,{pass:v.pass,lastBackup:v.lastBackup,lastCheckpoint:v.lastCheckpoint});closeDrawer();persist();render();toast('Checkpoint restored')}
function compareCheckpoint(){const raw=localStorage.getItem(CPK);if(!raw){toast('Create a checkpoint first');return}const c=JSON.parse(raw);const done=a=>a.tasks.filter(t=>t.status==='Completed').length;const rows=[['tasks','Tasks'],['notes','Notes'],['transactions','Transactions'],['workouts','Workouts'],['goals','Goals']].map(([k,l])=>{const d=state[k].length-c[k].length;return `<div class="surface" style="padding:13px;margin-top:8px">${l}: ${c[k].length} → ${state[k].length} (${d>=0?'+':''}${d})</div>`}).join('');openDrawer(`<div class="eyebrow">Checkpoint diff</div><h2>${esc(c.__at||'Checkpoint')} → now</h2><p class="muted-line">Real comparison of item counts. Nothing is replaced unless you choose to.</p><div class="section">${rows}<div class="surface" style="padding:13px;margin-top:8px">Completed tasks: ${done(c)} → ${done(state)}</div></div><div class="actions"><button class="btn" onclick="closeDrawer()">Close</button><button class="btn primary" onclick="restoreCheckpoint()">Restore checkpoint</button></div>`)}
let pendingRestore=null;
function restorePreview(){if(!pendingRestore){toast('No file selected');return}const d=pendingRestore.data;openDrawer(`<div class="eyebrow">Restore preview</div><h2>${esc(pendingRestore.name)}</h2><p class="muted-line">Validated. Nothing has changed yet.</p><div class="grid" style="margin-top:12px">${['tasks','notes','goals','transactions','workouts'].map(k=>`<div class="surface" style="padding:13px">${k} · ${d[k].length}</div>`).join('')}</div><div class="danger-note" style="margin-top:14px">Applying this replaces your current workspace.</div><div class="actions"><button class="btn" onclick="closeDrawer()">Cancel</button><button class="btn primary" onclick="applyRestore()">Replace workspace</button></div>`)}
function applyRestore(){if(!pendingRestore||!confirm('Replace the current workspace with this backup?'))return;state=Object.assign(demoState(),pendingRestore.data);pendingRestore=null;closeDrawer();persist();render();toast('Workspace restored')}
function fileRestore(){const i=document.createElement('input');i.type='file';i.accept='.json,.asbackup';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);const arr=['tasks','notes','goals','planner','habits','workouts','budgets','transactions','decisions'];if(!d||typeof d!=='object'||arr.some(k=>!Array.isArray(d[k]))||typeof d.vault!=='object'||typeof d.focus!=='object'||typeof d.settings!=='object')throw 0;pendingRestore={name:f.name,data:d};restorePreview()}catch(e){pendingRestore=null;toast('Not a valid backup file')}};r.readAsText(f)};i.click()}
function viewProgress(){const done=state.tasks.filter(t=>t.status==='Completed').length;return `<div class="page"><div class="eyebrow">Progress</div><div class="h1">Celebrate real action</div><div class="lead">XP, levels, streaks, and achievements are secondary reinforcement—not the work itself.</div><section class="section grid grid-3"><div class="panel metric"><div class="label">Level</div><div class="value">${levelInfo().lvl}</div><div class="trend">${state.xp} XP</div></div><div class="panel metric"><div class="label">Streak</div><div class="value">${state.streak}</div><div class="trend">days</div></div><div class="panel metric"><div class="label">Completed</div><div class="value">${done}</div><div class="trend">tasks in workspace</div></div></section><section class="section panel"><div class="panel-header"><h2>Weekly review</h2><small>reflection</small></div><div style="padding:18px"><div class="grid grid-3"><div class="surface" style="padding:15px"><div class="eyebrow">What moved</div><div style="margin-top:6px">${done} tasks + ${state.workouts.length} workouts</div></div><div class="surface" style="padding:15px"><div class="eyebrow">Where time went</div><div style="margin-top:6px">${loggedMin()}m focused work</div></div><div class="surface" style="padding:15px"><div class="eyebrow">Next</div><div style="margin-top:6px">${esc(state.goals[0]?.steps.find(x=>!x.done)?.title||'Keep going')}</div></div></div></div></section><section class="section panel"><div class="panel-header"><h2>Achievements</h2><small>quiet reinforcement</small></div><div class="row"><div><div class="row-title">Momentum</div><div class="row-meta">Maintained a ${state.streak}-day habit streak context.</div></div><span class="chip accent">earned</span></div><div class="row"><div><div class="row-title">Deep Work</div><div class="row-meta">100+ minutes of focus logged.</div></div><span class="chip good">earned</span></div></section></div>`}
function viewRules(){return `<div class="page"><div class="eyebrow">Agent activity</div><div class="h1">Useful when it speaks.</div><div class="lead">Deterministic rules observe real state, derive facts, rank candidate actions, explain evidence, ask for approval, then route through existing domain capabilities.</div><section class="section grid grid-2"><div class="panel"><div class="panel-header"><h2>Suggestions</h2><small>attention budget</small></div><div class="row"><div><div class="row-title">Today</div><div class="row-meta">Maximum 1 dominant recommendation + 2–4 supporting signals.</div></div><span class="chip good">quiet</span></div><div class="row"><div><div class="row-title">Current focus</div><div class="row-meta">Suppress irrelevant suggestions while focus is active.</div></div><span class="chip accent">contextual</span></div></div><div class="panel"><div class="panel-header"><h2>Rule inspector</h2><small>why this?</small></div>${RULES.map(r=>`<div class="rule-card"><div class="rule-id">${r.id}</div><div class="rule-name">${esc(r.name)}</div><div class="rule-why">${esc(r.result)}</div><div class="actions"><button class="btn mini" onclick="inspect('rule','${r.id}')">Inspect rule</button></div></div>`).join('')}</div></section><section class="section panel"><div class="panel-header"><h2>Closed loop</h2><small>no fake intelligence</small></div><div style="padding:18px"><div class="chips"><span class="chip">Raw state</span><span class="chip">→ Derived facts</span><span class="chip">→ Rules</span><span class="chip">→ Candidate</span><span class="chip">→ Policy</span><span class="chip">→ User approval</span><span class="chip">→ Domain engine</span><span class="chip">→ Result event</span></div></div></section></div>`}
function viewSettings(){return `<div class="page"><div class="eyebrow">Settings</div><div class="h1">Keep it simple.</div><div class="lead">A few high-signal controls; no settings labyrinth.</div><section class="section panel"><div class="row"><div><div class="row-title">Suggestions</div><div class="row-meta">Control how much the rule engine surfaces.</div></div><select onchange="state.settings.suggestions=this.value;persist();render()" style="background:#0f1216;color:#fff;border:1px solid #2b3038;border-radius:9px;padding:8px"><option ${state.settings.suggestions==='On'?'selected':''}>On</option><option ${state.settings.suggestions==='Reduced'?'selected':''}>Reduced</option><option ${state.settings.suggestions==='Off'?'selected':''}>Off</option></select></div><div class="row"><div><div class="row-title">Density</div><div class="row-meta">Minimal information before progressive disclosure.</div></div><select onchange="state.settings.density=this.value;persist();render()" style="background:#0f1216;color:#fff;border:1px solid #2b3038;border-radius:9px;padding:8px"><option ${state.settings.density==='Minimal'?'selected':''}>Minimal</option><option ${state.settings.density==='Normal'?'selected':''}>Normal</option></select></div><div class="row"><div><div class="row-title">Hide amounts</div><div class="row-meta">Visually suppress money values on screen.</div></div><button class="btn mini" onclick="state.settings.hideAmounts=!state.settings.hideAmounts;persist();render()">${state.settings.hideAmounts?'On':'Off'}</button></div><div class="row"><div><div class="row-title">Theme</div><div class="row-meta">Deep charcoal · warm near-black · restrained accents.</div></div><select onchange="state.settings.theme=this.value;persist();render()" style="background:#0f1216;color:#fff;border:1px solid #2b3038;border-radius:9px;padding:8px">${['Dark','Light','Auto'].map(x=>`<option ${(state.settings.theme||'Dark')===x?'selected':''}>${x}</option>`).join('')}</select></div></section><section class="section panel"><div class="panel-header"><h2>Data controls</h2></div><div class="row"><div><div class="row-title">Export workspace snapshot</div><div class="row-meta">Local JSON export for this static demo state.</div></div><button class="btn mini" onclick="downloadState()">Export</button></div><div class="row"><div><div class="row-title">Beta notice</div><div class="row-meta">Read the welcome notice again.</div></div><button class="btn mini" onclick="showBeta()">View</button></div><div class="row"><div><div class="row-title">Reset demo</div><div class="row-meta">Recreates explicit demo data only.</div></div><button class="btn mini" onclick="resetDemo()">Reset</button></div></section></div>`}
function downloadState(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='astralsurge-workspace-demo.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function viewLegal(){return `<div class="page"><div class="eyebrow">Legal & security</div><div class="h1">Read the source text unchanged.</div><div class="lead">This static redesign intentionally does not invent or paraphrase the application's legal wording. Insert the exact legal/security copy from the authoritative source build before shipping.</div><section class="section panel pad"><div class="danger-note">The provided rearchitecture specification requires the existing legal/security text to remain verbatim. That source text was not included in the uploaded specification itself, so this page does not fabricate it.</div><div class="section"><div class="eyebrow">Required preservation areas</div><div class="chips" style="margin-top:9px"><span class="chip">Local-only processing</span><span class="chip">Hosting metadata</span><span class="chip">GitHub Pages origin warning</span><span class="chip">Encryption claims</span><span class="chip">Passphrase recovery limitation</span><span class="chip">Storage quota risks</span><span class="chip">Health disclaimer</span><span class="chip">Financial disclaimer</span><span class="chip">License notices</span></div></div></div></section></div>`}
let calendarCursor=new Date();calendarCursor.setDate(1);
function shiftCalendar(delta){calendarCursor.setMonth(calendarCursor.getMonth()+delta);render()}
function resetCalendar(){calendarCursor=new Date();calendarCursor.setDate(1);render()}
function viewCalendar(){const y=calendarCursor.getFullYear(),m=calendarCursor.getMonth();const monthLabel=new Date(y,m,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'});const daysInMonth=new Date(y,m+1,0).getDate();const samples=['Focus · 45m','Client meeting','Open time','Demo rehearsal','Workout','Review budget'];return `<div class="page"><div class="eyebrow">Calendar</div><div class="h1">The month at a glance.</div><div class="lead">Aggregated planner entries, tasks, workouts, habits, and recurring financial items remain accessible without becoming the home screen.</div><section class="section panel"><div class="panel-header"><h2>${esc(monthLabel)}</h2><div class="actions" style="margin:0"><button class="btn mini" onclick="shiftCalendar(-1)" aria-label="Previous month">‹</button><button class="btn mini" onclick="resetCalendar()">Today</button><button class="btn mini" onclick="shiftCalendar(1)" aria-label="Next month">›</button></div></div><div style="padding:18px"><div class="cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="cal-h">${x}</div>`).join('')}${Array.from({length:(new Date(y,m,1).getDay()+6)%7},()=>'<div></div>').join('')}${Array.from({length:daysInMonth},(_,i)=>{const iso=isoDate(new Date(y,m,i+1));const items=[];if(iso===today&&state.planner.length)items.push(state.planner.length+' planned');const td=state.tasks.filter(t=>t.due===iso&&t.status!=='Completed').length;if(td)items.push(td+' due');const wk=state.workouts.filter(w=>w.date===iso).length;if(wk)items.push(wk+' workout');return `<div class="cal-d ${iso===today?'today':''}"><b>${i+1}</b>${items.join('<br>')}</div>`}).join('')}</div></div></section></div>`}
function viewReminders(){return `<div class="page"><div class="eyebrow">Remind</div><div class="h1">Reminder tools, separated.</div><div class="lead">One-time alarms and timer tools are distinct from planning. Notification permission is respected.</div><section class="section grid grid-2"><div class="panel pad"><div class="eyebrow">Alarms</div><h2 style="margin:7px 0">2 scheduled</h2><div class="list" style="margin-top:12px"><div class="row"><div><div class="row-title">Hydrate</div><div class="row-meta">11:30</div></div><span class="status-badge open">local</span></div><div class="row"><div><div class="row-title">Call family</div><div class="row-meta">Friday · 19:00</div></div><span class="status-badge open">local</span></div></div></div><div class="panel pad"><div class="eyebrow">Timezone</div><h2 style="margin:7px 0">Asia/Kolkata</h2><div class="muted-line">Current browser clock is used for local time display.</div><div class="actions"><button class="btn" onclick="setNav('timer')">Open timer tools</button></div></div></section></div>`}
function viewTimer(){return `<div class="page"><div class="eyebrow">Time tools</div><div class="h1">Timer tools.</div><div class="lead">Countdown, stopwatch, laps, and local clock remain a focused utility rather than a dashboard.</div><section class="section panel focus-panel"><div style="text-align:center"><div class="eyebrow">Countdown</div><div id="tool-timer" style="font-size:64px;letter-spacing:-.06em;font-variant-numeric:tabular-nums;margin:10px 0">${fmtClock(standalone)}</div><div class="actions" style="justify-content:center"><button class="btn primary" onclick="startStandaloneTimer()">Start</button><button class="btn" onclick="stopStandalone();toast('Timer paused')">Pause</button><button class="btn" onclick="resetStandaloneTimer()">Reset</button></div></div></section></div>`}
let standalone=1500,standaloneHandle=null;function startStandaloneTimer(){if(standaloneHandle)return;if(standalone===0)standalone=1500;standaloneHandle=setInterval(()=>{standalone=Math.max(0,standalone-1);const e=document.getElementById('tool-timer');if(e)e.textContent=fmtClock(standalone);if(standalone===0){stopStandalone();toast('Timer finished')}},1000);toast('Timer started')};function stopStandalone(){clearInterval(standaloneHandle);standaloneHandle=null};function resetStandaloneTimer(){stopStandalone();standalone=1500;render()}
function search(q){const needle=q.trim().toLowerCase();if(!needle)return [];const out=[];state.tasks.forEach(t=>{if([t.title,t.desc,...(t.tags||[])].join(' ').toLowerCase().includes(needle))out.push({type:'Task',title:t.title,id:t.id,context:`${t.status} · ${t.priority}`})});state.notes.forEach(n=>{if([n.title,n.content,...(n.tags||[])].join(' ').toLowerCase().includes(needle))out.push({type:'Note',title:n.title,id:n.id,context:'Memory'})});state.goals.forEach(g=>{if(g.title.toLowerCase().includes(needle))out.push({type:'Goal',title:g.title,id:g.id,context:'Goals'})});state.transactions.forEach(t=>{if([t.title,t.category].join(' ').toLowerCase().includes(needle))out.push({type:'Transaction',title:t.title,id:t.id,context:`${t.category} · ${money(t.amount)}`})});return out.slice(0,10)}
function globalSearch(){if(state.vault.locked||!betaAck())return;openModal(()=>`<div class="modal-inner"><div class="split"><div><div class="eyebrow">Global search</div><h2 id="modal-title" style="margin:4px 0">Find anything</h2></div><button class="btn icon-btn" onclick="closeModal()">×</button></div><div class="field" style="margin-top:16px"><label>Workspace retrieval</label><input id="search-input" autofocus placeholder="Try proposal, launch, food…" oninput="drawSearchResults(this.value)"></div><div id="search-results" style="margin-top:12px"></div></div>`);drawSearchResults('');setTimeout(()=>document.getElementById('search-input')?.focus(),30)}
function drawSearchResults(q){
 const e=document.getElementById('search-results');
 if(!e)return;
 const needle=q.trim();
 if(!needle){e.innerHTML='<div class=\"empty\"><strong>Search the whole workspace.</strong>Tasks, projects, goals, notes, transactions, workouts, planner entries, history, and commands.</div>';return;}
 const r=search(q);
 if(!r.length){e.innerHTML='<div class=\"empty\"><strong>No matching workspace objects.</strong>Search is deterministic: titles, categories, tags, dates, and entity types.</div>';return;}
 e.innerHTML=r.map(x=>`<div class=\"row surface\" style=\"margin-bottom:7px;border:1px solid var(--line)\"><div><div class=\"row-title\">${esc(x.title)}</div><div class=\"row-meta\">${x.type} · ${esc(x.context)}</div></div><button class=\"btn mini\" onclick=\"searchOpen('${x.type}','${esc(x.id)}')\">Open</button></div>`).join('');
}
function searchOpen(type,id){closeModal();if(type==='Task')inspect('task',id);else if(type==='Note'){const n=state.notes.find(x=>x.id===id);openModal(noteModal,n)}else if(type==='Goal')setNav('goals');else if(type==='Transaction')setNav('money')}
function navItems(){return [['today','Today','◉'],['work','Work','✓'],['focus','Focus','◌'],['plan','Plan','⌁'],['more','More','＋']]}
function renderShell(content){const n=nav();const grp=['calendar','reminders','timer'].includes(n)?'plan':['today','work','focus','plan'].includes(n)?n:'more';return `<div class="app ${state.settings.density==='Minimal'?'dens-min':''}"><aside class="sidebar"><div class="brand"><div class="brand-mark">AS</div><div><b>AstralSurge <i style="font-style:normal;font-size:9px;color:var(--amber);border:1px solid #473a25;border-radius:99px;padding:1px 5px;margin-left:4px">BETA</i></b><span>private operating system</span></div></div><nav class="nav">${navItems().map(([id,label,ic])=>`<button class="${grp===id?'active':''}" onclick="setNav('${id}')"><span class="icon">${ic}</span>${label}</button>`).join('')}</nav><div class="sidebar-bottom"><div class="status"><div class="status-top"><span><i class="dot"></i>Local</span><span>${state.mode==='demo'?'Demo':'Private'}</span></div><div style="font-size:12px;margin-top:8px">${facts().openCount} open · Lv ${levelInfo().lvl} · ${state.xp} XP</div><div class="bar xp"><i style="width:${levelInfo().pct}%"></i></div><div class="quiet" style="margin-top:5px">${levelInfo().left} XP to next level</div><button class="btn mini" style="width:100%;margin-top:10px" onclick="setNav('vault')">Vault health</button></div></div></aside><main class="main"><header class="topbar"><div class="topbar-left"><div class="crumb">AstralSurge / ${esc(n.charAt(0).toUpperCase()+n.slice(1))}</div><button class="btn icon-btn" onclick="globalSearch()" aria-label="Search">⌕</button><span class="chip" id="clock"></span>${focusPill()}</div><div class="top-actions"><div class="search"><input aria-label="Search workspace" placeholder="Search workspace" onclick="globalSearch()"><span>⌘K</span></div><button class="btn primary" onclick="globalCreate()" aria-label="Create">＋<span> Create</span></button><button class="btn icon-btn" onclick="setNav('settings')">⚙</button></div></header>${content}<nav class="mobile-nav">${navItems().map(([id,label,ic])=>`<button class="${grp===id?'active':''}" onclick="setNav('${id}')"><span class="icon">${ic}</span><span>${label}</span></button>`).join('')}</nav></main></div>`}
function moreIndex(){return `<div class="page"><div class="eyebrow">More</div><div class="h1">The rest, when you need it.</div><div class="lead">Secondary contexts keep the primary experience calm without removing any capability.</div><section class="section grid grid-3">${[['goals','Goals','Roadmaps & milestones'],['life','Life','Fitness, habits, reminders'],['money','Money','Budgets, decisions, reality'],['memory','Memory','Notes, history, recovery'],['progress','Progress','XP, streaks, weekly review'],['rules','Agent activity','Suggestions & rule inspector'],['vault','Vault','Backup, checkpoints, restore'],['calendar','Calendar','Month view & aggregation'],['reminders','Reminders','Alarms & notifications'],['timer','Time tools','Countdown & stopwatch'],['settings','Settings','Preferences & data controls'],['legal','Legal','Source-of-truth legal copy']].map(x=>`<button class="btn" style="text-align:left;min-height:106px" onclick="setNav('${x[0]}')"><b style="font-size:14px">${x[1]}</b><span class="muted-line" style="display:block;margin-top:7px">${x[2]}</span></button>`).join('')}</section><div class="footer-note">THE USER BRINGS INTENT · THE SYSTEM UNDERSTANDS CONTEXT · THE USER REMAINS IN CONTROL.</div></div>`}
let lastRoute=null;
function lockScreen(){return `<div class="page" style="max-width:480px;padding-top:12vh;text-align:center"><div class="brand-mark" style="margin:0 auto 18px">AS</div><div class="eyebrow">Vault locked</div><div class="h1">Welcome back.</div><div class="lead" style="margin:0 auto">Your workspace is hidden until you unlock it.</div>${state.vault.pass?`<div class="field" style="max-width:300px;margin:18px auto 0"><input id="unlock-input" type="password" placeholder="Passphrase" onkeydown="if(event.key==='Enter')unlockVault()"></div>`:''}<div class="actions" style="justify-content:center"><button class="btn primary" onclick="unlockVault()">Unlock</button></div></div>`}
function render(){applyTheme();const n=nav();const y=lastRoute===n?window.scrollY:0;let c='';if(n==='today')c=viewToday();else if(n==='work')c=viewWork();else if(n==='focus')c=viewFocus();else if(n==='plan')c=viewPlan();else if(n==='more')c=moreIndex();else if(n==='goals')c=viewGoals();else if(n==='life')c=viewLife();else if(n==='money')c=viewMoney();else if(n==='memory')c=viewMemory();else if(n==='progress')c=viewProgress();else if(n==='rules')c=viewRules();else if(n==='vault')c=viewVault();else if(n==='calendar')c=viewCalendar();else if(n==='reminders')c=viewReminders();else if(n==='timer')c=viewTimer();else if(n==='settings')c=viewSettings();else if(n==='legal')c=viewLegal();else c=viewToday();document.getElementById('app').innerHTML=!betaAck()?betaScreen():state.vault.locked?lockScreen():renderShell(c);if(!state.focus.active)document.title='AstralSurge OS';lastRoute=n;window.scrollTo(0,y);tickClock();if(timerHandle)clearInterval(timerHandle);if(state.focus.active)timerHandle=setInterval(tick,1000)}
window.addEventListener('hashchange',()=>{closeModal();closeDrawer();render()});window.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();globalSearch()}if(e.key==='Escape'){closeModal();closeDrawer()}});

// Inline HTML handlers run in the global scope. The app itself is intentionally
// enclosed in an IIFE, so expose only the interaction API they need.
Object.defineProperty(window,'state',{configurable:true,get:()=>state});
Object.assign(window,{demoState,load,persist,resetDemo,toast,nav,setNav,formatDay,dateShort,taskById,facts,daysSince,
  recommendation,actionForRec,completeTask,startFocus,scheduleTask,stopFocus,resumeFocus,pauseFocus,tick,renderFocusTimerOnly,
  openModal,closeModal,openDrawer,closeDrawer,taskModal,saveTask,noteModal,saveNote,expenseModal,saveExpense,decisionModal,reconcile,
  createGoalModal,saveGoal,globalCreate,inspect,viewToday,viewWork,viewFocus,viewPlan,viewGoals,executeStep,viewLife,toggleHabit,
  logWorkout,viewMoney,viewMemory,convertNote,vaultDrawer,viewVault,toggleLock,backupWorkspace,createCheckpoint,compareCheckpoint,
  fileRestore,shiftCalendar,resetCalendar,viewProgress,viewRules,viewSettings,downloadState,viewLegal,viewCalendar,viewReminders,viewTimer,startStandaloneTimer,
  stopStandalone,resetStandaloneTimer,addSub,toggleSub,delSub,addItem,toggleItem,delItem,addBudget,setPassphrase,unlockVault,restoreCheckpoint,acceptBeta,showBeta,setFocusLen,deleteTask,deleteNote,doneStep,removeBlock,restorePreview,applyRestore,openSlot,dropBlocks,fmtClock,recommendationRaw,search,globalSearch,drawSearchResults,searchOpen,navItems,renderShell,moreIndex,render});

setInterval(tickClock,1000);render();
})();
</script>
